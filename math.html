<script>
  // אתר אחד לכל הכיתות: מי שכבר בחר כיתה – עובר אליה ישר (אלא אם ביקש להחליף)
  (function () {
    var p = new URLSearchParams(location.search), g = null, ok = false;
    try {
      g = localStorage.getItem('math-grade');
      if (p.has('role')) localStorage.removeItem('math-role');
      var L = function (k) { return localStorage.getItem(k); };
      // נכנסים ישר רק מי שכבר בחר/ה: תלמיד/הורה או מורה (עם קוד)
      ok = L('math-book-key') === 'e1050f14' || L('math-teacher-key') === '3d9bf467' || L('math-role') === 's' || (L('math-role') === 't' && L('math-staff-key') === '1a9e025e');
    } catch (e) { ok = true; }
    // ?role – תמיד מציגים את הבחירה: תלמיד/הורה או מורה
    if (p.has('role')) ok = false;
    window.ROLE_OK = ok;
    if (ok && !p.has('choose') && ['1', '2', '3', '4', '5', '6'].indexOf(g) >= 0) {
      if (g !== '6') p.set('grade', g);
      var s = p.toString().replace(/=(&|$)/g, '$1');
      location.replace('math6.html' + (s ? '?' + s : '') + location.hash);
    }
  })();
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="wcwash" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="14"></feDisplacementMap><feGaussianBlur stdDeviation="0.8"></feGaussianBlur></filter></defs></svg>
<div class="wrap">
  <div class="hero"><h1>מתרגלים מתמטיקה</h1></div>
  <div class="sig">מאת <b>איריס סגל</b></div>
  <section id="roleStep" hidden>
    <h2>מי נכנס/ת?</h2>
    <div class="roles">
      <button type="button" id="rS"><span class="ri">🎒</span>אני תלמיד/ה / הורה</button>
      <button type="button" id="rT"><span class="ri">👩‍🏫</span>אני מורה</button>
    </div>
  </section>
  <section id="gradeStep">
  <h2>איזו רמת כיתה אתם מתרגלים?</h2>
  <nav class="grades" aria-label="בחירת כיתה">
    <a href="math6.html?grade=1" data-g="1" style="--c:#d9482b"><b>א'</b><span>כיתה א'</span></a>
    <a href="math6.html?grade=2" data-g="2" style="--c:#e2b357"><b>ב'</b><span>כיתה ב'</span></a>
    <a href="math6.html?grade=3" data-g="3" style="--c:#9db27a"><b>ג'</b><span>כיתה ג'</span></a>
    <a href="math6.html?grade=4" data-g="4" style="--c:#6fb3ad"><b>ד'</b><span>כיתה ד'</span></a>
    <a href="math6.html?grade=5" data-g="5" style="--c:#d98a9a"><b>ה'</b><span>כיתה ה'</span></a>
    <a href="math6.html" data-g="6" style="--c:#7fa8d6"><b>ו'</b><span>כיתה ו'</span></a>

  <p class="note">האתר יזכור את הבחירה. אפשר להחליף כיתה בכל רגע – בראש הדף, ליד שם הכיתה.</p>

</div>
<script>
// כניסה: תלמיד/הורה או מורה, ואז השם
(function () {
  function hash(s) { var x = 0x811c9dc5; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16); }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var roleStep = document.getElementById('roleStep'), gradeStep = document.getElementById('gradeStep');
  var nm0 = ''; try { nm0 = localStorage.getItem('math-name') || ''; } catch (e) {}
  // אחרי הבחירה: אם כבר נבחרה כיתה – ממשיכים אליה, אחרת בוחרים כיתה
  function next() {
    var g = null; try { g = localStorage.getItem('math-grade'); } catch (e) {}
    var p = new URLSearchParams(location.search); p.delete('role');
    if (!p.has('choose') && ['1', '2', '3', '4', '5', '6'].indexOf(g) >= 0) {
      if (g !== '6') p.set('grade', g);
      var s = p.toString().replace(/=(&|$)/g, '$1');
      location.replace('math6.html' + (s ? '?' + s : ''));
      return;
    }
    roleStep.hidden = true; gradeStep.hidden = false;
  }
  function modal(html, wire) {
    var ov = document.createElement('div');
    ov.className = 'ct-ov';
    ov.innerHTML = '<div class="ct-box" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(ov);
    wire(ov, function () { ov.remove(); });
    var f = ov.querySelector('input'); if (f) setTimeout(function () { f.focus(); }, 50);
  }
  function student() {
    modal('<h2>שלום! איך קוראים לך?</h2><div>כתבו <b>שם מלא</b> – שם פרטי ושם משפחה, כדי שהמורה תדע מי תרגל.</div>' +
      '<input class="rl-in" id="sNm" maxlength="40" autocomplete="off" placeholder="שם פרטי ושם משפחה" value="' + esc(nm0) + '">' +
      '<div class="rl-err" id="sErr"></div><div class="small" style="font-size:.85rem;color:#5f5a50">השם ובאילו פעילויות עבדתם נשמרים אצל המורה בלבד. לא חובה – אפשר ללחוץ "בלי שם".</div>' +
      '<div class="ct-acts"><button type="button" class="ct-main" id="sOk">כניסה ←</button><button type="button" id="sSkip">בלי שם</button><button type="button" id="sBack">חזרה</button></div>',
      function (ov, close) {
        var inp = ov.querySelector('#sNm');
        ov.querySelector('#sOk').onclick = function () {
          var nm = inp.value.trim().replace(/\s+/g, ' ');
          if (nm.split(' ').length < 2) { ov.querySelector('#sErr').textContent = 'כתבו גם שם משפחה 🙂'; inp.focus(); return; }
          set('math-role', 's'); set('math-name', nm); close(); next();
        };
        ov.querySelector('#sSkip').onclick = function () { set('math-role', 's'); try { sessionStorage.setItem('math-noname', '1'); } catch (e) {} close(); next(); };
        ov.querySelector('#sBack').onclick = close;
        inp.onkeydown = function (e) { if (e.key === 'Enter') ov.querySelector('#sOk').click(); };
      });
  }
  function teacher() {
    modal('<h2>👩‍🏫 כניסת מורה</h2><div>כתבו את השם שלכם ואת קוד המורים שקיבלתם מאיריס.</div>' +
      '<input class="rl-in" id="tNm" maxlength="40" autocomplete="off" placeholder="שם ושם משפחה" value="' + esc(nm0) + '">' +
      '<input class="rl-in" id="tCode" type="password" inputmode="numeric" autocomplete="off" placeholder="קוד מורים">' +
      '<div class="rl-err" id="tErr"></div>' +
      '<div class="ct-acts"><button type="button" class="ct-main" id="tOk">כניסה ←</button><button type="button" id="tBack">חזרה</button></div>' +
      '<div class="rq-box"><b>אין לכם קוד?</b> שלחו לאיריס מייל קצר, והיא תשלח לכם את הקוד.<div class="ct-acts"><button type="button" id="tReq">✉️ בקשת קוד במייל</button><button type="button" id="tCopy">העתקת הכתובת</button></div><div class="ct-mail" id="tMail" hidden></div><div class="ct-note" id="tNote"></div></div>',
      function (ov, close) {
        var err = function (t) { ov.querySelector('#tErr').textContent = t; };
        ov.querySelector('#tOk').onclick = function () {
          var nm = ov.querySelector('#tNm').value.trim().replace(/\s+/g, ' '), code = ov.querySelector('#tCode').value.trim();
          if (!nm) { err('כתבו את השם 🙂'); return; }
          if (hash('staff:' + code) === '1a9e025e') set('math-staff-key', '1a9e025e');
          else if (hash('math6:' + code) === '3d9bf467') set('math-teacher-key', '3d9bf467');
          else if (hash('book:' + code) === 'e1050f14') set('math-book-key', 'e1050f14');
          else { err('הקוד לא נכון.'); return; }
          set('math-role', 't'); set('math-name', nm); close(); next();
        };
        ov.querySelector('#tBack').onclick = close;
        var MAIL = ['iris.segal.ai', 'gmail.com'].join('@');
        ov.querySelector('#tReq').onclick = function () {
          var nm = ov.querySelector('#tNm').value.trim();
          var body = 'שלום איריס,\n\nשמי ' + (nm || '_____') + ', אני מורה ב_____ (בית ספר), ומלמד/ת כיתות _____.\nכתובת המייל שלי: _____\nאשמח לקבל את קוד המורים לאתר "מתרגלים מתמטיקה".\n\nתודה!';
          location.href = 'mailto:' + MAIL + '?subject=' + encodeURIComponent('בקשת קוד מורים – מתרגלים מתמטיקה') + '&body=' + encodeURIComponent(body);
          var m = ov.querySelector('#tMail'); m.textContent = MAIL; m.hidden = false;
          ov.querySelector('#tNote').textContent = 'אם לא נפתח מייל – אפשר לכתוב לכתובת הזו.';
        };
        ov.querySelector('#tCopy').onclick = function () {
          var m = ov.querySelector('#tMail'), note = ov.querySelector('#tNote');
          m.textContent = MAIL; m.hidden = false;
          try { navigator.clipboard.writeText(MAIL).then(function () { note.textContent = 'הכתובת הועתקה ✔'; }, function () {}); } catch (e) {}
        };
        ov.querySelector('#tCode').onkeydown = function (e) { if (e.key === 'Enter') ov.querySelector('#tOk').click(); };
      });
  }
  document.getElementById('rS').onclick = student;
  document.getElementById('rT').onclick = teacher;
  document.getElementById('roleSw').onclick = function () { roleStep.hidden = false; gradeStep.hidden = true; };
  if (!window.ROLE_OK) { roleStep.hidden = false; gradeStep.hidden = true; }
  // ההחלפה בין תלמיד למורה – רק במכשיר שיש בו קוד מורה. תלמידים לא רואים אותה
  var L = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  if (!(L('math-book-key') === 'e1050f14' || L('math-teacher-key') === '3d9bf467' || L('math-staff-key') === '1a9e025e')) document.getElementById('roleSw').hidden = true;
})();
</script>
<script>
  // שומרים את הבחירה, ומעבירים הלאה גם פרמטרים נוספים (למשל ?print)
  var extra = new URLSearchParams(location.search); extra.delete('choose');
  document.querySelectorAll('[data-g]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      try { localStorage.setItem('math-grade', a.dataset.g); } catch (err) {}
      var p = new URLSearchParams(extra.toString());
      if (a.dataset.g !== '6') p.set('grade', a.dataset.g);
      var s = p.toString().replace(/=(&|$)/g, '$1');
      location.href = 'math6.html' + (s ? '?' + s : '') + location.hash;
    });
  });
</script>
<script>
// כפתור "יצירת קשר": הכתובת מופיעה רק בחלון שנפתח בלחיצה
(() => {
  const MAIL = ['iris.segal.ai', 'gmail.com'].join('@');
  const open = () => {
    const ov = document.createElement('div');
    ov.className = 'ct-ov';
    ov.innerHTML = `<div class="ct-box" role="dialog" aria-modal="true" aria-labelledby="ctT">
      <h2 id="ctT">יצירת קשר</h2><div>אפשר לכתוב לאיריס במייל:</div>
      <div class="ct-mail" data-raw>${MAIL}</div>
      <div class="ct-acts"><button type="button" class="ct-main" id="ctCopy">העתקת הכתובת</button><a href="mailto:${MAIL}" id="ctSend">שליחת מייל</a><button type="button" id="ctClose">סגירה</button></div>
      <div class="ct-note" id="ctNote"></div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.querySelector('#ctClose').onclick = close;
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
    ov.querySelector('#ctCopy').onclick = () => {
      const note = ov.querySelector('#ctNote');
      const done = () => { note.textContent = 'הכתובת הועתקה – אפשר להדביק אותה בג׳ימייל.'; };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(ov.querySelector('.ct-mail')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); note.textContent = 'הכתובת מסומנת – לחצו Ctrl+C כדי להעתיק.'; };
      try { navigator.clipboard.writeText(MAIL).then(done, fallback); } catch (e) { fallback(); }
    };
    ov.querySelector('#ctCopy').focus();
  };
  document.addEventListener('click', e => { if (e.target.closest('.ct-btn')) open(); });
})();
</script>
<script>
// כפתור "פרטיות": מה האתר שומר ושולח
(() => {
  const open = () => {
    const ov = document.createElement('div');
    ov.className = 'ct-ov pv-ov';
    ov.innerHTML = `<div class="ct-box pv-box" role="dialog" aria-modal="true" aria-labelledby="pvT" data-raw>
      <h2 id="pvT">🔒 פרטיות – מה נשמר באתר</h2>
      <div class="pv-body">
        <p><b>מה נשלח למורה:</b></p>
        <ul>
          <li>השם שכתבתם בכניסה (לא חובה – אפשר ללחוץ "בלי שם")</li>
          <li>הכיתה שבחרתם באתר</li>
          <li>באילו פעילויות עבדתם – שיעורים, תרגולים, משחקים – וכמה זמן</li>
          <li>מורים שנכנסו עם קוד המורים – השם ובאילו פעילויות השתמשו. כרטיסי יציאה שמורה מריצה בכיתה שלה מוצגים רק על המסך ולא נשלחים</li>
          <li>אילו דפים הדפסתם או שמרתם</li>
          <li>בסיום תרגול, מבחן, כרטיס יציאה ובאימון למבחן – כמה תשובות נכונות</li>
          <li>באימון הכפל – רק מי שהקליד את קוד הכיתה – גם ההתקדמות באימון</li>
        </ul>
        <p><b>מה לא נשמר:</b> מייל, טלפון, כתובת, תמונות, וגם לא התשובות עצמן ולא תוצאות המשחקים.</p>
        <p><b>למה:</b> כדי שהמורה תוכל לעקוב אחרי התרגול ולהתאים את ההוראה.</p>
        <p><b>מי רואה:</b> רק המורה איריס סגל. המידע נשמר בחשבון שלה ולא מועבר לאף אחד.</p>
        <p><b>במכשיר עצמו:</b> הדפדפן שומר את ההתקדמות שלכם כדי שתוכלו להמשיך מאיפה שעצרתם. זה נשאר אצלכם ולא נשלח.</p>
        <p><b>מחיקה ושאלות:</b> אפשר לבקש למחוק מידע שנשמר – דרך כפתור "יצירת קשר" בתחתית האתר.</p>
      </div>
      <div class="ct-acts"><button type="button" class="ct-main" id="pvClose">הבנתי</button></div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.querySelector('#pvClose').onclick = close;
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
    ov.querySelector('#pvClose').focus();
  };
  document.addEventListener('click', e => { if (e.target.closest('.pv-btn')) open(); });
})();
</script>
</body>
</html>
