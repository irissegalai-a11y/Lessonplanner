<script>try { if (localStorage.getItem('math-calm') === '1') document.documentElement.classList.add('calm'); } catch (e) {}
// בלי כיתה בכתובת – הכיתה שנבחרה במסך הבחירה, ואם עוד לא נבחרה – למסך בחירת הכיתה
(function () { var q = new URLSearchParams(location.search), g = null; if (/^[1-6]$/.test(q.get('grade') || '')) { try { localStorage.setItem('nb-grade', q.get('grade')); } catch (e) {} return; } try { g = localStorage.getItem('nb-grade'); } catch (e) {}
  if (g && /^[1-6]$/.test(g)) { q.set('grade', g); history.replaceState(null, '', '?' + q + location.hash); } else location.replace('nbchoose.html'); })();</script>
</head>
<body>
<a class="sr-only" href="#view">דילוג לתוכן</a>
<div class="app">
  <header class="top" id="top">
    <a class="brand" href="#" id="brand" aria-label="MathInClass – לדף הבית"><span class="lg">Math<i>In</i>Class</span><span class="by">מאת איריס סגל · <b>גרסת ניסיון</b></span></a>
    <div class="search" role="search">
      <svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="חיפוש נושא, שיעור, משחק או קורס" autocomplete="off" aria-label="חיפוש נושא" aria-controls="qres">
      <div class="sres" id="qres" hidden></div>
    </div>
    <div class="acts" id="acts"></div>
  </header>
  <nav class="rail" id="rail" aria-label="ניווט ראשי"></nav>
  <main class="main">
    <div class="view" id="view" tabindex="-1"></div>
    <section class="stage off" id="stage" aria-label="מחברת פתוחה">
      <div class="shead" id="shead"></div>
      <aside class="side-toc" id="toc" aria-label="שלבי הנושא"></aside>
      <nav class="divs" id="divs" aria-label="חוצצים במחברת"></nav>

    </section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="ניווט ראשי"></nav>
