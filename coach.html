  }
  // משפט הפתיחה האישי לשיעור – לפי מה שנמצא באבחון ולפי הגרסה
  function coachIntro() {
    const u = st.unit, U = K.units[u.id], why = (K.WHY || {})[u.id] || {};
    const tags = Object.assign({}, (st.diagSummary || {}).tags || {}, st.tag && st.tag !== 'none' ? { [st.tag]: 1 } : {});
    const hit = Object.keys(why).find(t => tags[t]);
    const doneN = (st.path || []).filter(p => !p.optional && st.done[p.id]).length;
    const pre = doneN ? `כבר השלמת ${doneN} ${doneN === 1 ? 'שיעור' : 'שיעורים'} – כל הכבוד! ` : '';
    if (U.deep) return pre + 'הגעת לאתגר המומחים, כי הראית שליטה בכל השאר. כאן חושבים לעומק – קחו את הזמן.';
    if (hit) return pre + why[hit];
    const sk = K.SKILLS[[].concat(U.skill)[0]];
    if (u.ver === 'reinforce') return pre + `באבחון חלק מהתשובות בנושא "${sk}" הצליחו וחלק לא. היום נחזק את זה עד שזה יושב טוב.`;
    if ((st.skills || {})[[].concat(U.skill)[0]] === 'notyet') return pre + `הנושא "${sk}" עוד לא יושב טוב, אז נלמד אותו מההתחלה – צעד אחר צעד. אני כאן אם צריך.`;
    return pre + 'בואו נתחיל. אני כאן אם צריך עזרה.';
  }
  function screen() {
    const list = screens();
    const sc = list[st.unit.i];
    if (!sc) return course();
    cur = null;
    const U = K.units[st.unit.id];
    if (sc.kind === 'warm') {
      const b = frame(1, '<h3>שאלת חימום</h3><div id="ib"></div>');
      askItem($('ib'), sc.item, 'learn', rec => { log('warm', { ok: rec.pass }); if (!rec.pass) st.unit.ev.warmMiss = true; next(); });
    } else if (sc.kind === 'goal') {
      const b = frame(1, `${coachSay(coachIntro())}<h3>מה נלמד היום?</h3><p style="font-size:1.15rem">${R(sc.html)}</p><div class="row"><button id="nx">בואו נתחיל</button></div>`);
      $('nx').onclick = next;
    } else if (sc.kind === 'cutlab') cutlab();
    else if (sc.kind === 'info') {
      frame(sc.step, `<h3>${R(sc.title)}</h3>${R(sc.html)}${sc.anim ? '<div id="anim"></div>' : ''}${fig(sc.fig)}<div class="row"><button id="nx">הבנתי, ממשיכים</button>${siteOf(st.unit.id).learn ? '<button class="sec" id="lsn">📖 רוצים עוד הסבר? לשיעור המלא</button>' : ''}</div>`);
      if (sc.anim) halfAnim($('anim'));
      if ($('lsn')) $('lsn').onclick = lessonModal;
      $('nx').onclick = next;
    } else if (sc.kind === 'contrast') {
      const c = U.contrast[st.tag] || U.contrast.none;
      frame(2, `<h3>${c.title}</h3>${R(c.html)}${fig(c.fig)}<div id="aft"></div><div class="row"><button id="nx">${c.after ? 'מה התשובה?' : 'הבנתי, ממשיכים'}</button></div>`);
      $('nx').onclick = () => {
        if (c.after && !$('aft').innerHTML) { $('aft').innerHTML = R(c.after) + fig(c.fig2); $('nx').textContent = 'הבנתי, ממשיכים'; return; }
        next();
      };
    } else if (sc.kind === 'practice') practice(sc, 0);
    else if (sc.kind === 'notebook') notebook(sc);
    else if (sc.kind === 'more') more();
    else if (sc.kind === 'sheet') sheet();
    else if (sc.kind === 'check') check(sc);
    else if (sc.kind === 'summary') summary();
  }
  function halfAnim(el) {
    const seq = [[1, 2, 1], [2, 4, 2], [4, 8, 4]];
    let i = 0;
    const show = () => { if (!document.body.contains(el)) return; const [n, d, g] = seq[i]; el.innerHTML = `<div class="bigmx">${R('⟦' + n + '/' + d + '⟧')}</div>` + fig({ k: 'bar', n, d, g, w: 320 }); i = (i + 1) % seq.length; setTimeout(show, 1600); };
    show();
  }

  // מעבדת החיתוך – הקניית ההרחבה
  function cutlab() {
    const b = frame(2, `<h3>בואו נבין</h3><p>בפס הזה 4 חלקים שווים, ו-3 מהם צבועים: ${R('⟦3/4⟧')}.</p><div id="barv"></div><div id="labq"></div><table class="cut" id="tbl" hidden><tr><th>חתכנו כל חלק ל…</th><th>השבר</th></tr><tr><td>(בלי חיתוך)</td><td>${R('⟦3/4⟧')}</td></tr></table>`);
    const show = k => { $('barv').innerHTML = `<div class="bigmx">${R(`⟦${3 * k}/${4 * k}⟧`)}</div>` + fig({ k: 'bar', n: 3 * k, d: 4 * k, g: k, w: 340 }); };
    const addRow = (lbl, k) => { $('tbl').hidden = false; $('tbl').insertAdjacentHTML('beforeend', `<tr><td>${lbl}</td><td>${R(`⟦${3 * k}/${4 * k}⟧`)}</td></tr>`); };
    show(1);
    const q = $('labq');
    q.innerHTML = '<div class="row"><button id="c2">✂️ חתכו כל חלק לשניים</button></div>';
    $('c2').onclick = () => {
      show(2); addRow('2', 2);
      q.innerHTML = '<div id="ib"></div>';
      askItem($('ib'), { id: 'L1', type: 'choice', q: 'מה קרה לחלק הצבוע של הפס?', ans: 2,
        opts: [{ t: 'גדל', msg: 'נכון שיש עכשיו יותר חלקים צבועים: 6 במקום 3. אבל כל חלק קטן יותר. הסתכלו על הפס: האם הצבע הגיע רחוק יותר?' },
          { t: 'קטן', msg: 'כל חלק באמת קטן יותר, אבל יש יותר חלקים צבועים. הסתכלו על כל השטח הצבוע יחד.' }, { t: 'נשאר אותו דבר' }],
        hints: ['השוו את המקום שבו הצבע נגמר – לפני ואחרי החיתוך.'], exp: 'הצבע מגיע בדיוק לאותו מקום. ⟦3/4 = 6/8⟧.' }, 'learn', () => step3());
    };
    function step3() {
      q.innerHTML = '<p>עכשיו נחתוך את הפס המקורי, כל חלק <b>לשלושה</b>.</p><div class="row"><button id="c3">✂️ חתכו כל חלק לשלושה</button></div>';
      $('c3').onclick = () => {
        $('barv').innerHTML = fig({ k: 'bar', n: 9, d: 12, g: 3, w: 340 });
        q.innerHTML = '<p>ספרו בציור וכתבו את השבר:</p><div id="ib"></div>';
        askItem($('ib'), { id: 'L2', type: 'open', q: 'כמה חלקים צבועים (למעלה), ומכמה חלקים בסך הכול (למטה)?', check: (n, d) => n === 9 && d === 12,
          bad: (n, d) => (n === 12 && d === 9) ? 'החלפתם בין המונה למכנה: למעלה – הצבועים, למטה – כל החלקים.' : '',
          hints: ['כל רבע נחתך ל-3. כמה חלקים יש עכשיו בכל הפס? כמה מהם צבועים?'], exp: '⟦3/4 = 9/12⟧.' }, 'learn', () => {
          show(3); addRow('3', 3);
          q.innerHTML = '<div class="row"><button id="c4">✂️ ועכשיו כל חלק לארבעה</button></div>';
          $('c4').onclick = () => {
            show(4); addRow('4', 4);
            q.innerHTML = '<div id="ib"></div>';
            askItem($('ib'), { id: 'L3', type: 'choice', q: 'הסתכלו בטבלה. מה קרה למונה ולמכנה כשחתכנו כל חלק לשלושה?', ans: 0,
              opts: [{ t: 'שניהם גדלו פי 3' }, { t: 'לשניהם הוסיפו 3', msg: 'בדקו: ⟦3 + 3⟧ זה 6, אבל המונה נהיה 9. מה עושים ל-3 כדי לקבל 9?' }, { t: 'רק המכנה גדל פי 3', msg: 'גם המונה השתנה: מ-3 ל-9. פי כמה?' }],
              hints: ['השוו את ⟦3/4⟧ ל-⟦9/12⟧: מה עשינו ל-3 כדי לקבל 9, ומה ל-4 כדי לקבל 12?'], exp: 'מ-3 ל-9 ומ-4 ל-12: שניהם גדלו פי 3.' }, 'learn', rec => { st.unit.ev.labOk = rec.pass; next(); });
          };
        });
      };
    }
  }

  function practice(sc, j) {
    const item = sc.items[j];
    if (!item) return next();
    frame(sc.step, `<h3>${R(sc.title)} <span class="muted small">(${j + 1} מתוך ${sc.items.length})</span></h3>${fig(item.figTop)}<div id="ib"></div>`);
    askItem($('ib'), item, 'learn', rec => { if (rec.fixed) st.unit.ev.fixed = true; if (rec.firstTag === 'additive') st.unit.ev.additive = true; save(); practice(sc, j + 1); });
  }

  function notebook(sc) {
    frame(3, `<h3>עכשיו במחברת ✏️</h3>${R(sc.html)}<div class="row"><button id="nb">סיימתי במחברת</button></div><div id="nb2"></div>`);
    $('nb').onclick = () => {
      $('nb').remove();
      $('nb2').innerHTML = `<div class="fb info"><b>השוו לציור הזה:</b>${fig(sc.model)}${sc.selfcheck.map((t, i) => `<label class="chk"><input type="checkbox" data-c="${i}"> ${t}</label>`).join('')}</div><h3 style="margin-top:14px">שאלת אימות</h3><div id="ib"></div>`;
      let tries = 0;
      const ask = () => askItem($('ib'), sc.verify.type === 'open' ? { id: 'NB', type: 'open', q: sc.verify.q, check: sc.verify.check } : { id: 'NB', type: 'nums', q: sc.verify.q, labels: sc.verify.labels, ans: sc.verify.ans }, 'diag', rec => {
        tries++;
        log('notebook', { ok: rec.correct, tries });
        if (rec.correct) { $('ib').insertAdjacentHTML('beforeend', '<div class="fb ok">✓ מצוין! העבודה במחברת מתאימה.</div><div class="row"><button id="nx">ממשיכים</button></div>'); $('nx').onclick = next; }
        else if (tries === 1) { $('ib').insertAdjacentHTML('beforeend', `<div class="fb bad">בואו נבדוק את הציור יחד: הסתכלו על הציור לדוגמה, ותקנו במחברת אם צריך.</div><div class="row"><button id="again">ניסיון נוסף</button></div>`); $('again').onclick = ask; }
        else { st.unit.ev.nbMiss = true; $('ib').insertAdjacentHTML('beforeend', '<div class="fb info">נמשיך הלאה. כדאי להראות את המחברת למורה בהזדמנות.</div><div class="row"><button id="nx">ממשיכים</button></div>'); $('nx').onclick = next; }
      });
      ask();
    };
  }

  // בדיקת שליטה: 3 שאלות. שליטה = לפחות 2 עברו (ראשונה או שנייה אחרי משוב, בלי רמז) והאחרונה עברה.
  function check(sc) {
    const U = K.units[st.unit.id], u = st.unit;
    const setName = sc.sets[u.setI];
    if (!setName) return referral(true);
    const items = U.sets[setName];
    const j = u.results.length;
    if (j >= items.length) {
      const passes = u.results.filter(r => r.pass).length;
      const mastered = U.passNeed ? passes >= U.passNeed : (passes >= 2 && u.results[items.length - 1].pass);
      log('check', { set: setName, passes, mastered });
      if (u.results.some(r => !r.pass && r.correct) || u.results.some(r => r.attempts > 1)) { if (mastered) u.ev.persist = true; }
      if (mastered) { u.mastered = true; u.masteredSet = setName; save(); return next(); }
      u.setI++; u.results = [];
      save();
      if (U.deep) return deepRetry(sc);
      if (!sc.sets[u.setI]) return referral(true);
      return ladder(sc);
    }
    frame(4, `<h3>בודקים הבנה <span class="muted small">(${j + 1} מתוך ${items.length})</span></h3><div id="ib"></div>`);
    askItem($('ib'), items[j], 'learn', rec => {
      u.results.push(rec);
      if (rec.fixed) u.ev.fixed = true;
      if (rec.firstTag === 'additive') u.ev.additive = true;
      if (items[j].claim && rec.pass) u.ev.claim = true;
      u.lastWrong = rec.pass ? u.lastWrong : { q: items[j].q, answers: rec.answers };
      save();
      check(sc);
    });
  }
  // אתגר המומחים: בלי סולם עזרה ובלי הפניה – הוא רשות
  function deepRetry(sc) {
    if (sc.sets[st.unit.setI]) {
      frame(4, '<h3>אלה שאלות קשות במיוחד</h3><p>וזה בסדר. ננסה סט אחר של משימות אתגר.</p><div class="row"><button id="nx">לסט הבא</button></div>');
      $('nx').onclick = () => check(sc);
    } else {
      log('deepMiss');
      frame(4, '<h3>עוד לא הפעם</h3><p>אתגר המומחים קשה בכוונה. אפשר לחזור אליו בפעם אחרת – וכל מה שכבר למדתם נשאר.</p><div class="row"><button id="cr">למסלול שלי</button></div>');
      $('cr').onclick = course;
    }
  }
  // סולם העזרה אחרי בדיקה שלא עברה: הסבר בדרך אחרת → משימה פשוטה → סט מקביל
  function ladder(sc) {
    const U = K.units[st.unit.id];
    log('ladder');
    frame(4, `<h3>בואו ננסה בדרך אחרת</h3><p>עוד לא הגעתם לשליטה, וזה בסדר. ננסה להבין את זה בדרך נוספת.</p><h3>${R(U.alt.title)}</h3>${R(U.alt.html)}${fig(U.alt.fig)}<div class="row"><button id="nx">הבנתי</button></div>`);
    const sl = siteOf(st.unit.id);
    const simpler = () => {
      frame(4, '<h3>משימה קצרה</h3><div id="ib"></div>');
      askItem($('ib'), U.simpler, 'learn', () => {
        frame(4, '<h3>ועכשיו – בדיקה נוספת</h3><p>שלוש שאלות חדשות. קחו את הזמן.</p><div class="row"><button id="nx">מתחילים</button></div>');
        $('nx').onclick = () => check(sc);
      });
    };
    $('nx').onclick = () => {
      if (!sl.learn) return simpler();
      log('siteLesson');
      frame(4, '<h3>השיעור המלא</h3><p>נעבור יחד על ההסבר המלא. דפדפו בין הכרטיסיות, ואז נמשיך.</p><div id="sf"></div><div class="row"><button id="nx">סיימתי, ממשיכים</button></div>');
      siteFrame($('sf'), sl, d => { if (d.ev === 'home') simpler(); });
      $('nx').onclick = simpler;
    };
  }

  // ---------- המורה ----------
  function teacherCard(auto) {
    const u = st.unit, U = u ? unitDef(u.id) : null;
    const doneU = K.UNITS.filter(x => st.done[x.id]).map(x => x.title);
    const known = Object.keys(K.SKILL_SAY).map(Number).filter(s => st.skills[s] === 'mastered').map(s => K.SKILLS[s]);
    const lw = u && u.lastWrong;
    const curQ = cur && cur.item ? cur.item.q : null;
    const helps = (st.log || []).filter(l => u && l.t >= (st.log.find(x => x.type === 'unitStart' && x.unit === u.id) || { t: 0 }).t);
    const hintsN = helps.filter(l => l.type === 'hint').length, altN = helps.filter(l => l.type === 'alt').length;
    const stuck = curQ || (lw && lw.q);
    const ans = lw && lw.answers && lw.answers.length ? `תשובות שנתן/ה: ${lw.answers.join(', ')}` : '';
    const html = `${auto ? '<p><b>ניסינו כמה דרכים להבין את הנושא. עכשיו כדאי להיעזר במורה כדי להתקדם.</b></p>' : '<p>הכרטיס הזה מחכה למורה. בינתיים אפשר לעשות משימת חזרה.</p>'}
      <div class="tcard"><dl>
        <dt>שם</dt><dd>${esc(st.name)}</dd>
        <dt>נושא</dt><dd>${K.title}${U ? ' · ' + U.title : ''}</dd>
        <dt>כבר הצליח/ה</dt><dd>${doneU.length ? 'יחידות: ' + doneU.join(', ') + '. ' : ''}${known.length ? 'מיומנויות: ' + known.join(', ') : 'עוד אין מיומנויות שהוכחו'}</dd>
        ${stuck ? `<dt>במה נתקע/ה</dt><dd>${R(stuck.replace(/<div class="bigmx">/g, ' ').replace(/<\/div>/g, ''))} ${ans ? '<br>' + esc(ans) : ''}</dd>` : ''}
        ${u && u.sheet ? `<dt>תרגול במחברת</dt><dd>בדיקה עצמית: ${u.sheet} נכונים</dd>` : ''}
        <dt>עזרה שכבר קיבל/ה</dt><dd>${hintsN} רמזים${altN ? `, הסבר בדרך אחרת` : ''}${u && u.setI > 0 ? ', משימה פשוטה יותר וסט שאלות נוסף' : ''}</dd>
      </dl></div>`;
    const detail = `${U ? U.title : K.title} · ${stuck ? stuck.replace(/<[^>]+>/g, ' ').replace(/[⟦⟧]/g, '').replace(/\s+/g, ' ').trim() : ''}${ans ? ' · ' + ans : ''}`;
    tr(auto ? 'הפניה למורה' : 'עזרת מורה', detail);
    log('teacher', { auto: !!auto });
    const m = modal(`<h2>🙋 קוראים למורה</h2>${html}<div class="row"><button id="mwt">משימת חזרה בזמן שמחכים</button></div>`);
    m.el.querySelector('#mwt').onclick = () => { m.close(); waiting(0); };
  }
  function referral() {
    if (st.unit) st.unit.referred = true;
    save();
    frame(4, '<h3>הגיע הזמן לעזרה מהמורה</h3><p>ניסינו כמה דרכים, ועוד לא הגענו לשליטה. זה קורה, ובשביל זה יש מורה. 🙂</p><div class="row"><button id="tc">הצגת כרטיס העזרה</button><button class="sec" id="wt">משימת חזרה בזמן שמחכים</button></div>');
    $('tc').onclick = () => teacherCard(true);
    $('wt').onclick = () => waiting(0);
    teacherCard(true);
  }
  function waiting(j) {
    const U = K.units[st.unit ? st.unit.id : Object.keys(K.units)[0]];
    const items = U.waiting && U.waiting.length ? U.waiting : [U.simpler];
    if (j >= items.length) {
      frame(4, '<h3>סיימתם את משימת החזרה 👏</h3><p>כשהמורה מגיע/ה, הראו לה את כרטיס העזרה.</p><div class="row"><button id="tc">הצגת כרטיס העזרה</button><button class="sec" id="cr">למסלול שלי</button></div>');
      $('tc').onclick = () => teacherCard(true);
      $('cr').onclick = course;
      return;
    }
    frame(4, `<h3>משימת חזרה <span class="muted small">(${j + 1} מתוך ${items.length})</span></h3><div id="ib"></div>`);
    askItem($('ib'), items[j], 'learn', () => waiting(j + 1));
  }

  // ---------- סיכום יחידה ----------
  function summary() {
    const u = st.unit, U = K.units[u.id];
    if (!u.mastered) return check({ sets: (u.ver === 'reinforce' ? ['B', 'C'] : ['A', 'B']) });
    const ev = u.ev;
    const did = U.did || 'הרחבתם שברים';
    let line;
    if (U.deep) line = 'הגעתם לרמת מומחיות: ניתחתם טעויות, בדקתם טענות ויצרתם שברים בעצמכם.';
    else if (ev.additive && ev.fixed) line = (K.id === 'equiv' && u.id === 'u4') ? 'בהתחלה הוספתם מספר למונה ולמכנה. עכשיו אתם כופלים, ויודעים להסביר למה.' : `בהתחלה טעיתם, ומיד תיקנתם בעצמכם. בסוף ${did} לבד.`;
    else if (ev.drawing) line = `בהתחלה נעזרתם בציור. בסוף ${did} גם בלי ציור.`;
    else if (ev.claim) line = `${did} בעצמכם, וזיהיתם טעות של תלמיד אחר והסברתם אותה.`;
    else line = `${did} בעצמכם, ובשאלה האחרונה פתרתם בלי רמז.`;
    const newB = [];
    const give = b => { if (!st.badges[b]) newB.push(b); st.badges[b] = true; };
    give('master');
    if (ev.claim) give('explain');
    if (ev.fixed) give('fix');
    if (ev.persist || u.setI > 0) give('persist');
    if (!st.done[u.id] && !u.tPreview) { st.done[u.id] = true; [].concat(U.skill).forEach(k => { st.skills[k] = 'mastered'; }); }
    save();
    tr(U.deep ? 'מומחיות' : 'יחידה', `${unitDef(u.id).title} (${u.ver === 'teach' ? 'הקניה' : 'חיזוק'}) · שליטה ✓ · סט ${u.masteredSet}${u.more ? ' · תרגול נוסף ' + u.more.join(', ') : ''}${u.sheet ? ' · מחברת ' + u.sheet : ''} · רמזים ${(st.log || []).filter(l => l.type === 'hint').length}`);
    const nst = nextStep(), nxt = nst && !(nst.unit && nst.unit.optional) ? nst : null;
    const fin = finished();
    if (fin && !st.finTracked) { st.finTracked = true; save(); tr('סיום קורס', `${K.title} · ${E.skillLine(st.skills, K)}`); }
    frame(5, `${coachSay(`כל הכבוד, ${esc(first())}! 🎉 ${line}`)}<h3>מה למדתי?</h3><div class="rulebox">${R(U.learned)}</div>${ev.nbTodo ? `<div class="fb info">📌 במחברת ${ev.nbTodo === 1 ? 'נשאר תרגיל אחד' : `נשארו ${ev.nbTodo} תרגילים`} עם הסימן "להשלים". השלימו אותם בבית או בשיעור הבא.</div>` : ''}
      ${newB.length ? `<h3 style="margin-top:16px">הישגים חדשים</h3><div class="badges">${newB.map(b => `<span class="badge">${BADGE_NAME[b]}</span>`).join('')}</div>` : ''}
      <div class="row">${fin ? '<button id="cert">🎓 סיימת את הקורס – לתעודה</button>' : nxt ? `<button id="nl">${nxt.exam ? 'ל' + EXAM_NAME[nxt.exam] : 'לשיעור הבא: ' + unitDef(nxt.unit.id).title}</button>` : ''}<button class="sec" id="cr">לתוכנית הקורס</button>${U.deep ? '' : '<button class="ghost nosay" id="wsb">🖨️ דף עבודה לתרגול בבית</button>'}</div>`);
    $('cr').onclick = course;
    if ($('wsb')) $('wsb').onclick = () => worksheet(u.id);
    if ($('nl')) $('nl').onclick = () => goStep(nxt);
    if ($('cert')) $('cert').onclick = certificate;
  }

  // ---------- סיום מפגש ----------
  function endSession() {
    if (!st || !st.name) return;
    if (st.phase === 'diag' || st.phase === 'diagIntro') {
      if (!confirmEnd()) return;
    }
    const code = E.encode(st, K);
    const doneN = (st.path || []).filter(p => !p.optional && st.done[p.id]).length, all = (st.path || []).filter(p => !p.optional).length;
    tr('סיכום מפגש', `${K.title} · ${E.skillLine(st.skills, K)} · יחידות ${doneN}/${all}`);
    const name = st.name;
    st.phase = 'end'; save();
    layout(false);
    main.innerHTML = `<div class="card"><h2>כל הכבוד, ${esc(name.split(' ')[0])}!</h2>
      <p>העתיקו את הקוד הזה למחברת, ליד התאריך של היום:</p><div class="code">${code}</div>
      <p>בפעם הבאה תקלידו אותו במסך הכניסה, ותמשיכו בדיוק מאותו מקום.</p>
      <div class="row"><button id="fin">העתקתי – סיום</button></div></div>`;
    $('fin').onclick = () => { E.store.clear(); st = null; catalog(); };
  }
  function confirmEnd() { return st.phase !== 'diag' || window.confirm('המבדק עוד לא הסתיים. לסיים בכל זאת?'); }

  /* ---------- כפתורי המאמן ---------- */
  coachEl.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const h = b.dataset.h;
    log('help', { h });
    if (h === 'lost') {
      say('מה לא ברור?');
      $('bubble').insertAdjacentHTML('beforeend', `<div class="sub">${[['words', 'המילים'], ['what', 'מה צריך לעשות'], ['idea', 'מה זה בכלל'], ['start', 'איך מתחילים'], ['calc', 'החישוב']].map(([k, t]) => `<button class="sec small" data-l="${k}">${t}</button>`).join('')}</div>`);
      $('bubble').querySelectorAll('[data-l]').forEach(x => x.onclick = () => lost(x.dataset.l));
    } else if (h === 'alt') {
      const U = K.units[(st.unit && st.unit.id) || Object.keys(K.units)[0]];
      log('alt');
      modal(`<h2>${R(U.alt.title)}</h2>${R(U.alt.html)}${fig(U.alt.fig)}`);
    } else if (h === 'hint') {
      if (!(cur && cur.hint && cur.hint())) say('כרגע אין שאלה פתוחה. אם משהו לא ברור, לחצו "לא הבנתי".');
      else say('הוספתי רמז ליד השאלה. 💡');
    } else if (h === 'read') speak($('ucard') || main);
    else if (h === 'teacher') teacherCard(false);
  });
  function lost(k) {
    const it = cur && cur.item;
    log('lost', { k });
    if (k === 'words') modal(`<h2>מילון קטן</h2>${K.GLOSSARY.map(([w, t, f]) => `<p><b>${w}:</b> ${R(t)}</p>${f ? fig(f) : ''}`).join('')}`);
    else if (k === 'what') say(it && it.rephrase ? it.rephrase : 'קראו שוב את השאלה לאט: מה מבקשים למצוא? אפשר גם ללחוץ "הקרא לי".');
    else if (k === 'idea' && lessonModal()) { /* השיעור המלא */ } else if (k === 'idea') { const U = K.units[(st.unit && st.unit.id) || Object.keys(K.units)[0]]; modal(`<h2>${R(U.alt.title)}</h2>${R(U.alt.html)}${fig(U.alt.fig)}`); }
    else if (k === 'start') say(it && it.start ? it.start : 'מתחילים מהמספר שידוע בשני השברים: פי כמה הוא גדל?');
    else if (k === 'calc') {
      let t = '<table class="mt">';
      for (let r = 0; r <= 10; r++) { t += '<tr>'; for (let c = 0; c <= 10; c++) t += r === 0 && c === 0 ? '<td class="h">×</td>' : r === 0 ? `<td class="h">${c}</td>` : c === 0 ? `<td class="h">${r}</td>` : `<td>${r * c}</td>`; t += '</tr>'; }
      modal(`<h2>לוח הכפל</h2>${t}</table>`);
      log('mulTable');
    }
  }
  $('coachToggle').onclick = () => { const o = coachEl.classList.toggle('open'); $('coachToggle').setAttribute('aria-expanded', o); };

  $('endBtn').onclick = endSession;
  $('bigBtn').onclick = () => document.body.classList.toggle('big');

  /* ---------- חוסר פעילות (מחשב משותף) ---------- */
  let idleT = null;
  const IDLE = 20 * 60 * 1000;
  const bump = () => { clearTimeout(idleT); if (st && st.name && st.phase !== 'end') idleT = setTimeout(idleAsk, IDLE); };
  function idleAsk() {
    if (document.querySelector('.overlay.idle')) return;
    const m = modal(`<h2>ממשיכים?</h2><p>לא היתה פעילות כבר זמן מה. ${esc(st.name.split(' ')[0])}, את/ה עדיין כאן?</p><div class="row"><button id="iy">אני ממשיך/ה</button><button class="sec" id="in">סיימתי להיום</button></div>`, bump);
    m.el.classList.add('idle');
    m.el.querySelector('#iy').onclick = () => m.close();
    m.el.querySelector('#in').onclick = () => { m.close(); endSession(); };
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, bump, true));

  // ---------- קטלוג הקורסים ----------
  function catalog(all) {
    st = null; setCourse(null); layout(false);
    const fits = g => !MYG || !g || (MYG >= g[0] && MYG <= g[1]);
    const list = C.COURSE_IDS.map(id => ({ id, c: canEnter(id) ? C.courses[id] : null, pl: PLANNED[id] })).filter(x => x.c || x.pl)
      .map(x => Object.assign(x, { g: x.c ? x.c.grades : x.pl.grades }));
    const mine = list.filter(x => fits(x.g)), other = list.filter(x => !fits(x.g));
    const card = ({ id, c, pl, g }) => {
      const t = c ? c.title : pl.title, sub = c ? c.sub : pl.sub;
      const meta = c ? `${c.MODULES.length} פרקים · ${c.UNITS.length} שיעורים` : 'בהכנה';
      return `<div class="card ccard${c ? '' : ' soon'}"><div class="crumb">${c ? (c.draft ? 'טיוטה – רק מורים רואים' : 'קורס') : 'בקרוב'} · ${gradeText(g)}</div><h2>${t}</h2><p class="muted">${sub}</p><p class="small muted">${meta}</p>${c ? `<div class="row"><button data-c="${id}">לקורס</button></div>` : ''}</div>`;
    };
    // קורסים פעילים קודם, ואחריהם "בקרוב"
    const sortA = a => a.slice().sort((x, y) => (y.c ? 1 : 0) - (x.c ? 1 : 0));
    main.innerHTML = `${tview()}<div class="card"><div class="crumb">${MYG ? `כיתה ${GN[MYG]}` : 'כל הכיתות'}</div><h1>קורסים ללמידה עצמית</h1>
      <div class="coachline"><span class="avatar">מ</span><div class="say"><div class="who">המאמן שלך</div>שלום! כאן לומדים לבד, בקצב שלך, עם עזרה ממני. בחרו את הקורס שהמורה אמר/ה לכם ללמוד.</div></div>
      <p class="small muted">כבר התחלתם קורס? היכנסו אליו והקלידו את קוד ההמשך מהמחברת.</p></div>
      <div class="cats">${sortA(mine).map(card).join('') || '<div class="card">עוד אין קורסים לכיתה הזו.</div>'}</div>
      ${other.length ? (all ? `<h2 style="margin:26px 4px 12px">קורסים לכיתות אחרות</h2><div class="cats">${sortA(other).map(card).join('')}</div>` : '<div class="row"><button class="sec" id="allc">להציג גם קורסים לכיתות אחרות</button></div>') : ''}`;
    main.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { setCourse(b.dataset.c); entry(); });
    if ($('allc')) $('allc').onclick = () => catalog(true);
  }
  $('brand').onclick = () => { if (!st || st.phase === 'course' || st.phase === 'end' || window.confirm('לחזור לרשימת הקורסים?')) { if (st && st.phase !== 'end') { E.store.clear(); } catalog(); } };

  /* ---------- התחלה ---------- */
  if (st && st.phase !== 'end') setCourse(st.course || 'equiv');
  const want = E.URLP.get('course');
  if ((!st || st.phase === 'end') && want && canEnter(want)) { st = null; setCourse(want); entry(); }
  else if (!st || st.phase === 'end' || !K) { st = null; catalog(); }
  else if (st.phase === 'diagIntro') diagIntro();
  else if (st.phase === 'diag') diagQ();
  else if (st.phase === 'unit' && st.unit) screen();
  else if (st.phase === 'exam' && st.exam) examQ();
  else course();
  bump();
  window.__coach = { get st() { return st; }, get cur() { return cur && cur.item; }, screens: () => screens() };
})();
</script>
</body>
</html>
