<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>המאמן האישי שלי במתמטיקה – איריס סגל</title>
<meta name="description" content="קורס אישי עם מאמן: שברים שקולים (שווים)">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#fbf8f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbf8f1; --card: #fffdf8; --ink: #1f1e1c; --muted: #5f5a50; --line: #cfc6b4;
    --hot: #d9482b; --hot-dark: #b93a20; --ok: #2c7a5b; --ok-bg: #e4eedb; --bad: #9a4b14; --bad-bg: #f7e6c8;
    --info-bg: #e3ecf6; --rule-bg: #efe9f6; --pink: #e07aa5;
    --hand: 'Playpen Sans Hebrew', 'Assistant', cursive;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Assistant', 'Segoe UI', 'Arial Hebrew', sans-serif; direction: rtl; text-align: right; font-size: 18px; line-height: 1.5; }
  body.big { font-size: 21px; }
  h1, h2, h3 { font-family: var(--hand); margin: 0 0 10px; line-height: 1.3; }
  h1 { font-size: 1.6rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.1rem; }
  p { margin: 0 0 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--card); position: sticky; top: 0; z-index: 20; }
  .top .brand { font-family: var(--hand); font-weight: 700; font-size: 1.05rem; }
  .top .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 18px 16px 120px; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 900px) { .layout.withcoach { grid-template-columns: 1fr 270px; } }
  .card { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.88rem; }
  button, .btn { font: inherit; font-family: var(--hand); font-weight: 600; font-size: 1rem; padding: 10px 18px; min-height: 44px; border: 2px solid var(--ink); border-radius: 12px; background: var(--hot); color: #fff; cursor: pointer; box-shadow: 2px 3px 0 var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover { background: var(--hot-dark); }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.sec, .btn.sec { background: var(--card); color: var(--ink); box-shadow: none; }
  button.sec:hover { background: #fff; }
  button.ghost { background: transparent; color: var(--ink); border-color: transparent; box-shadow: none; font-weight: 600; }
  button.ghost:hover { background: rgba(31, 30, 28, 0.06); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: 0.9rem; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  input.tx { font: inherit; font-size: 1.1rem; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; width: 100%; max-width: 380px; }
  input.tx:focus, input.slot:focus, input.nin:focus { outline: 3px solid rgba(217, 72, 43, 0.35); }
  label.lb { display: block; font-weight: 700; margin: 12px 0 6px; }

  /* מתמטיקה */
  .mx { display: inline-flex; align-items: center; gap: 0.25em; direction: ltr; unicode-bidi: isolate; vertical-align: middle; margin: 0 0.15em; }
  .fr { display: inline-flex; flex-direction: column; text-align: center; line-height: 1.15; }
  .fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 0.2em 1px; }
  .fr > span:last-child { padding-top: 1px; }
  .bigmx { font-size: 1.7rem; text-align: center; margin: 12px 0; }
  .bigmx .mx { gap: 0.4em; }
  .qbox { display: inline-block; min-width: 1.2em; border: 2px dashed var(--ink); border-radius: 6px; padding: 0 0.15em; }
  input.slot, input.nin { width: 2.6em; font: inherit; font-size: 1em; text-align: center; padding: 2px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; direction: ltr; }
  .fracin { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; vertical-align: middle; }
  .fracin .bar { width: 3em; height: 0; border-top: 3px solid var(--ink); }

  /* ציורים */
  .figs { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 12px 0; }
  .figs.inline { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
  svg.fig { max-width: 100%; height: auto; display: block; margin: 8px auto; }
  figure.figl { margin: 0; text-align: center; }
  figure.figl figcaption { font-size: 1.15rem; }
  .shade svg rect[data-i] { cursor: pointer; }
  .clickline svg .hit { cursor: pointer; }

  /* אפשרויות בחירה */
  .opts { display: grid; gap: 10px; margin-top: 12px; }
  .opts.figopts { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .opt { text-align: right; justify-content: flex-start; background: var(--card); color: var(--ink); box-shadow: none; font-family: 'Assistant', sans-serif; font-weight: 400; font-size: 1.05rem; padding: 12px 14px; min-height: 52px; }
  .opt:hover { background: #fff; }
  .opt.sel { background: var(--info-bg); outline: 3px solid var(--ink); }
  .opt.right { background: var(--ok-bg); border-color: var(--ok); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt svg.fig { margin: 0 auto; }
  .figopts .opt { justify-content: center; }

  /* משוב */
  .fb { border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .fb.ok { background: var(--ok-bg); }
  .fb.bad { background: var(--bad-bg); }
  .fb.hint { background: #fff3cf; }
  .fb.info { background: var(--info-bg); }
  .rulebox { background: var(--rule-bg); border: 2px dashed var(--ink); border-radius: 12px; padding: 14px 16px; }
  .warnbox { background: var(--bad-bg); border: 2px dashed var(--ink); border-radius: 12px; padding: 14px 16px; }
  ol.steps { margin: 8px 0; padding-inline-start: 1.4em; }
  ol.steps li { margin-bottom: 6px; }

  /* שלבי יחידה */
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; }
  .pill { border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; background: var(--card); color: var(--muted); }
  .pill.on { background: var(--ink); color: var(--bg); font-weight: 700; }
  .pill.done { background: var(--ok-bg); color: var(--ink); }

  /* מסך הקורס */
  .prog { height: 14px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: #fff; margin: 10px 0 6px; }
  .prog > div { height: 100%; background: var(--ok); }
  .ulist { list-style: none; margin: 0; padding: 0; }
  .ulist li { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--line); border-radius: 10px; }
  .ulist li:last-child { border-bottom: none; }
  .ulist li.active { background: var(--info-bg); outline: 2px solid var(--ink); }
  .ulist .ic { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .ulist li.done .ic { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .ulist li.active .ic { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .ulist .t { flex: 1; }
  .ulist li.done .t b { text-decoration: line-through; color: var(--muted); font-weight: 600; }
  .ulist .meta { font-size: 0.85rem; color: var(--muted); }
  .tag { display: inline-block; font-size: 0.78rem; border: 1px solid var(--ink); border-radius: 6px; padding: 0 6px; margin-inline-start: 6px; background: #fff; color: var(--ink); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { border: 2px solid var(--ink); border-radius: 12px; padding: 4px 10px; background: #fff3cf; font-size: 0.9rem; }
  .knows li { margin-bottom: 4px; }

  /* המאמן */
  .coach { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 14px; align-self: start; position: sticky; top: 74px; }
  .coach h3 { margin-bottom: 8px; }
  .bubble { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.97rem; }
  .coach .hb { display: flex; flex-direction: column; gap: 8px; }
  .coach .hb button { justify-content: center; }
  .coach .hb button.teacher { background: #fff3cf; color: var(--ink); }
  .coach .sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .coachtoggle { display: none; }
  @media (max-width: 600px) {
    .top { padding: 8px 10px; }
    .top .brand { font-size: 0.95rem; }
    .top .brand .long { display: none; }
    .top .acts { flex-wrap: nowrap; gap: 6px; }
    .top .acts .small { padding: 4px 8px; font-size: 0.82rem; min-height: 34px; white-space: nowrap; }
    .wrap { padding: 12px 10px 110px; }
    .card { padding: 14px; }
  }
  @media (max-width: 899px) {
    .coach { position: fixed; bottom: 0; left: 0; right: 0; top: auto; border-radius: 16px 16px 0 0; border-bottom: none; z-index: 30; max-height: 70vh; overflow: auto; transform: translateY(calc(100% - 56px)); transition: transform 0.2s; padding-top: 0; }
    .coach.open { transform: none; }
    .coachtoggle { display: flex; width: 100%; background: var(--card); color: var(--ink); box-shadow: none; border: none; border-bottom: 1.5px solid var(--line); border-radius: 0; margin-bottom: 10px; min-height: 54px; }
    .coach h3 { display: none; }
    .coachtoggle:hover, .coachtoggle:active { background: var(--card); transform: none; }
  }

  /* חלונות */
  .overlay { position: fixed; inset: 0; background: rgba(31, 30, 28, 0.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--bg); border: 2px solid var(--ink); border-radius: 16px; padding: 20px; max-width: 620px; width: 100%; max-height: 90vh; overflow: auto; }
  .tcard { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 14px; font-size: 1.05rem; }
  .tcard dt { font-weight: 700; margin-top: 8px; }
  .tcard dd { margin: 0; }
  .code { font-family: 'Courier New', monospace; font-size: 2.2rem; font-weight: 700; letter-spacing: 4px; direction: ltr; text-align: center; background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 12px; margin: 12px 0; }
  table.mt { border-collapse: collapse; margin: 0 auto; direction: ltr; }
  table.mt td { border: 1px solid var(--line); width: 2.3em; height: 2em; text-align: center; font-size: 0.95rem; }
  table.mt td.h { background: #f1ece0; font-weight: 700; }
  table.cut { border-collapse: collapse; margin: 10px 0; }
  table.cut td, table.cut th { border: 1.5px solid var(--line); padding: 4px 12px; text-align: center; }
  .chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .chk input { width: 22px; height: 22px; }
  .tview { background: #fff3cf; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; font-size: 0.92rem; }
  .sure { margin-top: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 30px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">המאמן האישי<span class="long"> שלי במתמטיקה</span></span>
  <span class="acts">
    <button class="sec small" id="bigBtn" title="הגדלת הכתב">א+ כתב</button>
    <a class="btn sec small" href="math6.html">לאתר<span class="long2"> התרגול</span></a>
    <button class="small" id="endBtn" hidden>סיימתי להיום</button>
  </span>
</header>
<div class="wrap">
  <div class="layout" id="layout">
    <main id="main"></main>
    <aside class="coach" id="coach" hidden>
      <button class="coachtoggle" id="coachToggle" aria-expanded="false">🙋 עזרה מהמאמן</button>
      <h3>המאמן</h3>
      <div class="bubble" id="bubble">אני כאן אם צריך עזרה.</div>
      <div class="hb">
        <button class="sec" data-h="lost">לא הבנתי</button>
        <button class="sec" data-h="alt">תסביר בדרך אחרת</button>
        <button class="sec" data-h="hint">תן לי רמז</button>
        <button class="sec" data-h="read">הקרא לי</button>
        <button class="teacher" data-h="teacher">אני צריך את המורה</button>
      </div>
    </aside>
  </div>
  <footer>המאמן האישי · מאת איריס סגל · <span class="ver">גרסה 1.0</span></footer>
</div>

<script src="coach/visuals.js"></script>
<script src="coach/engine.js"></script>
<script src="coach/courses/equiv.js"></script>
<script>
(function () {
  const C = window.COACH, V = C.V, E = C.E, K = C.courses.equiv;
  const { R, fig } = V;
  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const main = $('main'), coachEl = $('coach');
  const T = E.teacher();
  const PILLS = ['מה נלמד', 'בואו נבין', 'עכשיו במחברת', 'בודקים הבנה', 'מה למדתי'];
  const BADGE_NAME = { persist: '💪 התמדה', fix: '🔧 תיקון טעות', explain: '💬 הסבר מתמטי', master: '⭐ שליטה' };

  let st = E.store.load() || null;
  let cur = null; // השאלה הפתוחה כרגע (לכפתורי המאמן)
  const save = () => { if (st) E.store.save(st); };
  const log = (type, data) => { if (!st) return; st.log = st.log || []; st.log.push(Object.assign({ type, t: Date.now() }, data || {})); if (st.log.length > 200) st.log.shift(); save(); };
  const say = html => { $('bubble').innerHTML = R(html); };

  /* ---------- הקראה ---------- */
  let heVoice = null;
  const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const loadVoices = () => { if (!canSpeak) return; const vs = speechSynthesis.getVoices() || []; heVoice = vs.find(v => /^(he|iw)([-_]|$)/i.test(v.lang)) || vs.find(v => /hebrew|עברית|carmit|asaf/i.test(v.name)) || null; };
  if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function textOf(el) {
    const c = el.cloneNode(true);
    c.querySelectorAll('.mx').forEach(m => m.replaceWith(document.createTextNode(' ' + m.dataset.say + ' ')));
    c.querySelectorAll('button, input, svg, .nosay, .pills, .tview').forEach(x => x.remove());
    return c.textContent.replace(/\s+/g, ' ').trim();
  }
  function speak(el) {
    loadVoices();
    if (!canSpeak || !heVoice) {
      document.body.classList.add('big');
      say('ההקראה לא זמינה במחשב הזה. הגדלתי את הכתב. אפשר גם לבקש מחבר/ה להקריא.');
      log('noVoice');
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(textOf(el));
    u.voice = heVoice; u.lang = heVoice.lang; u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ---------- חלונות ---------- */
  function modal(html, onClose) {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<div class="row"><button class="sec" data-close>סגירה</button></div></div>`;
    document.body.appendChild(o);
    const close = () => { o.remove(); if (onClose) onClose(); };
    o.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    o.addEventListener('click', e => { if (e.target === o) close(); });
    return { el: o, close };
  }

  /* =========================================================
     רכיב שאלה – משמש באבחון (בלי משוב) ובלמידה (משוב, רמזים, תיקון)
     ========================================================= */
  function askItem(box, item, mode, done) {
    const learn = mode === 'learn';
    let sel = item.type === 'multi' ? new Set() : null, shaded = new Set(), lineK = null;
    let attempts = 0, hinted = false, hintI = 0, answers = [], firstTag = '', fixed = false, finished = false;
    const fbBox = () => box.querySelector('.fbarea');
    const fbs = (cls, html) => { fbBox().innerHTML = `<div class="fb ${cls}">${R(html)}</div>`; };

    let body = `<div class="q">${R(item.q, { input: item.type === 'num' })}</div>`;
    if (item.fig && item.type !== 'shade' && item.type !== 'line') body += fig(item.fig);
    if (item.type === 'frac' || item.type === 'open') body += `<div class="bigmx"><span class="fracin" dir="ltr"><input class="nin" data-p="n" inputmode="numeric" maxlength="3" aria-label="מונה"><span class="bar"></span><input class="nin" data-p="d" inputmode="numeric" maxlength="3" aria-label="מכנה"></span></div>`;
    if (item.type === 'shade') body += `<div class="shade">${V.bar({ n: 0, d: item.d, w: 320 })}</div><p class="muted small">צבועים: <b class="cnt">0</b></p>`;
    if (item.type === 'line') body += `<div class="clickline">${V.line({ d: item.d, click: true })}</div>`;
    if (item.type === 'choice' || item.type === 'multi') {
      const figs = item.opts.some(o => o.fig && !o.t);
      body += `<div class="opts${figs ? ' figopts' : ''}">${item.opts.map((o, i) => `<button class="opt" data-i="${i}">${o.t ? R(o.t) : ''}${o.fig && !o.t ? fig(o.fig) : ''}</button>`).join('')}</div>`;
    }
    if (item.type === 'nums') body += `<div class="row">${item.labels.map((l, i) => `<label class="chk">${esc(l)}: <input class="nin" data-k="${i}" inputmode="numeric" maxlength="3"></label>`).join('')}</div>`;
    body += `<div class="fbarea" aria-live="polite"></div><div class="row acts"><button class="go">${learn ? 'בדיקה' : 'המשך'}</button>${learn && item.hints ? '<button class="sec hintb">רמז</button>' : ''}${learn && item.showFig ? '<button class="sec showfig">הראו לי בציור</button>' : ''}${!learn && item.type !== 'nums' ? '<button class="ghost skip">עוד לא למדתי</button>' : ''}</div><div class="sure" hidden></div>`;
    box.innerHTML = body;

    // אינטראקציה
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (finished) return;
      const i = +b.dataset.i;
      if (sel) { sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel'); }
      else { box.querySelectorAll('.opt').forEach(x => x.classList.remove('sel', 'wrong')); b.classList.add('sel'); box.dataset.sel = i; }
    });
    if (item.type === 'shade') {
      const redraw = () => {
        box.querySelectorAll('.shade rect[data-i]').forEach(r => r.setAttribute('fill', shaded.has(+r.dataset.i) ? V.FILL : '#fff'));
        box.querySelector('.cnt').textContent = shaded.size;
      };
      box.querySelectorAll('.shade rect[data-i]').forEach(r => r.onclick = () => { if (finished) return; const i = +r.dataset.i; shaded.has(i) ? shaded.delete(i) : shaded.add(i); redraw(); });
    }
    if (item.type === 'line') {
      const bind = () => box.querySelectorAll('.clickline .hit').forEach(h => h.onclick = () => { if (finished) return; lineK = +h.dataset.k; box.querySelector('.clickline').innerHTML = V.line({ d: item.d, click: true, sel: lineK }); bind(); });
      bind();
    }
    box.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') box.querySelector('.go').click(); }));
    const firstIn = box.querySelector('input'); if (firstIn && window.innerWidth > 700) setTimeout(() => firstIn.focus(), 50);

    function read() {
      const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
      switch (item.type) {
        case 'num': { const v = num(box.querySelector('input.slot').value.trim()); return v == null ? null : { v, key: String(v) }; }
        case 'frac': case 'open': { const n = num(box.querySelector('[data-p="n"]').value.trim()), d = num(box.querySelector('[data-p="d"]').value.trim()); return (n == null || d == null || d === 0) ? null : { n, d, key: `${n}/${d}` }; }
        case 'choice': return box.dataset.sel == null ? null : { i: +box.dataset.sel, key: String(box.dataset.sel) };
        case 'multi': return sel.size ? { s: [...sel].sort(), key: [...sel].sort().join(',') } : null;
        case 'shade': return { v: shaded.size, key: String(shaded.size) };
        case 'line': return lineK == null ? null : { v: lineK, key: String(lineK) };
        case 'nums': { const vs = [...box.querySelectorAll('input.nin')].map(x => num(x.value.trim())); return vs.some(v => v == null) ? null : { vs, key: vs.join(',') }; }
      }
    }
    function judge(a) {
      const t = item.type;
      if (t === 'num' || t === 'shade' || t === 'line') return { ok: a.v === item.ans, tag: (learn ? (item.trapTags || {})[a.v] : (item.traps || {})[a.v]) || '', msg: learn ? (item.traps || {})[a.v] : '' };
      if (t === 'frac') {
        const ok = a.n === item.ans[0] && a.d === item.ans[1];
        let tag = (item.traps || {})[a.key] || '';
        if (!ok && !tag && a.n * item.ans[1] === a.d * item.ans[0]) tag = 'partialReduce';
        return { ok, tag };
      }
      if (t === 'open') { const ok = item.check(a.n, a.d); return { ok, tag: ok ? '' : ((item.bad && item.bad(a.n, a.d)) ? 'additive' : ''), msg: ok ? '' : (item.bad && item.bad(a.n, a.d)) || '' }; }
      if (t === 'choice') { const o = item.opts[a.i]; return { ok: a.i === item.ans, tag: o.tag || '', msg: o.msg || '', fig: o.fig && o.t ? o.fig : null }; }
      if (t === 'multi') { const ok = a.key === [...item.ans].sort().join(','); const wrongOpt = a.s.map(i => item.opts[i]).find(o => o.tag); return { ok, tag: ok ? '' : (wrongOpt ? wrongOpt.tag : ''), msg: '' }; }
      if (t === 'nums') return { ok: a.vs.every((v, i) => v === item.ans[i]), tag: '' };
    }
    function hint() {
      if (!item.hints || finished) return false;
      hinted = true;
      const h = item.hints[Math.min(hintI, item.hints.length - 1)];
      hintI++;
      fbs('hint', '💡 ' + h);
      log('hint', { item: item.id });
      return true;
    }
    function finish(rec) {
      finished = true;
      cur = null;
      box.querySelectorAll('input').forEach(i => i.disabled = true);
      done(rec);
    }

    if (learn) cur = { item, hint };
    const hb = box.querySelector('.hintb'); if (hb) hb.onclick = hint;
    const sf = box.querySelector('.showfig');
    if (sf) sf.onclick = () => { sf.remove(); box.querySelector('.q').insertAdjacentHTML('afterend', fig(item.showFig)); log('drawing', { item: item.id }); if (st.unit) st.unit.ev.drawing = true; };
    const sk = box.querySelector('.skip');
    if (sk) sk.onclick = () => finish({ skip: true, correct: false, tag: 'skip' });

    box.querySelector('.go').onclick = () => {
      if (finished) return;
      const a = read();
      if (!a) { fbs('info', item.type === 'choice' ? 'בחרו תשובה.' : item.type === 'line' ? 'לחצו על מקום על ישר המספרים.' : 'השלימו את התשובה.'); return; }
      const j = judge(a);
      if (!learn) {
        const out = { correct: j.ok, tag: j.tag };
        if (item.sure && (item.type === 'choice' || item.type === 'multi')) {
          box.querySelector('.acts').hidden = true;
          box.querySelectorAll('.opt').forEach(x => x.disabled = true);
          const s = box.querySelector('.sure');
          s.hidden = false;
          s.innerHTML = '<p><b>כמה אתם בטוחים בתשובה?</b></p><div class="row"><button class="sec" data-s="sure">בטוח/ה</button><button class="sec" data-s="unsure">לא כל כך בטוח/ה</button><button class="sec" data-s="guess">ניחשתי</button></div>';
          s.querySelectorAll('button').forEach(b => b.onclick = () => { out.sure = b.dataset.s; finish(out); });
        } else finish(out);
        return;
      }
      attempts++;
      answers.push(a.key);
      if (j.ok) {
        if (attempts === 2 && !hinted && firstTag) fixed = true;
        if (item.type === 'choice') box.querySelector(`.opt[data-i="${a.i}"]`).classList.add('right');
        fbs('ok', `✓ ${['נכון!', 'בדיוק!', 'יפה מאוד!'][attempts % 3]} ${item.exp ? item.exp : ''}`);
        box.querySelector('.acts').innerHTML = '<button class="go2">המשך</button>';
        box.querySelector('.go2').onclick = () => finish({ correct: true, pass: !hinted && attempts <= 2, hinted, attempts, answers, firstTag, fixed });
        box.querySelector('.go2').focus();
        return;
      }
      if (!firstTag && j.tag) firstTag = j.tag;
      if (item.type === 'choice') box.querySelector(`.opt[data-i="${a.i}"]`).classList.add('wrong');
      log('wrong', { item: item.id, a: a.key, tag: j.tag });
      if (attempts === 1) {
        fbs('bad', (j.msg || 'עוד לא. קראו שוב את השאלה ונסו שוב.') + (j.fig ? fig(j.fig) : ''));
      } else if (attempts === 2) {
        hinted = true; hintI = Math.max(hintI, 1); log('hint', { item: item.id, auto: true });
        fbs('hint', '💡 ' + ((item.hints && item.hints[0]) || 'נסו שוב, לאט.') + (j.msg ? '<br>' + j.msg : ''));
      } else if (attempts === 3) {
        hinted = true;
        if (item.similar) fbs('info', `<b>הנה דוגמה דומה, פתורה:</b><div class="bigmx">${R('⟦' + item.similar.q.replace(/[⟦⟧]/g, '') + '⟧')}</div><ol class="steps">${item.similar.steps.map(s => `<li>${R(s)}</li>`).join('')}</ol>${fig(item.similar.fig)}<p>עכשיו נסו שוב את השאלה שלכם.</p>`);
        else fbs('hint', '💡 ' + ((item.hints && item.hints[item.hints.length - 1]) || 'נסו עוד פעם אחת.'));
      } else {
        fbs('info', `נעבור הלאה, ונחזור לזה. ${item.exp ? '<br>' + item.exp : ''}`);
        box.querySelector('.acts').innerHTML = '<button class="go2">המשך</button>';
        box.querySelector('.go2').onclick = () => finish({ correct: false, pass: false, hinted, attempts, answers, firstTag });
      }
    };
  }

  /* =========================================================
     מסכים
     ========================================================= */
  function layout(withCoach) {
    $('layout').classList.toggle('withcoach', !!withCoach);
    coachEl.hidden = !withCoach;
    coachEl.classList.remove('open');
    $('endBtn').hidden = !st || !st.name || st.phase === 'end';
    window.scrollTo(0, 0);
  }
  const tview = html => T ? `<div class="tview nosay">👩‍🏫 תצוגת מורה – לא נשלח מידע לאתר הבקרה. ${html || ''}</div>` : '';

  // ---------- כניסה ----------
  function entry(msg) {
    layout(false);
    main.innerHTML = `<div class="card">
      ${tview()}
      <h1>שברים שקולים (שווים)</h1>
      <p>${K.sub}.</p>
      <label class="lb" for="nm">השם המלא שלי (שם פרטי ושם משפחה):</label>
      <input class="tx" id="nm" autocomplete="off" placeholder="לדוגמה: נועה כהן">
      <label class="lb" for="cd">קוד המשך מהמחברת <span class="muted small">(רק אם כבר התחלתם בפעם קודמת)</span></label>
      <input class="tx" id="cd" autocomplete="off" dir="ltr" placeholder="XXXX-XXXX" style="max-width:220px;text-align:center">
      <div id="emsg">${msg ? `<div class="fb bad">${msg}</div>` : ''}</div>
      <div class="row"><button id="go">מתחילים</button></div>
    </div>`;
    const go = () => {
      const name = $('nm').value.trim().replace(/\s+/g, ' ');
      const parts = name.split(' ').filter(p => p.length >= 2);
      if (parts.length < 2) { $('emsg').innerHTML = '<div class="fb bad">כתבו שם פרטי <b>ושם משפחה</b>.</div>'; $('nm').focus(); return; }
      const code = $('cd').value.trim();
      if (code) {
        const d = E.decode(code, K);
        if (!d) { $('emsg').innerHTML = '<div class="fb bad">הקוד לא תקין. בדקו שהעתקתם נכון מהמחברת, או מחקו אותו והתחילו בלי קוד.</div>'; return; }
        st = { name, phase: 'course', skills: d.skills, done: d.done, badges: d.badges, tag: d.tag, log: [], fromCode: true };
        st.path = E.buildPath(K, st.skills, st.done);
        save();
        E.track(name, 'כניסה עם קוד', `${K.title} · ${E.skillLine(st.skills)}`);
        return course();
      }
      st = { name, phase: 'diagIntro', skills: {}, done: {}, badges: {}, tag: 'none', log: [] };
      save();
      diagIntro();
    };
    $('go').onclick = go;
    ['nm', 'cd'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  }

  // ---------- אבחון ----------
  function diagIntro() {
    layout(false);
    main.innerHTML = `<div class="card"><h2>שלום ${esc(st.name.split(' ')[0])}!</h2>
      <p>לפני שמתחילים, כמה שאלות קצרות. <b>זה לא מבחן ואין ציון.</b> התשובות עוזרות לנו לבנות לכם מסלול שמתאים בדיוק למה שאתם כבר יודעים.</p>
      <p>אם אתם לא יודעים, זה בסדר ללחוץ "עוד לא למדתי".</p>
      <div class="row"><button id="go">מתחילים</button></div></div>`;
    $('go').onclick = () => { st.diag = E.diagStart(K); st.phase = 'diag'; save(); diagQ(); };
  }
  function diagQ() {
    layout(false);
    const item = E.diagNext(st.diag, K);
    if (!item) return diagDone();
    const n = st.diag.asked.length + 1;
    main.innerHTML = `<div class="card">${tview(`שאלה ${esc(item.id)} · מיומנות ${item.skill}`)}<div class="row" style="justify-content:space-between;margin-top:0"><span class="muted">שאלה ${n}</span><button class="ghost small" id="rd">🔊 הקרא לי</button></div><div id="qbox"></div></div>`;
    $('rd').onclick = () => speak($('qbox'));
    askItem($('qbox'), item, 'diag', res => {
      E.diagAnswer(st.diag, item, res);
      save();
      const b = document.createElement('div'); b.className = 'fb info'; b.textContent = 'תודה, ממשיכים.';
      $('qbox').appendChild(b);
      setTimeout(diagQ, 450);
    });
  }
  function diagDone() {
    const ds = st.diag;
    for (let s = 1; s <= 8; s++) st.skills[s] = ds.status[s] || 'unknown';
    st.tag = E.mainTag(ds.tags);
    st.path = E.buildPath(K, st.skills);
    st.phase = 'course';
    st.diagSummary = { n: ds.asked.length, tags: ds.tags };
    delete st.diag;
    save();
    const tagList = Object.keys(ds.tags).filter(t => t !== 'skip').map(t => K.TAGS[t]).filter(Boolean);
    E.track(st.name, 'אבחון', `${K.title} · ${E.skillLine(st.skills)}${tagList.length ? ' · טעויות: ' + tagList.join('; ') : ''}`);
    layout(false);
    const knows = [8, 7, 6, 5, 4, 3, 2, 1].filter(s => st.skills[s] === 'mastered').slice(0, 2).map(s => K.SKILL_SAY[s]);
    const units = st.path.filter(p => !p.optional).length;
    main.innerHTML = `<div class="card"><h2>תודה!</h2>
      <p>בנינו לכם מסלול של <b>${units} ${units === 1 ? 'יחידה' : 'יחידות'}</b>.</p>
      ${knows.length ? `<p>כבר עכשיו אתם יודעים ${knows.join(', ו')}.</p>` : '<p>נתחיל מהבסיס, צעד אחר צעד.</p>'}
      ${T ? `<div class="tview">מצב מיומנויות: ${E.skillLine(st.skills)}<br>טעויות שזוהו: ${tagList.join('; ') || 'אין'}</div>` : ''}
      <div class="row"><button id="go">למסלול שלי</button></div></div>`;
    $('go').onclick = course;
  }

  // ---------- מסך הקורס ----------
  const unitDef = id => K.UNITS.find(u => u.id === id);
  const ready = id => !!K.units[id];
  function course() {
    st.phase = 'course'; st.unit = null; save();
    layout(false);
    const path = st.path || [];
    const core = path.filter(p => !p.optional);
    const doneN = core.filter(p => st.done[p.id]).length;
    const next = path.find(p => !st.done[p.id] && ready(p.id));
    const rows = (T ? K.UNITS.map(u => path.find(p => p.id === u.id) || { id: u.id, ver: null }) : path).map(p => {
      const u = unitDef(p.id), dn = !!st.done[p.id], act = next && next.id === p.id;
      const icon = dn ? '✓' : act ? '▸' : '';
      const meta = dn ? 'הושלמה' : `כ-${u.min} דקות${p.optional ? ' · רשות' : ''}`;
      let btn = '';
      if (!dn && ready(p.id) && (act || T || p.optional)) btn = `<button class="${act ? '' : 'sec '}small" data-open="${p.id}" data-ver="${p.ver || 'teach'}">כניסה</button>`;
      else if (!dn && !ready(p.id)) btn = '<span class="tag">בקרוב</span>';
      const tv = T ? (p.ver ? `<span class="tag">${{ teach: 'הקניה', reinforce: 'חיזוק', deep: 'העמקה' }[p.ver]}</span>` : '<span class="tag">לא במסלול</span>') : '';
      const tsel = T && ready(p.id) ? ` <button class="ghost small nosay" data-open="${p.id}" data-ver="${p.ver === 'teach' ? 'reinforce' : 'teach'}">(${p.ver === 'teach' ? 'חיזוק' : 'הקניה'})</button>` : '';
      return `<li class="${dn ? 'done' : ''}${act ? ' active' : ''}"><span class="ic">${icon}</span><span class="t"><b>${u.title}</b>${tv}<br><span class="meta">${meta}</span></span>${btn}${tsel}</li>`;
    }).join('');
    const knows = [1, 2, 3, 4, 5, 6, 7, 8].filter(s => st.skills[s] === 'mastered').map(s => `<li>${K.SKILL_SAY[s]}</li>`).join('');
    const badges = E.BADGES.filter(b => st.badges[b]).map(b => `<span class="badge">${BADGE_NAME[b]}</span>`).join('');
    const pct = core.length ? Math.round(100 * doneN / core.length) : 100;
    main.innerHTML = `${tview(T ? `מיומנויות: ${E.skillLine(st.skills)} · ${E.encode(st, K)}` : '')}
      <div class="card"><h1>${K.title}</h1><p class="muted">${K.sub}</p>
        <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
        <p><b>${doneN} מתוך ${core.length}</b> יחידות במסלול שלך</p>
        <div class="row">${next ? `<button id="cont">${doneN || (st.unitStarted || {})[next.id] ? 'המשך מהיחידה האחרונה' : 'מתחילים'}</button>` : ''}</div>
        ${!next ? `<div class="fb ok">${core.length && doneN === core.length ? 'כל הכבוד! סיימתם את המסלול.' : 'כל הכבוד! סיימתם את כל מה שמוכן כרגע במסלול שלכם. יחידות נוספות ייפתחו בקרוב.'}</div>` : ''}
      </div>
      <div class="card"><h2>היחידות שלי</h2><ul class="ulist">${rows || '<li>אין יחידות במסלול.</li>'}</ul></div>
      ${knows || badges ? `<div class="card">${knows ? `<h3>מה אני כבר יודע/ת</h3><ul class="knows">${knows}</ul>` : ''}${badges ? `<h3>ההישגים שלי</h3><div class="badges">${badges}</div>` : ''}</div>` : ''}`;
    if (next) $('cont').onclick = () => openUnit(next.id, next.ver);
    main.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openUnit(b.dataset.open, b.dataset.ver));
  }

  // ---------- יחידה ----------
  function openUnit(id, ver) {
    const U = K.units[id];
    if (!U) return;
    st.unitStarted = st.unitStarted || {}; st.unitStarted[id] = true;
    st.unit = { id, ver: ver === 'reinforce' ? 'reinforce' : 'teach', i: 0, ev: {}, setI: 0, results: [] };
    st.phase = 'unit';
    log('unitStart', { unit: id, ver: st.unit.ver });
    save();
    screen();
  }
  const screens = () => { const U = K.units[st.unit.id]; return st.unit.ver === 'reinforce' ? U.reinforce : U.teach; };
  function next() { st.unit.i++; save(); screen(); }
  function frame(stepIdx, inner) {
    layout(true);
    const u = unitDef(st.unit.id);
    const s = Math.max(0, stepIdx - 1);
    main.innerHTML = `${tview(`${{ teach: 'גרסת הקניה', reinforce: 'גרסת חיזוק' }[st.unit.ver]} · מסך ${st.unit.i + 1}`)}<div class="card" id="ucard"><div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">${u.title}</h2><button class="ghost small nosay" id="back">→ למסלול</button></div>
      <div class="pills">${PILLS.map((p, i) => `<span class="pill${i === s ? ' on' : i < s ? ' done' : ''}">${i + 1}. ${p}</span>`).join('')}</div><div id="ubody">${inner}</div></div>`;
    $('back').onclick = course;
    say('אני כאן אם צריך עזרה.');
    return $('ubody');
  }
  function screen() {
    const list = screens();
    const sc = list[st.unit.i];
    if (!sc) return course();
    cur = null;
    const U = K.units[st.unit.id];
    if (sc.kind === 'warm') {
      const b = frame(1, '<h3>שאלת חימום</h3><div id="ib"></div>');
      askItem($('ib'), sc.item, 'learn', rec => { log('warm', { ok: rec.pass }); if (!rec.pass) st.unit.ev.warmMiss = true; next(); });
    } else if (sc.kind === 'goal') {
      const b = frame(1, `<h3>מה נלמד היום?</h3><p style="font-size:1.15rem">${R(sc.html)}</p><div class="row"><button id="nx">בואו נתחיל</button></div>`);
      $('nx').onclick = next;
    } else if (sc.kind === 'cutlab') cutlab();
    else if (sc.kind === 'info') {
      frame(sc.step, `<h3>${sc.title}</h3>${R(sc.html)}${sc.anim ? '<div id="anim"></div>' : ''}${fig(sc.fig)}<div class="row"><button id="nx">הבנתי, ממשיכים</button></div>`);
      if (sc.anim) halfAnim($('anim'));
      $('nx').onclick = next;
    } else if (sc.kind === 'contrast') {
      const c = U.contrast[st.tag] || U.contrast.none;
      frame(2, `<h3>${c.title}</h3>${R(c.html)}${fig(c.fig)}<div id="aft"></div><div class="row"><button id="nx">${c.after ? 'מה התשובה?' : 'הבנתי, ממשיכים'}</button></div>`);
      $('nx').onclick = () => {
        if (c.after && !$('aft').innerHTML) { $('aft').innerHTML = R(c.after) + fig(c.fig2); $('nx').textContent = 'הבנתי, ממשיכים'; return; }
        next();
      };
    } else if (sc.kind === 'practice') practice(sc, 0);
    else if (sc.kind === 'notebook') notebook(sc);
    else if (sc.kind === 'check') check(sc);
    else if (sc.kind === 'summary') summary();
  }
  function halfAnim(el) {
    const seq = [[1, 2, 1], [2, 4, 2], [4, 8, 4]];
    let i = 0;
    const show = () => { if (!document.body.contains(el)) return; const [n, d, g] = seq[i]; el.innerHTML = `<div class="bigmx">${R('⟦' + n + '/' + d + '⟧')}</div>` + fig({ k: 'bar', n, d, g, w: 320 }); i = (i + 1) % seq.length; setTimeout(show, 1600); };
    show();
  }

  // מעבדת החיתוך – הקניית ההרחבה
  function cutlab() {
    const b = frame(2, `<h3>בואו נבין</h3><p>בפס הזה 4 חלקים שווים, ו-3 מהם צבועים: ${R('⟦3/4⟧')}.</p><div id="barv"></div><div id="labq"></div><table class="cut" id="tbl" hidden><tr><th>חתכנו כל חלק ל…</th><th>השבר</th></tr><tr><td>(בלי חיתוך)</td><td>${R('⟦3/4⟧')}</td></tr></table>`);
    const show = k => { $('barv').innerHTML = `<div class="bigmx">${R(`⟦${3 * k}/${4 * k}⟧`)}</div>` + fig({ k: 'bar', n: 3 * k, d: 4 * k, g: k, w: 340 }); };
    const addRow = (lbl, k) => { $('tbl').hidden = false; $('tbl').insertAdjacentHTML('beforeend', `<tr><td>${lbl}</td><td>${R(`⟦${3 * k}/${4 * k}⟧`)}</td></tr>`); };
    show(1);
    const q = $('labq');
    q.innerHTML = '<div class="row"><button id="c2">✂️ חתכו כל חלק לשניים</button></div>';
    $('c2').onclick = () => {
      show(2); addRow('2', 2);
      q.innerHTML = '<div id="ib"></div>';
      askItem($('ib'), { id: 'L1', type: 'choice', q: 'מה קרה לחלק הצבוע של הפס?', ans: 2,
        opts: [{ t: 'גדל', msg: 'נכון שיש עכשיו יותר חלקים צבועים: 6 במקום 3. אבל כל חלק קטן יותר. הסתכלו על הפס: האם הצבע הגיע רחוק יותר?' },
          { t: 'קטן', msg: 'כל חלק באמת קטן יותר, אבל יש יותר חלקים צבועים. הסתכלו על כל השטח הצבוע יחד.' }, { t: 'נשאר אותו דבר' }],
        hints: ['השוו את המקום שבו הצבע נגמר – לפני ואחרי החיתוך.'], exp: 'הצבע מגיע בדיוק לאותו מקום. ⟦3/4 = 6/8⟧.' }, 'learn', () => step3());
    };
    function step3() {
      q.innerHTML = '<p>עכשיו נחתוך את הפס המקורי, כל חלק <b>לשלושה</b>.</p><div class="row"><button id="c3">✂️ חתכו כל חלק לשלושה</button></div>';
      $('c3').onclick = () => {
        $('barv').innerHTML = fig({ k: 'bar', n: 9, d: 12, g: 3, w: 340 });
        q.innerHTML = '<p>ספרו בציור וכתבו את השבר:</p><div id="ib"></div>';
        askItem($('ib'), { id: 'L2', type: 'open', q: 'כמה חלקים צבועים (למעלה), ומכמה חלקים בסך הכול (למטה)?', check: (n, d) => n === 9 && d === 12,
          bad: (n, d) => (n === 12 && d === 9) ? 'החלפתם בין המונה למכנה: למעלה – הצבועים, למטה – כל החלקים.' : '',
          hints: ['כל רבע נחתך ל-3. כמה חלקים יש עכשיו בכל הפס? כמה מהם צבועים?'], exp: '⟦3/4 = 9/12⟧.' }, 'learn', () => {
          show(3); addRow('3', 3);
          q.innerHTML = '<div class="row"><button id="c4">✂️ ועכשיו כל חלק לארבעה</button></div>';
          $('c4').onclick = () => {
            show(4); addRow('4', 4);
            q.innerHTML = '<div id="ib"></div>';
            askItem($('ib'), { id: 'L3', type: 'choice', q: 'הסתכלו בטבלה. מה קרה למונה ולמכנה כשחתכנו כל חלק לשלושה?', ans: 0,
              opts: [{ t: 'שניהם גדלו פי 3' }, { t: 'לשניהם הוסיפו 3', msg: 'בדקו: ⟦3 + 3⟧ זה 6, אבל המונה נהיה 9. מה עושים ל-3 כדי לקבל 9?' }, { t: 'רק המכנה גדל פי 3', msg: 'גם המונה השתנה: מ-3 ל-9. פי כמה?' }],
              hints: ['השוו את ⟦3/4⟧ ל-⟦9/12⟧: מה עשינו ל-3 כדי לקבל 9, ומה ל-4 כדי לקבל 12?'], exp: 'מ-3 ל-9 ומ-4 ל-12: שניהם גדלו פי 3.' }, 'learn', rec => { st.unit.ev.labOk = rec.pass; next(); });
          };
        });
      };
    }
  }

  function practice(sc, j) {
    const item = sc.items[j];
    if (!item) return next();
    frame(sc.step, `<h3>${sc.title} <span class="muted small">(${j + 1} מתוך ${sc.items.length})</span></h3>${fig(item.figTop)}<div id="ib"></div>`);
    askItem($('ib'), item, 'learn', rec => { if (rec.fixed) st.unit.ev.fixed = true; if (rec.firstTag === 'additive') st.unit.ev.additive = true; save(); practice(sc, j + 1); });
  }

  function notebook(sc) {
    frame(3, `<h3>עכשיו במחברת ✏️</h3>${R(sc.html)}<div class="row"><button id="nb">סיימתי במחברת</button></div><div id="nb2"></div>`);
    $('nb').onclick = () => {
      $('nb').remove();
      $('nb2').innerHTML = `<div class="fb info"><b>השוו לציור הזה:</b>${fig(sc.model)}${sc.selfcheck.map((t, i) => `<label class="chk"><input type="checkbox" data-c="${i}"> ${t}</label>`).join('')}</div><h3 style="margin-top:14px">שאלת אימות</h3><div id="ib"></div>`;
      let tries = 0;
      const ask = () => askItem($('ib'), { id: 'NB', type: 'nums', q: sc.verify.q, labels: sc.verify.labels, ans: sc.verify.ans }, 'diag', rec => {
        tries++;
        log('notebook', { ok: rec.correct, tries });
        if (rec.correct) { $('ib').insertAdjacentHTML('beforeend', '<div class="fb ok">✓ מצוין! העבודה במחברת מתאימה.</div><div class="row"><button id="nx">ממשיכים</button></div>'); $('nx').onclick = next; }
        else if (tries === 1) { $('ib').insertAdjacentHTML('beforeend', `<div class="fb bad">בואו נבדוק את הציור יחד: הסתכלו על הציור לדוגמה, ותקנו במחברת אם צריך.</div><div class="row"><button id="again">ניסיון נוסף</button></div>`); $('again').onclick = ask; }
        else { st.unit.ev.nbMiss = true; $('ib').insertAdjacentHTML('beforeend', '<div class="fb info">נמשיך הלאה. כדאי להראות את המחברת למורה בהזדמנות.</div><div class="row"><button id="nx">ממשיכים</button></div>'); $('nx').onclick = next; }
      });
      ask();
    };
  }

  // בדיקת שליטה: 3 שאלות. שליטה = לפחות 2 עברו (ראשונה או שנייה אחרי משוב, בלי רמז) והאחרונה עברה.
  function check(sc) {
    const U = K.units[st.unit.id], u = st.unit;
    const setName = sc.sets[u.setI];
    if (!setName) return referral(true);
    const items = U.sets[setName];
    const j = u.results.length;
    if (j >= items.length) {
      const passes = u.results.filter(r => r.pass).length;
      const mastered = passes >= 2 && u.results[items.length - 1].pass;
      log('check', { set: setName, passes, mastered });
      if (u.results.some(r => !r.pass && r.correct) || u.results.some(r => r.attempts > 1)) { if (mastered) u.ev.persist = true; }
      if (mastered) { u.mastered = true; u.masteredSet = setName; save(); return next(); }
      u.setI++; u.results = [];
      save();
      if (!sc.sets[u.setI]) return referral(true);
      return ladder(sc);
    }
    frame(4, `<h3>בודקים הבנה <span class="muted small">(${j + 1} מתוך ${items.length})</span></h3><div id="ib"></div>`);
    askItem($('ib'), items[j], 'learn', rec => {
      u.results.push(rec);
      if (rec.fixed) u.ev.fixed = true;
      if (rec.firstTag === 'additive') u.ev.additive = true;
      if (items[j].claim && rec.pass) u.ev.claim = true;
      u.lastWrong = rec.pass ? u.lastWrong : { q: items[j].q, answers: rec.answers };
      save();
      check(sc);
    });
  }
  // סולם העזרה אחרי בדיקה שלא עברה: הסבר בדרך אחרת → משימה פשוטה → סט מקביל
  function ladder(sc) {
    const U = K.units[st.unit.id];
    log('ladder');
    frame(4, `<h3>בואו ננסה בדרך אחרת</h3><p>עוד לא הגעתם לשליטה, וזה בסדר. ננסה להבין את זה בדרך נוספת.</p><h3>${U.alt.title}</h3>${R(U.alt.html)}${fig(U.alt.fig)}<div class="row"><button id="nx">הבנתי</button></div>`);
    $('nx').onclick = () => {
      frame(4, '<h3>משימה קצרה</h3><div id="ib"></div>');
      askItem($('ib'), U.simpler, 'learn', () => {
        frame(4, '<h3>ועכשיו – בדיקה נוספת</h3><p>שלוש שאלות חדשות. קחו את הזמן.</p><div class="row"><button id="nx">מתחילים</button></div>');
        $('nx').onclick = () => check(sc);
      });
    };
  }

  // ---------- המורה ----------
  function teacherCard(auto) {
    const u = st.unit, U = u ? unitDef(u.id) : null;
    const doneU = K.UNITS.filter(x => st.done[x.id]).map(x => x.title);
    const known = [1, 2, 3, 4, 5, 6, 7, 8].filter(s => st.skills[s] === 'mastered').map(s => K.SKILLS[s]);
    const lw = u && u.lastWrong;
    const curQ = cur && cur.item ? cur.item.q : null;
    const helps = (st.log || []).filter(l => u && l.t >= (st.log.find(x => x.type === 'unitStart' && x.unit === u.id) || { t: 0 }).t);
    const hintsN = helps.filter(l => l.type === 'hint').length, altN = helps.filter(l => l.type === 'alt').length;
    const stuck = curQ || (lw && lw.q);
    const ans = lw && lw.answers && lw.answers.length ? `תשובות שנתן/ה: ${lw.answers.join(', ')}` : '';
    const html = `${auto ? '<p><b>ניסינו כמה דרכים להבין את הנושא. עכשיו כדאי להיעזר במורה כדי להתקדם.</b></p>' : '<p>הכרטיס הזה מחכה למורה. בינתיים אפשר לעשות משימת חזרה.</p>'}
      <div class="tcard"><dl>
        <dt>שם</dt><dd>${esc(st.name)}</dd>
        <dt>נושא</dt><dd>${K.title}${U ? ' · ' + U.title : ''}</dd>
        <dt>כבר הצליח/ה</dt><dd>${doneU.length ? 'יחידות: ' + doneU.join(', ') + '. ' : ''}${known.length ? 'מיומנויות: ' + known.join(', ') : 'עוד אין מיומנויות שהוכחו'}</dd>
        ${stuck ? `<dt>במה נתקע/ה</dt><dd>${R(stuck.replace(/<div class="bigmx">/g, ' ').replace(/<\/div>/g, ''))} ${ans ? '<br>' + esc(ans) : ''}</dd>` : ''}
        <dt>עזרה שכבר קיבל/ה</dt><dd>${hintsN} רמזים${altN ? `, הסבר בדרך אחרת` : ''}${u && u.setI > 0 ? ', משימה פשוטה יותר וסט שאלות נוסף' : ''}</dd>
      </dl></div>`;
    const detail = `${U ? U.title : K.title} · ${stuck ? stuck.replace(/<[^>]+>/g, ' ').replace(/[⟦⟧]/g, '').replace(/\s+/g, ' ').trim() : ''}${ans ? ' · ' + ans : ''}`;
    E.track(st.name, auto ? 'הפניה למורה' : 'עזרת מורה', detail);
    log('teacher', { auto: !!auto });
    const m = modal(`<h2>🙋 קוראים למורה</h2>${html}<div class="row"><button id="mwt">משימת חזרה בזמן שמחכים</button></div>`);
    m.el.querySelector('#mwt').onclick = () => { m.close(); waiting(0); };
  }
  function referral() {
    if (st.unit) st.unit.referred = true;
    save();
    frame(4, '<h3>הגיע הזמן לעזרה מהמורה</h3><p>ניסינו כמה דרכים, ועוד לא הגענו לשליטה. זה קורה, ובשביל זה יש מורה. 🙂</p><div class="row"><button id="tc">הצגת כרטיס העזרה</button><button class="sec" id="wt">משימת חזרה בזמן שמחכים</button></div>');
    $('tc').onclick = () => teacherCard(true);
    $('wt').onclick = () => waiting(0);
    teacherCard(true);
  }
  function waiting(j) {
    const U = K.units[st.unit ? st.unit.id : 'u4'];
    const items = U.waiting;
    if (j >= items.length) {
      frame(4, '<h3>סיימתם את משימת החזרה 👏</h3><p>כשהמורה מגיע/ה, הראו לה את כרטיס העזרה.</p><div class="row"><button id="tc">הצגת כרטיס העזרה</button><button class="sec" id="cr">למסלול שלי</button></div>');
      $('tc').onclick = () => teacherCard(true);
      $('cr').onclick = course;
      return;
    }
    frame(4, `<h3>משימת חזרה <span class="muted small">(${j + 1} מתוך ${items.length})</span></h3><div id="ib"></div>`);
    askItem($('ib'), items[j], 'learn', () => waiting(j + 1));
  }

  // ---------- סיכום יחידה ----------
  function summary() {
    const u = st.unit, U = K.units[u.id];
    if (!u.mastered) return check({ sets: (u.ver === 'reinforce' ? ['B', 'C'] : ['A', 'B']) });
    const ev = u.ev;
    let line;
    if (ev.additive && ev.fixed) line = 'בהתחלה הוספתם מספר למונה ולמכנה. עכשיו אתם כופלים, ויודעים להסביר למה.';
    else if (ev.drawing) line = 'בהתחלה נעזרתם בציור. בסוף הרחבתם שברים גם בחישוב.';
    else if (ev.claim) line = 'הרחבתם שברים בעצמכם, וזיהיתם טעות של תלמיד אחר והסברתם אותה.';
    else line = 'הרחבתם שברים בעצמכם, ובשאלה האחרונה פתרתם בלי רמז.';
    const newB = [];
    const give = b => { if (!st.badges[b]) newB.push(b); st.badges[b] = true; };
    give('master');
    if (ev.claim) give('explain');
    if (ev.fixed) give('fix');
    if (ev.persist || u.setI > 0) give('persist');
    if (!st.done[u.id]) { st.done[u.id] = true; st.skills[U.skill] = 'mastered'; }
    save();
    E.track(st.name, 'יחידה', `${unitDef(u.id).title} (${u.ver === 'teach' ? 'הקניה' : 'חיזוק'}) · שליטה ✓ · סט ${u.masteredSet} · רמזים ${(st.log || []).filter(l => l.type === 'hint').length}`);
    frame(5, `<h3>מה למדתי? 🎉</h3><p style="font-size:1.15rem">${line}</p><div class="rulebox">${U.learned}</div>
      ${newB.length ? `<h3 style="margin-top:14px">הישגים חדשים</h3><div class="badges">${newB.map(b => `<span class="badge">${BADGE_NAME[b]}</span>`).join('')}</div>` : ''}
      <div class="row"><button id="cr">חזרה למסלול שלי</button></div>`);
    $('cr').onclick = course;
  }

  // ---------- סיום מפגש ----------
  function endSession() {
    if (!st || !st.name) return;
    if (st.phase === 'diag' || st.phase === 'diagIntro') {
      if (!confirmEnd()) return;
    }
    const code = E.encode(st, K);
    const doneN = (st.path || []).filter(p => !p.optional && st.done[p.id]).length, all = (st.path || []).filter(p => !p.optional).length;
    E.track(st.name, 'סיכום מפגש', `${K.title} · ${E.skillLine(st.skills)} · יחידות ${doneN}/${all} · קוד ${code}`);
    const name = st.name;
    st.phase = 'end'; save();
    layout(false);
    main.innerHTML = `<div class="card"><h2>כל הכבוד, ${esc(name.split(' ')[0])}!</h2>
      <p>העתיקו את הקוד הזה למחברת, ליד התאריך של היום:</p><div class="code">${code}</div>
      <p>בפעם הבאה תקלידו אותו במסך הכניסה, ותמשיכו בדיוק מאותו מקום.</p>
      <div class="row"><button id="fin">העתקתי – סיום</button></div></div>`;
    $('fin').onclick = () => { E.store.clear(); st = null; entry(); };
  }
  function confirmEnd() { return st.phase !== 'diag' || window.confirm('המבדק עוד לא הסתיים. לסיים בכל זאת?'); }

  /* ---------- כפתורי המאמן ---------- */
  coachEl.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const h = b.dataset.h;
    log('help', { h });
    if (h === 'lost') {
      say('מה לא ברור?');
      $('bubble').insertAdjacentHTML('beforeend', `<div class="sub">${[['words', 'המילים'], ['what', 'מה צריך לעשות'], ['idea', 'מה זה בכלל'], ['start', 'איך מתחילים'], ['calc', 'החישוב']].map(([k, t]) => `<button class="sec small" data-l="${k}">${t}</button>`).join('')}</div>`);
      $('bubble').querySelectorAll('[data-l]').forEach(x => x.onclick = () => lost(x.dataset.l));
    } else if (h === 'alt') {
      const U = K.units[(st.unit && st.unit.id) || 'u4'];
      log('alt');
      modal(`<h2>${U.alt.title}</h2>${R(U.alt.html)}${fig(U.alt.fig)}`);
    } else if (h === 'hint') {
      if (!(cur && cur.hint && cur.hint())) say('כרגע אין שאלה פתוחה. אם משהו לא ברור, לחצו "לא הבנתי".');
      else say('הוספתי רמז ליד השאלה. 💡');
    } else if (h === 'read') speak($('ucard') || main);
    else if (h === 'teacher') teacherCard(false);
  });
  function lost(k) {
    const it = cur && cur.item;
    log('lost', { k });
    if (k === 'words') modal(`<h2>מילון קטן</h2>${K.GLOSSARY.map(([w, t, f]) => `<p><b>${w}:</b> ${t}</p>${f ? fig(f) : ''}`).join('')}`);
    else if (k === 'what') say(it && it.rephrase ? it.rephrase : 'קראו שוב את השאלה לאט: מה מבקשים למצוא? אפשר גם ללחוץ "הקרא לי".');
    else if (k === 'idea') { const U = K.units[(st.unit && st.unit.id) || 'u4']; modal(`<h2>${U.alt.title}</h2>${R(U.alt.html)}${fig(U.alt.fig)}`); }
    else if (k === 'start') say(it && it.start ? it.start : 'מתחילים מהמספר שידוע בשני השברים: פי כמה הוא גדל?');
    else if (k === 'calc') {
      let t = '<table class="mt">';
      for (let r = 0; r <= 10; r++) { t += '<tr>'; for (let c = 0; c <= 10; c++) t += r === 0 && c === 0 ? '<td class="h">×</td>' : r === 0 ? `<td class="h">${c}</td>` : c === 0 ? `<td class="h">${r}</td>` : `<td>${r * c}</td>`; t += '</tr>'; }
      modal(`<h2>לוח הכפל</h2>${t}</table>`);
      log('mulTable');
    }
  }
  $('coachToggle').onclick = () => { const o = coachEl.classList.toggle('open'); $('coachToggle').setAttribute('aria-expanded', o); };

  $('endBtn').onclick = endSession;
  $('bigBtn').onclick = () => document.body.classList.toggle('big');

  /* ---------- חוסר פעילות (מחשב משותף) ---------- */
  let idleT = null;
  const IDLE = 20 * 60 * 1000;
  const bump = () => { clearTimeout(idleT); if (st && st.name && st.phase !== 'end') idleT = setTimeout(idleAsk, IDLE); };
  function idleAsk() {
    if (document.querySelector('.overlay.idle')) return;
    const m = modal(`<h2>ממשיכים?</h2><p>לא היתה פעילות כבר זמן מה. ${esc(st.name.split(' ')[0])}, את/ה עדיין כאן?</p><div class="row"><button id="iy">אני ממשיך/ה</button><button class="sec" id="in">סיימתי להיום</button></div>`, bump);
    m.el.classList.add('idle');
    m.el.querySelector('#iy').onclick = () => m.close();
    m.el.querySelector('#in').onclick = () => { m.close(); endSession(); };
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, bump, true));

  /* ---------- התחלה ---------- */
  if (!st || st.phase === 'end') { st = null; entry(); }
  else if (st.phase === 'diagIntro') diagIntro();
  else if (st.phase === 'diag') diagQ();
  else if (st.phase === 'unit' && st.unit) screen();
  else course();
  bump();
  window.__coach = { get st() { return st; } };
})();
</script>
</body>
</html>
