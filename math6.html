const app = document.getElementById('app');

/* ---------- כיוון תרגילים: תרגיל במאוזן נכתב משמאל לימין (סימן השווה מימין למחוברים) ----------
   כשתרגיל בנוי מכמה חלקים (M(...) = M(...)), הדפדפן מסדר אותם מימין לשמאל.
   כאן מאחדים רצף של חלקי חשבון צמודים לתיבה אחת משמאל לימין. */
const MATH_EL = el => el.nodeType === 1 && /(^|\s)(m|fr|box)(\s|$)/.test(el.className || '');
const JOIN_RE = /^(?:\s|[=+\-×:·?()]|\d+(?:[.,]\d+)*)*$/;
const OP_RE = /[=+\-×:·]/;
const PLAIN_EQ = /\(?\d+(?:[.,]\d+)*\)?(?:(?:\s*[=+\-−×·→]|\s+:)\s*(?:\(?\s*\d+(?:[.,]\d+)*\s*\)?|\?))+(?:\s*=)?/;
function fixMathRuns(root) {
  if (!root || root.nodeType !== 1 || root.closest('svg, .m')) return;
  const parents = [root, ...root.querySelectorAll('*')].filter(el => !el.closest('svg, .m') && el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE');
  for (const par of parents) {
    // תרגיל שנכתב כטקסט רגיל (למשל "12 : 4 = 3") – עוטפים בתיבה משמאל לימין
    for (const t of [...par.childNodes]) {
      if (t.nodeType !== 3) continue;
      const re = new RegExp(PLAIN_EQ.source, 'g');
      if (!re.test(t.textContent)) continue;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(t.textContent))) {
        frag.appendChild(document.createTextNode(t.textContent.slice(last, m.index)));
        const sp = document.createElement('span'); sp.className = 'm'; sp.textContent = m[0];
        frag.appendChild(sp); last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(t.textContent.slice(last)));
      par.replaceChild(frag, t);
    }
    let kids = [...par.childNodes];
    for (let i = 0; i < kids.length; i++) {
      if (!MATH_EL(kids[i])) continue;
      // קידומת: סוף טקסט לפני האיבר (למשל "3 + ")
      const run = [kids[i]];
      let j = i + 1;
      while (j < kids.length) {
        const k = kids[j];
        if (MATH_EL(k)) { run.push(k); j++; continue; }
        if (k.nodeType === 3) {
          if (JOIN_RE.test(k.textContent)) { run.push(k); j++; continue; }
          const m = k.textContent.match(/^(?:\s|[=+\-×:·?()]|\d+(?:[.,]\d+)*)*[=+\-×:·?]/);
          if (m && OP_RE.test(m[0])) { k.splitText(m[0].length); run.push(k); }
        }
        break;
      }
      // מורידים מסוף הרצף טקסט שאינו חלק מהתרגיל (רווחים, נקודתיים של משפט)
      while (run.length > 1 && run[run.length - 1].nodeType === 3 && !/[=\d?]/.test(run[run.length - 1].textContent)) run.pop();
      const prev = kids[i].previousSibling;
      if (prev && prev.nodeType === 3) {
        const m = prev.textContent.match(/(?:^|\s)((?:\d+(?:[.,]\d+)*\s*)?[=+\-×:·(]\s*)$/);
        if (m && OP_RE.test(m[1]) && /\d/.test(m[1])) { const tail = prev.splitText(prev.textContent.length - m[1].length); run.unshift(tail); }
      }
      const hasOp = run.some(n => n.nodeType === 3 && OP_RE.test(n.textContent));
      if (run.length > 1 && hasOp) {
        const w = document.createElement('span');
        w.className = 'm';
        run[0].parentNode.insertBefore(w, run[0]);
        run.forEach(n => w.appendChild(n));
      }
      kids = [...par.childNodes];
      i = kids.indexOf(run[0].parentNode === par ? run[run.length - 1] : run[0].parentNode);
    }
  }
}
new MutationObserver(muts => {
  for (const mu of muts) for (const n of mu.addedNodes) if (n.nodeType === 1) fixMathRuns(n);
  for (const mu of muts) if (mu.type === 'childList' && mu.target.nodeType === 1 && mu.addedNodes.length) fixMathRuns(mu.target);
}).observe(document.body, { childList: true, subtree: true });

function currentLevel(topicId) {
  if (topicId === 'mix') {
    const lv = TOPICS.map(t => (store.topics[t.id] || {}).level || 1);
    return Math.max(1, Math.min(3, Math.round(lv.reduce((a, b) => a + b, 0) / lv.length)));
  }
  return (store.topics[topicId] || {}).level || 1;
}

  const title = t ? `${t.icon} ${t.name}` : '🔀 תרגול מעורב';

  ov.innerHTML = `<div class="modal picker" role="dialog" aria-modal="true">

        <span class="ldesc">${LEVEL_DESC[topicId][n - 1]}</span>

    <p class="muted center small">בלי הסימון – האפליקציה תעלה אתכם רמה כשתצליחו, ותוריד כשיהיה קשה.</p>
  </div>`;

function bindLevelBadge() {

const levelBadgeText = () => `${state.fixed ? '🔒 ' : ''}${LEVEL_NAME[state.level]} ${'⭐'.repeat(state.level)} ▾`;

function startPreset() {
  const p = PRESET;
  if (p.learn) return startLesson(p.learn);
  if (p.topic === 'test') return startTest(false);
  if (p.topic === 'testfb') return startTest(true);
  if (p.topic === 'sim') return showSimPicker();
  startPractice(p.topic, { level: p.level, count: p.count, fixed: p.fixed, hideLevel: p.fixed });
}

function masterySnapshot() {
  return Object.fromEntries(TOPICS.map(t => [t.id, (store.topics[t.id] || {}).mastery || 0]));
}

function startPractice(topicId, opt = {}) {
  let level = opt.level;
  if (!level) {
    if (topicId === 'mix') {
      const lv = TOPICS.map(t => (store.topics[t.id] || {}).level || 1);
      level = Math.max(1, Math.min(3, Math.round(lv.reduce((a, b) => a + b, 0) / lv.length)));
    } else level = tstat(topicId).level || 1;
  }
  state = {
    mode: 'practice', topicId, level,
    count: opt.list ? opt.list.length : opt.retry ? opt.retry.length : (opt.count || store.roundLen || 10),
    fixed: !!(opt.fixed || opt.list || opt.retry), hideLevel: !!opt.hideLevel,
    retry: opt.retry || null, list: opt.list || null, label: opt.label || null, lessonId: opt.lessonId || null,
    mixOrder: shuffle(TOPICS.map(t => t.id)),
    qs: [], i: 0, results: [], run: 0, streak: 0, prevGen: null, m0: masterySnapshot()
  };
  renderQ();
}

function startTest(withFeedback) {
  const qs = buildTest();
  if (withFeedback) return startPractice('test', { list: qs, label: `📝 ${GRADE === 6 ? 'מבדק' : 'מבחן'} עם משוב` });
  state = { mode: 'test', topicId: 'test', qs, count: qs.length, i: 0, results: [], score: 0 };
  renderQ();
}

/* ---------- סימולציה עם שעון ---------- */
let simTimer = null;
function stopSimTimer() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

function showSimPicker() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal picker" role="dialog" aria-modal="true">
    <div class="mtop"><button class="ghost" data-close>✖ ביטול</button></div>
    <h2 class="center">⏱️ סימולציה עם שעון</h2>
    <p class="center">20 שאלות מכל הנושאים, בלי רמזים. אפשר לדלג על שאלה ולחזור אליה, ולהגיש מתי שרוצים.<br>כשהזמן נגמר – ${GRADE === 6 ? 'המבדק' : 'המבחן'} מוגש לבד.</p>
    <p class="center"><b>כמה זמן?</b></p>
    <div class="simtimes">${[30, 45, 60].map(m => `<button data-min="${m}"${m === 45 ? ' class="cur"' : ''}>${m} דקות</button>`).join('')}</div>
    <p class="muted center small">אפשר ללחוץ על השעון כדי להסתיר אותו בזמן הפתרון.</p>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('[data-close]').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { close(); startSim(Number(b.dataset.min)); });
  ov.querySelector('[data-min="45"]').focus();
}

function startSim(mins) {
  stopSimTimer();
  const qs = buildTest();
  state = { mode: 'test', topicId: 'test', qs, count: qs.length, i: 0, results: [], score: 0,
    sim: { mins, start: Date.now(), end: Date.now() + mins * 60000, answers: [], raw: [], hide: false } };
  const me = state;
  simTimer = setInterval(() => {
    if (state !== me) return stopSimTimer();
    updateSimClock();
    if (Date.now() >= me.sim.end) finishSim(true);
  }, 1000);
  renderQ();
}

function simLeft() { return Math.max(0, Math.ceil((state.sim.end - Date.now()) / 1000)); }
function simClockText() {
  if (state.sim.hide) return '⏱️ הצגת השעון';
  const t = simLeft();
  return `⏱️ ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
}
function updateSimClock() {
  const el = $('timer');
  if (!el) return;
  el.textContent = simClockText();
  el.classList.toggle('warn', !state.sim.hide && simLeft() <= 300);
}

// שמירת התשובה של השאלה הנוכחית (בלי בדיקה)
function simSave() {
  const s = state, q = s.qs[s.i];
  if (!$('mainAns')) return;
  s.sim.answers[s.i] = readAnswer(q);
  const raw = {};
  app.querySelectorAll('#mainAns input').forEach(inp => raw[inp.id] = inp.value);
  raw.selected = s.selected;
  s.sim.raw[s.i] = raw;
}
function simRestore() {
  const raw = state.sim.raw[state.i];
  if (!raw) return;
  app.querySelectorAll('#mainAns input').forEach(inp => { if (raw[inp.id] != null) inp.value = raw[inp.id]; });
  if (raw.selected != null) {
    state.selected = raw.selected;
    const b = app.querySelector(`.choices button[data-c="${raw.selected}"]`);
    if (b) b.classList.add('sel');
  }
}
function simAnswered(i) {
  const a = state.sim.answers[i];
  return !!a && !check(state.qs[i], a).empty;
}
function simGo(i) {
  simSave();
  state.i = i;
  renderQ();
  window.scrollTo(0, 0);
}
function simSubmitAsk() {
  simSave();
  const left = state.qs.filter((q, i) => !simAnswered(i)).length;
  if (!confirm(left ? `יש עוד ${left} שאלות בלי תשובה. להגיש בכל זאת?` : `להגיש את ${GRADE === 6 ? 'המבדק' : 'המבחן'}?`)) return;
  finishSim(false);
}
function finishSim(timeUp) {
  stopSimTimer();
  const s = state;
  if (timeUp) simSave();
  s.sim.used = Math.min(s.sim.mins * 60, Math.round((Date.now() - s.sim.start) / 1000));
  s.sim.timeUp = timeUp;
  const empty = q => q.type === 'num' ? { raw: '', val: null } : q.type === 'choice' ? { val: null } : { val: { w: null, n: null, d: null } };
  s.results = s.qs.map((q, i) => {
    const a = s.sim.answers[i] || empty(q);
    const ok = !!check(q, a).ok;
    return { q, a, ok, outcome: ok ? 'first' : 'shown' };
  });
  s.score = s.results.filter(r => r.ok).length;
  s.i = s.count;
  if (timeUp) alert('⏰ הזמן נגמר! ' + (GRADE === 6 ? 'המבדק הוגש' : 'המבחן הוגש') + '. בואו נראה איך הלך.');
  summary();
}

function makeQuestion() {
  const s = state;
  if (s.list) return s.list[s.i];
  if (s.retry) { const r = s.retry[s.i]; return mk(r.topic, r.gen, r.lv); }
  const topic = s.topicId === 'mix' ? s.mixOrder[s.i % s.mixOrder.length] : s.topicId;
  const pool = TOPIC[topic].levels[s.level];
  let g = pick(pool);
  if (pool.length > 1) while (g === s.prevGen) g = pick(pool);
  s.prevGen = g;
  return mk(topic, g, s.level);
}

function inputHTML(q) {
  if (q.type === 'num') return `
    <span class="lbl">תשובה:</span>
    <input id="ans" class="ans" inputmode="decimal" autocomplete="off" aria-label="תשובה">
    ${q.unit ? `<span class="unit">${q.unit}</span>` : ''}`;
  if (q.type === 'frac') return `
    <span class="lbl">תשובה:</span>
    <span class="fracin">
      ${q.noWhole ? '' : '<input id="fw" class="w" inputmode="numeric" aria-label="שלם" placeholder="שלם">'}
      <span class="stack">
        <input id="fn" inputmode="numeric" aria-label="מונה" placeholder="מונה">
        <span class="bar"></span>
        <input id="fd" inputmode="numeric" aria-label="מכנה" placeholder="מכנה">
      </span>
    </span>
    <span class="fracin-note">${q.noWhole ? 'כתבו מונה ומכנה.' : 'אם התשובה גדולה מ-1, כתבו אותה כשבר מעורב (שלם + שבר). אם התשובה מספר שלם – כתבו רק בתיבה "שלם".'}</span>`;
  return `<div class="choices">${q.choices.map((c, i) => `<button data-c="${i}">${c}</button>`).join('')}</div>`;
}

function titleText() {
  if (state.sim) return '⏱️ סימולציה עם שעון';
  if (state.mode === 'test') return '📝 ' + TEST_NAME;
  if (state.label) return state.label;
  if (state.retry) return '🔁 תרגול הטעויות שלי';
  if (state.topicId === 'mix') return '🔀 תרגול מעורב';
  const t = TOPIC[state.topicId];
  return `${t.icon} ${t.name}`;
}

function renderQ() {
  if (!state.qs[state.i]) state.qs[state.i] = state.mode === 'test' ? state.qs[state.i] : makeQuestion();
  const q = state.qs[state.i];
  const t = TOPIC[q.topic];
  const total = state.count;
  const practice = state.mode === 'practice';
  Object.assign(state, { tries: 0, selected: null, done: false, guide: null });
  stopSpeak();
  const tips = practice && TOPIC[state.topicId]
    ? `<details class="tips"><summary>📘 תזכורת – מה חשוב לזכור בנושא</summary><ul>${t.tips.map(x => `<li>${x}</li>`).join('')}</ul></details>` : '';
  const showLevel = practice && !state.hideLevel && !state.list && !state.retry;
  app.innerHTML = `
    <div class="topbar">
      <span class="title">${titleText()}</span>
      <span>שאלה ${state.i + 1} מתוך ${total}</span>
      ${state.sim ? `<button class="timer" id="timer" title="הסתרה/הצגה של השעון">${simClockText()}</button>` : ''}
      <span>
        <button class="ghost" id="fontBtn" title="שינוי גודל הכתב">א+</button>
        <button class="ghost" id="quit">✖ יציאה</button>
      </span>
    </div>
    <div class="progress"><div style="width:${state.i / total * 100}%"></div></div>
    ${state.sim ? `<div class="simnav" aria-label="מעבר בין שאלות">${state.qs.map((x, i) => `<button data-go="${i}" class="${simAnswered(i) ? 'done' : ''}${i === state.i ? ' cur' : ''}" aria-label="שאלה ${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="simnote">כחול = יש תשובה · אפשר ללחוץ על מספר כדי לעבור לשאלה</div>` : ''}
    ${practice ? `<div class="statusrow">
      ${showLevel ? `<span class="lvlwrap"><button class="lvl" id="lvlBtn" title="שינוי רמה" aria-label="שינוי רמה">${levelBadgeText()}</button><span class="lvlpick hidden" id="lvlPick">${[1, 2, 3].map(n => `<button class="${n === state.level ? 'sel' : ''}" data-lv="${n}">${'⭐'.repeat(n)} ${LEVEL_NAME[n]}</button>`).join('')}</span><span class="lvlnote" id="lvlNote"></span></span>` : '<span></span>'}
      <span class="streak">${state.streak >= 2 ? `🔥 ${state.streak} ברצף!` : ''}</span>
    </div>` : ''}
    ${tips}
    <div class="card">
      <div class="qtag" style="color:${t.color}">${t.icon} ${t.name}</div>
      <div class="qhead">
        <span class="qnum" style="background:${t.color}">${state.i + 1}</span>
        <div class="qtext">${q.text}</div>
        ${canSpeak ? '<button class="ghost speak" id="speakBtn" title="הקראת השאלה" aria-label="הקראת השאלה">🔊</button>' : ''}
      </div>
      ${q.fig || ''}
      <div class="answer-area" id="mainAns">${inputHTML(q)}</div>
      <div class="actions">
        ${state.sim && state.i > 0 ? '<button class="secondary" id="prevQ">→ לשאלה הקודמת</button>' : ''}
        ${q.type === 'choice' && practice ? '' : `<button id="go">${state.sim ? (state.i + 1 === total ? 'סיום והגשה' : 'לשאלה הבאה ←') : !practice ? (state.i + 1 === total ? 'סיום והגשה' : 'שמירה והמשך ←') : 'בדיקה ✓'}</button>`}
        ${state.sim && state.i + 1 < total ? '<button class="secondary" id="simDone">🏁 הגשה</button>' : ''}
        ${practice ? '<button class="secondary" id="hintBtn">💡 רמז</button>' : ''}
        ${practice && q.gen ? '<button class="secondary" id="exBtn">📖 דוגמה פתורה</button>' : ''}
        <button class="hidden" id="next">${state.i + 1 === total ? 'לסיכום 🏁' : 'לשאלה הבאה ←'}</button>
      </div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div id="guide" aria-live="polite"></div>
      <div class="example hidden" id="example"></div>
    </div>`;

  $('fontBtn').onclick = cycleFont;
  bindLevelBadge();
  $('quit').onclick = () => { if (confirm('לצאת לתפריט הראשי? ההתקדמות בסבב הזה לא תישמר.')) home(); };
  if (state.sim) {
    $('timer').onclick = () => { state.sim.hide = !state.sim.hide; updateSimClock(); };
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => simGo(Number(b.dataset.go)));
    if ($('prevQ')) $('prevQ').onclick = () => simGo(state.i - 1);
    if ($('simDone')) $('simDone').onclick = simSubmitAsk;
  }
  if ($('speakBtn')) $('speakBtn').onclick = e => speak(q.text + (q.type === 'choice' ? '. האפשרויות: ' + q.choices.join('. ') : ''), e.currentTarget);
  if ($('go')) $('go').onclick = submit;
  if ($('hintBtn')) $('hintBtn').onclick = () => showFb('hint', `💡 <span class="head">רמז:</span> ${q.hint}`);
  if ($('exBtn')) $('exBtn').onclick = showExample;
  $('next').onclick = nextQ;

  if (q.type === 'choice') {
    app.querySelectorAll('.choices button').forEach(b => b.onclick = () => {
      if (state.done || state.guide) return;
      state.selected = Number(b.dataset.c);
      app.querySelectorAll('.choices button').forEach(x => x.classList.toggle('sel', x === b));
      if (practice) submit();
    });
  } else {
    const inputs = app.querySelectorAll('#mainAns input');
    inputs.forEach(inp => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (!state.done) submit(); else nextQ(); }
    }));
    if (inputs[0] && window.innerWidth > 600) inputs[0].focus();
  }
  if (state.sim) { simRestore(); updateSimClock(); }
}

function showFb(kind, html) {
  const fb = $('fb');
  if (state && state.mode === 'practice' && ['bad', 'info', 'hint'].includes(kind)) html += learnLink(state.qs[state.i]);
  fb.className = `fb show ${kind}`;
  fb.innerHTML = html;
}

function lockMain() {
  app.querySelectorAll('#mainAns input').forEach(i => i.disabled = true);
  ['go', 'hintBtn'].forEach(id => { if ($(id)) $(id).classList.add('hidden'); });
}

function lockInputs() {
  lockMain();
  if ($('exBtn')) $('exBtn').classList.add('hidden');
  const nx = $('next');
  nx.classList.remove('hidden');
  nx.focus();
}

function showExample() {
  const q = state.qs[state.i];
  const box = $('example');
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  const ex = q.gen();
  box.innerHTML = `
    <div class="exhead">📖 דוגמה פתורה – שאלה דומה עם מספרים אחרים</div>
    <div class="qtext">${ex.text}</div>
    ${ex.fig || ''}
    ${ex.steps ? `<ol class="exsteps">${ex.steps.map(s => `<li>${s.p} <b class="m">${fmt(s.a)}</b></li>`).join('')}</ol>` : ''}
    <div><b>התשובה:</b> ${correctHTML(ex)}</div>
    <div class="muted">${ex.exp}</div>
    <div class="muted" style="margin-top:6px">עכשיו נסו לפתור את השאלה שלכם באותה דרך 💪</div>`;
  box.classList.remove('hidden');
}

const CHEERS = ['כל הכבוד! 🎉', 'מצוין! 🌟', 'נכון מאוד! 👏', 'יפה מאוד! 💪', 'בדיוק! ✅'];

function submit() {
  if (state.done || state.guide) return;
  const q = state.qs[state.i];
  const a = readAnswer(q);
  const r = check(q, a);

  if (state.sim) {
    if (state.i + 1 === state.count) return simSubmitAsk();
    return simGo(state.i + 1);
  }
  if (state.mode === 'test') {
    if (r.empty && !confirm('לא כתבתם תשובה. להמשיך בכל זאת?')) return;
    state.results.push({ q, a, ok: !!r.ok, outcome: r.ok ? 'first' : 'shown' });
    if (r.ok) state.score++;
    nextQ();
    return;
  }

  if (r.empty) { showFb('hint', 'כתבו תשובה ואז לחצו "בדיקה" 🙂'); return; }
  if (r.retry) { showFb('hint', `🤏 ${r.msg}`); return; }
  state.tries++;
  if (r.ok) {
    state.done = true;
    const outcome = state.tries === 1 ? 'first' : 'second';
    state.results.push({ q, a, ok: true, outcome });
    const up = adapt(outcome);
    if (q.type === 'choice') markChoices(q, state.selected);
    showFb('ok', `<div class="head">${outcome === 'first' ? pick(CHEERS) : 'נכון! הצלחתם בניסיון השני 👍'}</div>${up ? `<div class="levelup">${up}</div>` : ''}${r.note ? r.note + '<br>' : ''}<span class="muted">הסבר:</span> ${q.exp}`);
    lockInputs();
    return;
  }
  const trap = findTrap(q, a);
  if (state.tries === 1) {
    if (q.type === 'choice') {
      const btn = app.querySelector(`.choices button[data-c="${state.selected}"]`);
      btn.classList.add('wrong'); btn.disabled = true;
    }
    showFb('bad', trap
      ? `<div class="head">🤔 כמעט! ${trap.m}</div>נסו שוב 💪`
      : `<div class="head">לא בדיוק... נסו שוב 💪</div>💡 רמז: ${q.hint}`);
    return;
  }
  // ניסיון שני לא הצליח
  if (q.type === 'choice') markChoices(q, state.selected, !!q.steps);
  if (q.steps && q.steps.length) startGuided(trap);
  else {
    state.done = true;
    state.results.push({ q, a, ok: false, outcome: 'shown' });
    adapt('shown');
    showFb('info', `<div class="head">לא נורא – ככה לומדים! 💙</div>${trap ? `🤔 ${trap.m}<br>` : ''}התשובה הנכונה: <b>${correctHTML(q)}</b><br><span class="muted">הסבר:</span> ${q.exp}`);
    lockInputs();
  }
}

function markChoices(q, sel, hideRight) {
  app.querySelectorAll('.choices button').forEach(b => {
    const i = Number(b.dataset.c);
    b.disabled = true;
    if (i === q.ans && !hideRight) b.classList.add('right');
    else if (i === sel) b.classList.add('wrong');
  });
}

/* ---------- פתרון מודרך צעד אחר צעד ---------- */
function startGuided(trap) {
  const q = state.qs[state.i];
  state.guide = { k: 0, tries: 0, note: '', a: readAnswer(q) };
  lockMain();
  if ($('exBtn')) $('exBtn').classList.add('hidden');
  showFb('hint', `<div class="head">לא נורא! בואו נפתור את זה יחד, צעד אחר צעד 👣</div>${trap ? `🤔 ${trap.m}` : ''}`);
  renderStep();
}

function renderStep() {
  const q = state.qs[state.i], g = state.guide;
  const done = q.steps.slice(0, g.k).map((st, i) =>
    `<div class="step done">✔ <span class="sn">שלב ${i + 1}:</span> ${st.p} <b class="m">${fmt(st.a)}</b></div>`).join('');
  const cur = g.k < q.steps.length ? `
    <div class="step cur">
      ${g.note ? `<div class="snote">${g.note}</div>` : ''}
      <div><span class="sn">שלב ${g.k + 1} מתוך ${q.steps.length}:</span> ${q.steps[g.k].p}</div>
      <div class="answer-area">
        <input id="sans" class="ans" inputmode="decimal" autocomplete="off" aria-label="תשובה לשלב">
        <button id="sgo">בדיקה ✓</button>
        ${canSpeak ? '<button class="ghost speak" id="sspeak" aria-label="הקראת השלב">🔊</button>' : ''}
      </div>
      <div class="sfb" id="sfb" aria-live="polite"></div>
    </div>` : '';
  $('guide').innerHTML = `<div class="guide">${done}${cur}</div>`;
  if (!cur) return;
  const inp = $('sans');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkStep(); } });
  $('sgo').onclick = checkStep;
  if ($('sspeak')) $('sspeak').onclick = e => speak(q.steps[g.k].p, e.currentTarget);
  inp.focus();
}

function checkStep() {
  const q = state.qs[state.i], g = state.guide, st = q.steps[g.k];
  const v = parseNum($('sans').value);
  if (v == null || Number.isNaN(v)) { $('sfb').textContent = 'כתבו מספר 🙂'; return; }
  if (Math.abs(v - st.a) < 1e-9) {
    g.k++; g.tries = 0; g.note = '';
  } else {
    g.tries++;
    if (g.tries < 2) { $('sfb').innerHTML = 'לא בדיוק – נסו שוב את השלב הזה 💪'; $('sans').select(); return; }
    g.note = `💙 בשלב הקודם התשובה הייתה ${M(fmt(st.a))}. ממשיכים!`;
    g.k++; g.tries = 0;
  }
  if (g.k >= q.steps.length) finishGuided();
  else renderStep();
}

function finishGuided() {
  const q = state.qs[state.i];
  state.done = true;
  renderStep();
  state.results.push({ q, a: state.guide.a, ok: false, outcome: 'guided' });
  adapt('guided');
  if (q.type === 'choice') markChoices(q, state.selected);
  showFb('ok', `<div class="head">🎉 כל הכבוד! פתרתם את השאלה צעד אחר צעד.</div>התשובה: <b>${correctHTML(q)}</b><br><span class="muted">הסבר:</span> ${q.exp}`);
  lockInputs();
}

/* ---------- התאמת רמה ושליטה ---------- */
function adapt(outcome) {
  const s = state, q = s.qs[s.i], ts = tstat(q.topic);
  const gain = { first: 3 + 2 * (q.lv || 1), second: 2, guided: 1, shown: -1 }[outcome];
  ts.mastery = Math.max(0, Math.min(100, ts.mastery + gain));
  store.solved = (store.solved || 0) + 1;
  let msg = '';
  if (outcome === 'first') { s.run++; s.streak++; } else { s.run = 0; s.streak = 0; }
  if (!s.fixed) {
    if (outcome === 'first' && s.run >= 2 && s.level < 3) {
      s.level++; s.run = 0;
      msg = `🚀 מעולה! עולים ל${LEVEL_NAME[s.level]} – שאלות קצת יותר מאתגרות.`;
    }
    if ((outcome === 'guided' || outcome === 'shown') && s.level > 1) s.level--;
    if (s.topicId !== 'mix' && TOPIC[s.topicId]) ts.level = s.level;
  }
  saveStore(store);
  return msg;
}

function nextQ() {
  state.i++;
  if (state.i >= state.count) summary();
  else { renderQ(); window.scrollTo(0, 0); }
}

/* ---------- סיכום ---------- */
function summary() {
  const s = state, n = s.results.length;
  const name = store.name || '';
  const date = new Date().toLocaleDateString('he-IL');
  const label = titleText().replace(/^\S+\s/, '');
  const cnt = o => s.results.filter(r => r.outcome === o).length;
  const first = cnt('first'), second = cnt('second'), guided = cnt('guided'), shown = cnt('shown');
  const correct = first + second;
  const ratio = n ? correct / n : 0;
  const stars = 1 + (ratio >= 0.5 ? 1 : 0) + (ratio >= 0.8 ? 1 : 0);
  const single = s.mode === 'practice' && TOPIC[s.topicId] && !s.retry;
  let compare = '';
  if (single) {
    const ts = tstat(s.topicId), prev = ts.last;
    if (prev) {
      if (correct > prev.correct) compare = `📈 <b>השתפרת!</b> בפעם הקודמת: ${prev.correct} תשובות נכונות, והיום: ${correct}.`;
      else if (correct === prev.correct) compare = `👍 שמרת על אותה תוצאה כמו בפעם הקודמת (${correct} נכונות).`;
      else compare = `בפעם הקודמת היו ${prev.correct} תשובות נכונות. לא נורא – בכל תרגול לומדים משהו חדש 💪`;
    }
    ts.last = { correct, n };
  }
  if (s.mode === 'test') store.tests = (store.tests || []).concat({ date, score: correct, total: n }).slice(-10);
  saveStore(store);

  const msg = ratio >= 0.8 ? 'מעולה! 🏆' : ratio >= 0.5 ? 'עבודה טובה! 💪' : 'כל הכבוד על ההתמדה! 🌱';
  const sub = ratio >= 0.5 ? '' : '<div class="muted">כל שאלה שפתרת – גם בעזרה – מקדמת אותך. התרגול הבא יהיה קל יותר!</div>';

  // שינוי בשליטה לפי נושא
  const touched = [...new Set(s.results.map(r => r.q.topic))];
  const growth = s.mode === 'practice' ? touched.map(id => {
    const before = s.m0[id] || 0, after = (store.topics[id] || {}).mastery || 0;
    return `<div class="grow"><span>${TOPIC[id].icon} ${TOPIC[id].name}</span>
      <span class="mbar"><span style="width:${after}%"></span></span>
      <span class="small">${after > before ? `+${after - before} ⬆` : masteryLabel(after)}</span></div>`;
  }).join('') : '';

  const byTopic = {};
  s.results.forEach(r => {
    const b = byTopic[r.q.topic] = byTopic[r.q.topic] || { ok: 0, n: 0 };
    b.n++; if (r.ok) b.ok++;
  });
  const weak = Object.entries(byTopic).filter(([, b]) => b.ok / b.n < 0.7).map(([id]) => TOPIC[id].name);
  const breakdown = s.mode === 'test' ? `
    <table class="breakdown"><tr><th>נושא</th><th>נכון</th></tr>
    ${Object.entries(byTopic).map(([id, b]) => `<tr><td>${TOPIC[id].icon} ${TOPIC[id].name}</td><td>${b.ok} / ${b.n}</td></tr>`).join('')}
    </table>
    ${weak.length ? `<p>כדאי לתרגל עוד: <b>${weak.join(', ')}</b></p>` : ''}` : '';

  const missed = s.results.filter(r => r.outcome !== 'first').map(r => ({ topic: r.q.topic, gen: r.q.gen, lv: r.q.lv })).filter(r => r.gen);

  const review = s.mode === 'test' ? `
    <div class="card">
      <h2>הפתרונות</h2>
      <ul class="review">
        ${s.results.map((r, i) => `<li>
          <span class="mark ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✔' : '✘'} שאלה ${i + 1}</span>
          <span class="small">(${TOPIC[r.q.topic].name})</span><br>
          ${r.q.text}
          ${r.q.fig || ''}
          <div>התשובה שלי: ${answerHTML(r.q, r.a)}${r.ok ? '' : ` · <b>התשובה הנכונה: ${correctHTML(r.q)}</b>`}</div>
          ${r.ok ? '' : `<div class="small">הסבר: ${r.q.exp}</div>`}
        </li>`).join('')}
      </ul>
    </div>` : '';

  const resultText = `${name ? name + ' | ' : ''}${label} | נכון: ${correct} מתוך ${n}${s.mode === 'practice' ? ` (${first} בניסיון ראשון, ${guided} בעזרת פתרון מודרך)` : ''} | ${date}`;

  app.innerHTML = `
    <div class="card center">
      <h2>${label} – סיכום</h2>
      ${name ? `<div class="muted">${esc(name)} · ${date}</div>` : ''}
      <div class="stars">${'⭐'.repeat(stars)}</div>
      <div class="score-big">${msg}</div>
      ${sub}
      <ul class="stats">
        <li>✅ נכון בניסיון ראשון: <b>${first}</b></li>
        ${s.mode === 'practice' ? `<li>👍 נכון בניסיון שני: <b>${second}</b></li>
        <li>👣 נפתרו צעד אחר צעד: <b>${guided}</b></li>
        <li>📖 למדנו מהתשובה: <b>${shown}</b></li>` : `<li>✘ לא נכון: <b>${n - correct}</b></li>`}
      </ul>

  $('again').onclick = () => {
    if (s.sim) return startSim(s.sim.mins);

    if (s.list) return startTest(true);

    }

function wsQuestionHTML(q, n) {
  let ans;
  if (q.type === 'num') ans = `<div class="wsans">תשובה: <span class="wsline"></span>${q.unit ? ' ' + q.unit : ''}</div>`;
  else if (q.type === 'frac') ans = `<div class="wsans">תשובה: <span class="wsfrac">${q.noWhole ? '' : '<span class="wsbox big"></span>'}<span class="wsstack"><span class="wsbox"></span><span class="wsbar"></span><span class="wsbox"></span></span></span></div>`;
  else ans = `<div class="wschoices">${q.choices.map(c => `<div><span class="wscheck">☐</span> ${c}</div>`).join('')}</div>`;
  const wordy = q.steps && q.steps.length >= 3 && q.text.replace(/<[^>]+>/g, '').length > 70;
  const grid = `<div class="ex-grid${wordy ? ' big' : q.type === 'choice' ? ' sm' : ''}"></div>`;
  return `<div class="wsq"><div class="qmain"><div class="wsqhead"><span class="wsnum">${n}</span><div class="qtext">${q.text}</div></div>${q.fig || ''}${ans}</div>${grid}</div>`;
}

function examQuestionHTML(q, n) {
  let ans;
  if (q.type === 'choice') ans = `<div class="ex-choices">${q.choices.map((c, i) => `<div><span class="ex-idx">${i + 1}</span><span class="ex-check"></span> ${c}</div>`).join('')}</div>`;
  else if (q.type === 'frac') ans = `<div class="wsans">תשובה: <span class="wsfrac">${q.noWhole ? '' : '<span class="wsbox big"></span>'}<span class="wsstack"><span class="wsbox"></span><span class="wsbar"></span><span class="wsbox"></span></span></span></div>`;
  else ans = `<div class="wsans">תשובה: <span class="wsline"></span>${q.unit ? ' ' + q.unit : ''}</div>`;
  const plain = q.text.replace(/<[^>]+>/g, '');
  const wordy = q.steps && q.steps.length >= 3 && plain.length > 60;
  const work = wordy ? '<div class="ex-work">הציגו את דרך הפתרון.</div>' : '';
  const grid = `<div class="ex-grid${wordy ? ' big' : q.type === 'choice' ? ' sm' : ''}"></div>`;
  return `<div class="ex-q"><div class="qmain"><div class="wsqhead"><span class="ex-num">${n}</span><div class="qtext">${q.text}</div></div>${q.fig || ''}${work}${ans}</div>${grid}</div>`;
}

function buildWorksheet(topics, level, count) {
  const qs = [], prev = {};
  for (let i = 0; i < count; i++) {
    const t = topics[i % topics.length];
    const lv = level === 'mix' ? Math.min(3, 1 + Math.floor(3 * i / count)) : Number(level);
    const pool = TOPIC[t].levels[lv];
    let g = pick(pool), guard = 0;
    while (pool.length > 1 && g === prev[t] && guard++ < 10) g = pick(pool);
    prev[t] = g;
    qs.push(mk(t, g, lv));
  }
  return qs;
}

// כמה עמודי A4 ייקח דף (שאלה לא נחתכת בין עמודים)
function sheetPages(sec, H_MM) {
  const H = (H_MM || 273) * 96 / 25.4; // גובה העמוד בלי השוליים
  const blocks = [];
  for (const el of sec.children) {
    if (el.classList.contains('wsqs')) blocks.push(...el.children); else blocks.push(el);
  }
  let pages = 1, used = 0;
  for (const b of blocks) {
    const cs = getComputedStyle(b);
    const h = b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
    if (used + h > H && used > 0) { pages++; used = 0; }
    used += h;
  }
  return pages;
}
// חלוקה לעמודים מראש, כדי שהשם יופיע בראש כל עמוד מודפס (בכל דפדפן)
const CREDIT = '© איריס סגל';
function paginateSheets() {
  const out = $('wsout');
  const H = 270 * 96 / 25.4;
  out.classList.add('measure');
  out.querySelectorAll('.ws-page').forEach(sec => {
    const items = [];
    [...sec.children].forEach(ch => {
      if (ch.matches('.wsqs, .ex-qs, ol')) [...ch.children].forEach(el => items.push({ el, wrap: ch }));
      else items.push({ el: ch, wrap: null });
    });
    sec.innerHTML = '';
    let page;
    const newPage = () => {
      page = document.createElement('div');
      page.className = 'ws-pg';
      page.innerHTML = `<div class="wscredit">${CREDIT}</div>`;
      sec.appendChild(page);
    };
    const place = it => {
      let box = page;
      if (it.wrap) {
        box = page.lastElementChild;
        if (!box || box.__src !== it.wrap) {
          box = it.wrap.cloneNode(false); box.__src = it.wrap;
          if (box.tagName === 'OL') box.start = [...it.wrap.children].indexOf(it.el) + 1;
          page.appendChild(box);
        }
      }
      box.appendChild(it.el);
      return box;
    };
    newPage();
    let n = 0;
    for (const it of items) {
      const box = place(it);
      n++;
      if (n > 1 && page.getBoundingClientRect().height > H) {
        it.el.remove();
        if (box !== page && !box.children.length) box.remove();
        newPage(); n = 1;
        place(it);
      }
    }
  });
  out.classList.remove('measure');
}

// אם התזכורת גורמת לדף לגלוש לעמוד נוסף – מוותרים עליה
function dropTipsIfOverflow() {
  const out = $('wsout');
  out.classList.add('measure');
  out.querySelectorAll('.ws-page:not(.wskey)').forEach(sec => {
    const tips = sec.querySelector('.wstips');
    if (!tips) return;
    // בודקים גם ב-A4 וגם בדף קצר יותר (Letter), כדי שלא תגלוש שאלה לעמוד נוסף
    const withTips = [273, 255].map(h => sheetPages(sec, h));
    tips.style.display = 'none';
    const without = [273, 255].map(h => sheetPages(sec, h));
    if (without.some((n, i) => n < withTips[i])) tips.remove(); else tips.style.display = '';
  });
  out.classList.remove('measure');
}


/* ---------- כניסת מורה (קוד) ---------- */
// הקוד לא נשמר כאן – רק "טביעת אצבע" שלו. זו לא אבטחה אמיתית, אלא מניעת כניסה מקרית.
const TEACHER_HASH = '3d9bf467';
function codeHash(s) {
  let x = 0x811c9dc5;
  for (const ch of s) { x ^= ch.charCodeAt(0); x = Math.imul(x, 0x01000193) >>> 0; }
  return x.toString(16);
}
function teacherGate() {
  let shared = null;
  try { shared = localStorage.getItem('math-teacher-key'); } catch (e) { /* לא חובה */ }
  if (store.teacherKey === TEACHER_HASH || shared === TEACHER_HASH) return teacher();
  app.innerHTML = `
    <h1>🔒 כניסת מורה</h1>
    <div class="card center">
      <p>האזור הזה מיועד למורה בלבד.</p>
      <div class="name-row">
        <input id="tcode" class="ans" type="password" inputmode="numeric" autocomplete="off" placeholder="קוד מורה" aria-label="קוד מורה">
        <button id="tgo">כניסה</button>
      </div>
      <p class="muted" id="tcmsg" style="min-height:1.4em"></p>
    </div>
    <p class="center"><a href="${location.pathname}${gq()}">← לאפליקציה</a></p>`;
  const tryCode = () => {
    if (codeHash('math6:' + $('tcode').value.trim()) === TEACHER_HASH) {
      store.teacherKey = TEACHER_HASH; saveStore(store);
      try { localStorage.setItem('math-teacher-key', TEACHER_HASH); } catch (e) { /* לא חובה */ }
      teacher();
    } else { $('tcmsg').textContent = 'הקוד לא נכון. נסו שוב.'; $('tcode').select(); }
  };
  $('tgo').onclick = tryCode;
  $('tcode').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });
  $('tcode').focus();
}

// חשיפה לבדיקות אוטומטיות
window.__math6 = { TOPICS, LESSONS, check, correctHTML, findTrap, speechText };

if (URLP.has('print')) printBuilder(); else if (URLP.has('teacher')) teacherGate(); else home();
