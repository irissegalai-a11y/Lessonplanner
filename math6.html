// כרטיסיות לפי כיתה
function cardsOf(id) {
  return LESSONS[id].cards.filter(c => !c.grades || c.grades.includes(GRADE));
}
const lessonTopic = L => typeof L.topic === 'object' ? L.topic[GRADE] : L.topic;
const lessonPractice = L => Array.isArray(L.practice) ? L.practice : (L.practice[GRADE] || []);
const LESSON_SOON = [];

function learnedSet(id) {
  store.learned = store.learned || {};
  return new Set(store.learned[id] || []);
}
function markLearned(id, k) {
  const s = learnedSet(id);
  if (s.has(k)) return;
  s.add(k);
  store.learned[id] = [...s];
  saveStore(store);
}

let lessonView = null;

function startLesson(id, k = 0) {
  if (!k) track('למידה', (LESSONS[id] && (LESSONS[id].title || LESSONS[id].name)) || id);
  navPush('view');
  state = null;
  stopSpeak();
  lessonView = { id, k, modal: false, box: app };
  renderLesson();
}

function openLessonModal(id, k) {
  k = Math.max(0, cardsOf(id).indexOf(LESSONS[id].cards[k]));
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="mtop"><button class="ghost" data-close>✖ חזרה לשאלה</button></div><div class="lessonbox"></div></div>';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); lessonView = null; stopSpeak(); };
  ov.querySelector('[data-close]').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  lessonView = { id, k, modal: true, box: ov.querySelector('.lessonbox'), close };
  renderLesson();
}

function renderLesson() {
  const lv = lessonView, L = LESSONS[lv.id], CARDS = cardsOf(lv.id), c = CARDS[lv.k], N = CARDS.length;
  const learned = learnedSet(lv.id);
  if (!c.try) markLearned(lv.id, lv.k);
  const last = lv.k === N - 1;
  lv.tries = 0; lv.done = false;
  const tr = c.try;
  lv.box.innerHTML = `
    ${lv.modal ? '' : `<div class="topbar">
      <span class="title">${L.name}</span>
      <span>כרטיסייה ${lv.k + 1} מתוך ${N}</span>
      <span><button class="ghost" data-font>א+</button><button class="ghost navhome" data-home>${ic('home')} לדף הבית</button></span>
    </div>`}
    <div class="dots">${CARDS.map((_, i) => `<button class="dot${i === lv.k ? ' cur' : ''}${learned.has(i) ? ' ok' : ''}" data-go="${i}" aria-label="כרטיסייה ${i + 1}">${learned.has(i) ? '✔' : i + 1}</button>`).join('')}</div>
    <div class="card lcard" style="border-top:6px solid ${L.color}">
      <div class="qhead">
        <h2 class="ltitle">${c.title}</h2>
        ${canSpeak ? `<button class="ghost speak" data-speak aria-label="הקראה">${ic('speaker')}</button>` : ''}
      </div>
      <div class="lbody">${c.html}</div>
      ${tr ? `<div class="ltry">
        <div class="ltryhead">✋ נסו בעצמכם</div>
        <div class="qtext">${tr.q}</div>
        <div class="answer-area">
          ${tr.type === 'choice'
            ? `<div class="choices">${tr.choices.map((x, i) => `<button data-c="${i}">${x}</button>`).join('')}</div>`
            : `<span class="lbl">תשובה:</span><input class="ans" data-ans inputmode="decimal" autocomplete="off" aria-label="תשובה"><button data-check>בדיקה ✓</button>`}
        </div>
        <div class="fb" data-fb aria-live="polite"></div>
      </div>` : ''}
    </div>
    <div class="lnav">
      ${lv.k > 0 ? '<button class="secondary" data-prev>→ הקודם</button>' : '<span></span>'}
      ${last
        ? (lv.modal ? '<button data-closeend>✔ חזרה לשאלה</button>' : `<span class="lend"><button data-practice>✏️ בואו נתרגל ${L.name}!</button><button class="secondary" data-home2>🏠 לתפריט</button></span>`)
        : '<button data-next>הבא ←</button>'}
    </div>`;
  const q = s => lv.box.querySelector(s);
  if (c.setup) c.setup(lv.box.querySelector('.lbody'));
  lv.box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { lv.k = Number(b.dataset.go); renderLesson(); });
  if (q('[data-prev]')) q('[data-prev]').onclick = () => { lv.k--; renderLesson(); scrollTop(); };
  if (q('[data-next]')) q('[data-next]').onclick = () => { if (!c.try) markLearned(lv.id, lv.k); lv.k++; renderLesson(); scrollTop(); };
  if (q('[data-home]')) q('[data-home]').onclick = home;
  if (q('[data-home2]')) q('[data-home2]').onclick = home;
  if (q('[data-font]')) q('[data-font]').onclick = cycleFont;
  if (q('[data-closeend]')) q('[data-closeend]').onclick = lv.close;
  if (q('[data-practice]')) q('[data-practice]').onclick = () => startLessonPractice(lv.id);
  if (q('[data-speak]')) q('[data-speak]').onclick = e => {
    const sbtn = e.currentTarget;
    const body = q('.lbody').cloneNode(true);
    body.querySelectorAll('.chartwrap, .lbtns, .live, .reveal.hidden').forEach(x => x.remove());
    speak(c.title + '. ' + body.innerHTML + (tr ? '. נסו בעצמכם: ' + tr.q : ''), sbtn);
  };
  if (tr) {
    if (tr.type === 'choice') lv.box.querySelectorAll('.ltry .choices button').forEach(b => b.onclick = () => lessonCheck(Number(b.dataset.c)));
    else {
      q('[data-check]').onclick = () => lessonCheck(parseNum(q('[data-ans]').value), q('[data-ans]').value);
      q('[data-ans]').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lessonCheck(parseNum(q('[data-ans]').value)); } });
    }
  }
}

function scrollTop() {
  if (lessonView && lessonView.modal) lessonView.box.parentElement.scrollTop = 0;
  else window.scrollTo(0, 0);
}

function lessonCheck(v, raw) {
  const lv = lessonView, c = cardsOf(lv.id)[lv.k], tr = c.try;
  if (lv.done) return;
  const fb = lv.box.querySelector('[data-fb]');
  const tip = raw != null ? numWritingTip(raw, v) : '';
  const show = (kind, html) => { fb.className = `fb show ${kind}`; fb.innerHTML = html + (kind === 'hint' ? '' : tip); };
  if (v == null || (typeof v === 'number' && Number.isNaN(v))) { show('hint', 'כתבו מספר ואז לחצו "בדיקה" 🙂'); return; }
  const ok = tr.type === 'choice' ? v === tr.ans : Math.abs(v - tr.ans) < 1e-9;
  const btn = tr.type === 'choice' ? lv.box.querySelector(`.ltry .choices button[data-c="${v}"]`) : null;
  if (ok) {
    lv.done = true;
    if (btn) btn.classList.add('right');
    markLearned(lv.id, lv.k);
    lv.box.querySelectorAll('.dot')[lv.k].classList.add('ok');
    show('ok', `<div class="head">${pick(CHEERS)}</div>${tr.exp}`);
    return;
  }
  lv.tries++;
  const trap = (tr.traps || []).find(t => tr.type === 'choice' ? t.c === tr.choices[v] : Math.abs(t.v - v) < 1e-9);
  if (btn) { btn.classList.add('wrong'); btn.disabled = true; }
  if (lv.tries < 2) {
    show('bad', trap ? `<div class="head">🤔 כמעט! ${trap.m}</div>נסו שוב 💪` : `<div class="head">לא בדיוק... נסו שוב 💪</div>💡 ${tr.hint}`);
    return;
  }
  lv.done = true;
  markLearned(lv.id, lv.k);
  show('info', `<div class="head">לא נורא – ככה לומדים! 💙</div>${trap ? `🤔 ${trap.m}<br>` : ''}התשובה: <b>${tr.type === 'choice' ? tr.choices[tr.ans] : M(fmt(tr.ans))}</b><br>${tr.exp}`);
}

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function speechText(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('.fr').forEach(f => f.replaceWith(` ${f.children[0].textContent} חלקי ${f.children[1].textContent} `));

  div.querySelectorAll('br').forEach(b => b.replaceWith('. '));

  const words = [['סמ"ר', 'סנטימטר רבוע'], ['מ"ר', 'מטר רבוע'], ['ס"מ', 'סנטימטר'], ['ק"מ', 'קילומטר'], ['ק"ג', 'קילוגרם'],
    ["גר'", 'גרם'], ['מ"ל', 'מיליליטר'], ["מ'", 'מטר'], ['₪', 'שקלים'], ['×', ' כפול '], [' : ', ' לחלק ל '], [' - ', ' פחות '], ['+', ' ועוד '], ['=', ' שווה '], ['≈', ' בערך ']];
  words.forEach(([a, b]) => { t = t.split(a).join(b); });

}
// קול בעברית: הקולות נטענים באיחור בחלק מהדפדפנים, לכן מחפשים שוב בכל הקראה

function speechChunks(text) {

      const at = cut > 40 ? cut : 160;

function speak(html, btn) {

function parseNum(s) {
  s = (s || '').trim().replace(/\s/g, '').replace(/[−–]/g, '-');
  if (!s) return null;
  // מפרידי אלפים לא משנים: 4,000 / 4'000 / 4׳000 / 4 000 – כולם 4000
  s = s.replace(/(\d)['׳’`´"״](?=\d)/g, '$1');
  // פסיק יחיד שאחריו לא 3 ספרות (למשל 2,5) – נקודה עשרונית; כל פסיק אחר – מפריד אלפים
  if (/^-?\d+,\d+$/.test(s) && !/,\d{3}$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/(\d),(?=\d)/g, '$1');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
const parseInt0 = s => { s = (s || '').trim(); if (!s) return null; return /^\d+$/.test(s) ? parseInt(s, 10) : NaN; };

function readAnswer(q) {
  if (q.type === 'num') {
    const raw = document.getElementById('ans').value;
    return { raw, val: parseNum(raw) };
  }
  if (q.type === 'frac') {
    const w = q.noWhole ? null : parseInt0(document.getElementById('fw').value);
    const n = parseInt0(document.getElementById('fn').value);
    const d = parseInt0(document.getElementById('fd').value);
    return { val: { w, n, d } };
  }
  return { val: state.selected };
}

function answerHTML(q, a) {
  if (q.type === 'num') return a.raw && a.raw.trim() ? M(esc(a.raw.trim())) : '—';
  if (q.type === 'choice') return a.val == null ? '—' : q.choices[a.val];
  const { w, n, d } = a.val;
  if (w == null && n == null && d == null) return '—';
  if (n == null && d == null) return M(w);
  return M(`${w ? w : ''}${F(n == null ? '?' : n, d == null ? '?' : d)}`);
}

function correctHTML(q) {
  if (q.type === 'num') return M(fmt(q.ans)) + (q.unit ? ' ' + q.unit : '');
  if (q.type === 'choice') return q.choices[q.ans];
  const { n, d } = q.ans;
  if (q.form === 'improper') { const g = gcd(n, d); return M(F(n / g, d / g)); }
  return FX(n, d, true);
}

// ערך השבר שהוקלד: N/D, או שגיאה
function fracValue(v) {
  let { w, n, d } = v;
  if (w == null && n == null && d == null) return { empty: true };
  if ([w, n, d].some(x => Number.isNaN(x))) return { err: 'כתבו מספרים שלמים בתיבות.' };
  w = w || 0;
  if (n == null && d == null) return { N: w, D: 1, w, n, d };
  if (n == null || d == null) return { err: 'חסר מונה או מכנה.' };
  if (d === 0) return { err: 'המכנה לא יכול להיות 0.' };
  return { N: w * d + n, D: d, w, n, d };
}

function findTrap(q, a) {
  if (!q.traps || !q.traps.length) return null;
  if (q.type === 'num') {
    const v = a.val;
    if (v == null || Number.isNaN(v)) return null;
    return q.traps.find(t => t.v != null && Math.abs(t.v - v) < 1e-9 && Math.abs(t.v - q.ans) > 1e-9) || null;
  }
  if (q.type === 'choice') {
    const c = q.choices[a.val];
    return q.traps.find(t => t.c === c) || null;
  }
  const fv = fracValue(a.val);
  if (fv.N == null) return null;
  return q.traps.find(t => t.f && fv.N * t.f.d === t.f.n * fv.D && t.f.n * q.ans.d !== q.ans.n * t.f.d) || null;
}

// התלמיד כתב מספר עם מפריד לא נכון (גרש, רווח, פסיק במקום הלא נכון, פסיק עשרוני) – מקבלים, אבל מסבירים איך כותבים
function numWritingTip(raw, v) {
  raw = String(raw || '').trim();
  if (v == null || isNaN(v) || !/\d/.test(raw)) return '';
  const r = raw.replace(/[−–]/g, '-');
  const neg = v < 0, abs = Math.abs(v), whole = Math.trunc(abs);
  if (/\d['׳’`´"״\s]+\d/.test(r) || (/,/.test(r) && /^-?\d+,\d{3}/.test(r) && !/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(r))) {
    return `<div class="numtip">✏️ <b>איך כותבים נכון:</b> בין האלפים שמים <b>פסיק</b> ( , ) – לא גרש ולא רווח. סופרים 3 ספרות מימין ושמים פסיק: <span class="m">${fmt(v)}</span>${whole >= 1000 ? `. אפשר גם בלי פסיק: <span class="m" data-raw>${neg ? '-' : ''}${String(abs)}</span>` : ''}</div>`;
  }
  if (/^-?\d+,\d+$/.test(r) && !/,\d{3}$/.test(r)) {
    return `<div class="numtip">✏️ <b>איך כותבים נכון:</b> במספר עשרוני כותבים <b>נקודה</b>, לא פסיק: <span class="m">${fmt(v)}</span></div>`;
  }
  return '';
}

function check(q, a) {
  const v = a.val;
  if (q.type === 'num') {
    if (v == null) return { empty: true };
    const tip = numWritingTip(a.raw, v);
    if (tip && !isNaN(v)) return { ok: Math.abs(v - q.ans) < 1e-9, note: tip, tip };
    if (isNaN(v)) return { ok: false, retry: true, msg: /[A-Za-zא-ת]/.test(a.raw || '') ? 'כתבו את התשובה <b>במספר</b>, לא במילים. למשל: 1000 ולא "אלף".' : 'כתבו מספר בלבד (אפשר עם נקודה עשרונית).' };
    return { ok: Math.abs(v - q.ans) < 1e-9 };
  }
  if (q.type === 'choice') {
    if (v == null) return { empty: true };
    return { ok: v === q.ans };
  }
  const fv = fracValue(v);
  if (fv.empty) return { empty: true };
  if (fv.err) return { ok: false, retry: true, msg: fv.err };
  const { N, D, w, n, d } = fv;
  if (N * q.ans.d !== q.ans.n * D) return { ok: false };
  const isFrac = n != null;
  const simplest = !isFrac || gcd(n, d) === 1;
  const properPart = !isFrac || n < d;
  if (q.form === 'simplest') {
    if (!simplest) return { ok: false, retry: true, msg: 'השבר שווה בערכו – אבל אפשר לצמצם אותו עוד!' };
    return { ok: true };
  }
  if (q.form === 'mixed') {
    if (!properPart || (isFrac && w === 0 && N > D)) return { ok: false, retry: true, msg: 'הערך נכון, אבל ביקשו לכתוב כשבר מעורב (שלם + שבר קטן מ-1).' };
    return { ok: true, note: simplest ? '' : 'אפשר גם לצמצם את השבר.' };
  }
  if (q.form === 'improper') {
    if (w) return { ok: false, retry: true, msg: 'ביקשו שבר מדומה – בלי חלק שלם.' };
    return { ok: true };
  }
  if (!simplest || !properPart) return { ok: true, note: `נכון! אפשר לכתוב את התשובה גם כך: ${correctHTML(q)}` };
  return { ok: true };
}

const app = document.getElementById('app');

/* ---------- כיוון תרגילים: תרגיל במאוזן נכתב משמאל לימין (סימן השווה מימין למחוברים) ----------
   כשתרגיל בנוי מכמה חלקים (M(...) = M(...)), הדפדפן מסדר אותם מימין לשמאל.
   כאן מאחדים רצף של חלקי חשבון צמודים לתיבה אחת משמאל לימין. */
const MATH_EL = el => el.nodeType === 1 && /(^|\s)(m|fr|box)(\s|$)/.test(el.className || '');
const JOIN_RE = /^(?:\s|[=+\-×:·?()]|\d+(?:[.,]\d+)*)*$/;
const OP_RE = /[=+\-×:·]/;
const PLAIN_EQ = /\(?\d+(?:[.,]\d+)*\)?(?:(?:\s*[=+\-−×·→]|\s+:)\s*(?:\(?\s*\d+(?:[.,]\d+)*\s*\)?|\?))+(?:\s*=)?/;
function fixMathRuns(root) {
  if (!root || root.nodeType !== 1 || root.closest('svg, .m')) return;
  const parents = [root, ...root.querySelectorAll('*')].filter(el => !el.closest('svg, .m') && el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE');
  for (const par of parents) {
    // תרגיל שנכתב כטקסט רגיל (למשל "12 : 4 = 3") – עוטפים בתיבה משמאל לימין
    for (const t of [...par.childNodes]) {
      if (t.nodeType !== 3) continue;
      const re = new RegExp(PLAIN_EQ.source, 'g');
      if (!re.test(t.textContent)) continue;

      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(t.textContent))) {
        frag.appendChild(document.createTextNode(t.textContent.slice(last, m.index)));
        const sp = document.createElement('span'); sp.className = 'm'; sp.textContent = m[0];
        frag.appendChild(sp); last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(t.textContent.slice(last)));
      par.replaceChild(frag, t);
    }
    let kids = [...par.childNodes];
    for (let i = 0; i < kids.length; i++) {
      if (!MATH_EL(kids[i])) continue;
      // קידומת: סוף טקסט לפני האיבר (למשל "3 + ")
      const run = [kids[i]];
      let j = i + 1;
      while (j < kids.length) {
        const k = kids[j];
        if (MATH_EL(k)) { run.push(k); j++; continue; }
        if (k.nodeType === 3) {
          if (JOIN_RE.test(k.textContent)) { run.push(k); j++; continue; }
          const m = k.textContent.match(/^(?:\s|[=+\-×:·?()]|\d+(?:[.,]\d+)*)*[=+\-×:·?]/);
          if (m && OP_RE.test(m[0])) { k.splitText(m[0].length); run.push(k); }
        }
        break;
      }
      // מורידים מסוף הרצף טקסט שאינו חלק מהתרגיל (רווחים, נקודתיים של משפט)
      while (run.length > 1 && run[run.length - 1].nodeType === 3 && !/[=\d?]/.test(run[run.length - 1].textContent)) run.pop();
      const prev = kids[i].previousSibling;
      if (prev && prev.nodeType === 3) {
        const m = prev.textContent.match(/(?:^|\s)((?:\d+(?:[.,]\d+)*\s*)?[=+\-×:·(]\s*)$/);
        if (m && OP_RE.test(m[1]) && /\d/.test(m[1])) { const tail = prev.splitText(prev.textContent.length - m[1].length); run.unshift(tail); }
      }
      const hasOp = run.some(n => n.nodeType === 3 && OP_RE.test(n.textContent));

function track(action, detail = '') {
  if (!TRACK.form || URLP.has('teacher') || URLP.has('print')) return;
  const key = action + '|' + detail;
  if (key === trackLast) return;
  trackLast = key;
  try {
    const nm = (typeof store !== 'undefined' && store.name) || '';
    const body = new URLSearchParams({ [TRACK.f.device]: trackDevice(), [TRACK.f.grade]: String(GRADE), [TRACK.f.name]: nm, [TRACK.f.action]: action, [TRACK.f.detail]: String(detail).slice(0, 200) });
    fetch(TRACK.form, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
  } catch (e) { /* לא חובה */ }
}

function navPush(v) {

function todaySuggestion() {
  if (GRADE >= 3 && kf.placed && kf.lastDay !== kfToday()) return { t: 'אימון כפל – 5 דקות', d: 'עובדות חדשות, וחזרה על מה שעוד קשה', btn: 'לאימון', go: kfHome };
  const started = TOPICS.filter(t => store.topics[t.id]);
  const learned = LESSON_ORDER.some(id => learnedSet(id).size);
  if (!started.length && !learned) {
    const L = LESSONS[LESSON_ORDER[0]];
    return { t: `מתחילים: ${L.name}`, d: 'כמה כרטיסיות הסבר קצרות, ואחר כך תרגול', btn: 'להתחיל', go: () => startLesson(L.id) };
  }
  const weak = started.map(t => ({ t, m: store.topics[t.id].mastery || 0 })).filter(x => x.m < 80).sort((a, b) => a.m - b.m)[0];
  if (weak) return { t: `ממשיכים: ${weak.t.name}`, d: `${masteryLabel(weak.m)} · ${LEVEL_NAME[store.topics[weak.t.id].level || 1]}`, btn: 'להמשיך', go: () => showLevelPicker(weak.t.id) };
  const next = TOPICS.find(t => !store.topics[t.id]);
  if (next) return { t: `נושא חדש: ${next.name}`, d: next.desc, btn: 'להתחיל', go: () => showLevelPicker(next.id) };
  return { t: 'תרגול מעורב', d: 'שאלות מכל הנושאים', btn: 'להתחיל', go: () => showLevelPicker('mix') };
}


/* ---------- בחירת רמה ---------- */
const LEVEL_DESC6 = {

};
const LEVEL_DESC = GRADE === 1 ? LEVEL_DESC1 : GRADE === 2 ? LEVEL_DESC2 : GRADE === 3 ? LEVEL_DESC3 : GRADE === 4 ? LEVEL_DESC4 : GRADE === 5 ? LEVEL_DESC5 : LEVEL_DESC6;
const LEVEL_TAG = { 1: 'בסיסית', 2: 'בינונית', 3: 'מאתגרת' };

function currentLevel(topicId) {
  if (topicId === 'mix') {
    const lv = TOPICS.map(t => (store.topics[t.id] || {}).level || 1);
    return Math.max(1, Math.min(3, Math.round(lv.reduce((a, b) => a + b, 0) / lv.length)));
  }
  return (store.topics[topicId] || {}).level || 1;
}

function showLevelPicker(topicId) {

      ${[1, 2, 3].map(n => `<button class="lvlchoice${n === cur ? ' cur' : ''}" data-pick="${n}">

        <span class="lname">${LEVEL_NAME[n]} – ${LEVEL_TAG[n]}</span>
        <span class="ldesc">${LEVEL_DESC[topicId][n - 1]}</span>
        ${n === cur ? `<span class="ltag">${known ? '📍 הרמה שלך' : '👍 מומלץ להתחלה'}</span>` : ''}
      </button>`).join('')}

    <p class="muted center small">בלי הסימון – האפליקציה תעלה אתכם רמה כשתצליחו, ותוריד כשיהיה קשה.</p>
  </div>`;

}

function bindLevelBadge() {
  const btn = $('lvlBtn');
  if (!btn) return;
  btn.onclick = () => $('lvlPick').classList.toggle('hidden');

}
const levelBadgeText = () => `${state.fixed ? '🔒 ' : ''}${LEVEL_NAME[state.level]} ${'⭐'.repeat(state.level)} ▾`;

function startPreset() {
  const p = PRESET;
  if (p.learn) return startLesson(p.learn);
  if (p.topic === 'test') return startTest(false);
  if (p.topic === 'testfb') return startTest(true);
  if (p.topic === 'sim') return showSimPicker();
  startPractice(p.topic, { level: p.level, count: p.count, fixed: p.fixed, hideLevel: p.fixed });
}

function masterySnapshot() {
  return Object.fromEntries(TOPICS.map(t => [t.id, (store.topics[t.id] || {}).mastery || 0]));
}

function startPractice(topicId, opt = {}) {
  navPush('view');
  let level = opt.level;
  if (!level) {
    if (topicId === 'mix') {
      const lv = TOPICS.map(t => (store.topics[t.id] || {}).level || 1);
      level = Math.max(1, Math.min(3, Math.round(lv.reduce((a, b) => a + b, 0) / lv.length)));
    } else level = tstat(topicId).level || 1;
  }
  state = {
    mode: 'practice', topicId, level,
    count: opt.list ? opt.list.length : opt.retry ? opt.retry.length : (opt.count || store.roundLen || 10),
    fixed: !!(opt.fixed || opt.list || opt.retry), hideLevel: !!opt.hideLevel,
    retry: opt.retry || null, list: opt.list || null, label: opt.label || null, lessonId: opt.lessonId || null,
    mixOrder: shuffle(TOPICS.map(t => t.id)),
    qs: [], i: 0, results: [], run: 0, streak: 0, prevGen: null, m0: masterySnapshot()
  };
  renderQ();
}

function startTest(withFeedback) {
  navPush('view');
  const qs = buildTest();
  if (withFeedback) return startPractice('test', { list: qs, label: `${GRADE === 6 ? 'מבדק' : 'מבחן'} עם משוב` });
  state = { mode: 'test', topicId: 'test', qs, count: qs.length, i: 0, results: [], score: 0 };
  renderQ();
}

/* ---------- סימולציה עם שעון ---------- */
let simTimer = null;
function stopSimTimer() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

function showSimPicker() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal picker" role="dialog" aria-modal="true">
    <div class="mtop"><button class="ghost" data-close>✖ ביטול</button></div>
    <h2 class="center">⏱️ סימולציה עם שעון</h2>
    <p class="center">20 שאלות מכל הנושאים, בלי רמזים. אפשר לדלג על שאלה ולחזור אליה, ולהגיש מתי שרוצים.<br>כשהזמן נגמר – ${GRADE === 6 ? 'המבדק' : 'המבחן'} מוגש לבד.</p>
    <p class="center"><b>כמה זמן?</b></p>
    <div class="simtimes">${[30, 45, 60].map(m => `<button data-min="${m}"${m === 45 ? ' class="cur"' : ''}>${m} דקות</button>`).join('')}</div>
    <p class="muted center small">אפשר ללחוץ על השעון כדי להסתיר אותו בזמן הפתרון.</p>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('[data-close]').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { close(); startSim(Number(b.dataset.min)); });
  ov.querySelector('[data-min="45"]').focus();
}

function startSim(mins) {
  navPush('view');
  stopSimTimer();
  const qs = buildTest();
  state = { mode: 'test', topicId: 'test', qs, count: qs.length, i: 0, results: [], score: 0,
    sim: { mins, start: Date.now(), end: Date.now() + mins * 60000, answers: [], raw: [], hide: false } };
  const me = state;
  simTimer = setInterval(() => {
    if (state !== me) return stopSimTimer();
    updateSimClock();
    if (Date.now() >= me.sim.end) finishSim(true);
  }, 1000);
  renderQ();
}

function simLeft() { return Math.max(0, Math.ceil((state.sim.end - Date.now()) / 1000)); }
function simClockText() {
  if (state.sim.hide) return '⏱️ הצגת השעון';
  const t = simLeft();
  return `⏱️ ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
}
function updateSimClock() {
  const el = $('timer');
  if (!el) return;
  el.textContent = simClockText();
  el.classList.toggle('warn', !state.sim.hide && simLeft() <= 300);
}

// שמירת התשובה של השאלה הנוכחית (בלי בדיקה)
function simSave() {
  const s = state, q = s.qs[s.i];
  if (!$('mainAns')) return;
  s.sim.answers[s.i] = readAnswer(q);
  const raw = {};
  app.querySelectorAll('#mainAns input').forEach(inp => raw[inp.id] = inp.value);
  raw.selected = s.selected;
  s.sim.raw[s.i] = raw;
}
function simRestore() {
  const raw = state.sim.raw[state.i];
  if (!raw) return;
  app.querySelectorAll('#mainAns input').forEach(inp => { if (raw[inp.id] != null) inp.value = raw[inp.id]; });
  if (raw.selected != null) {
    state.selected = raw.selected;
    const b = app.querySelector(`.choices button[data-c="${raw.selected}"]`);
    if (b) b.classList.add('sel');
  }
}
function simAnswered(i) {
  const a = state.sim.answers[i];
  return !!a && !check(state.qs[i], a).empty;
}
function simGo(i) {
  simSave();
  state.i = i;
  renderQ();
  window.scrollTo(0, 0);
}
function simSubmitAsk() {
  simSave();
  const left = state.qs.filter((q, i) => !simAnswered(i)).length;
  if (!confirm(left ? `יש עוד ${left} שאלות בלי תשובה. להגיש בכל זאת?` : `להגיש את ${GRADE === 6 ? 'המבדק' : 'המבחן'}?`)) return;
  finishSim(false);
}
function finishSim(timeUp) {
  stopSimTimer();
  const s = state;
  if (timeUp) simSave();
  s.sim.used = Math.min(s.sim.mins * 60, Math.round((Date.now() - s.sim.start) / 1000));
  s.sim.timeUp = timeUp;
  const empty = q => q.type === 'num' ? { raw: '', val: null } : q.type === 'choice' ? { val: null } : { val: { w: null, n: null, d: null } };
  s.results = s.qs.map((q, i) => {
    const a = s.sim.answers[i] || empty(q);
    const ok = !!check(q, a).ok;
    return { q, a, ok, outcome: ok ? 'first' : 'shown' };
  });
  s.score = s.results.filter(r => r.ok).length;
  s.i = s.count;
  if (timeUp) alert('⏰ הזמן נגמר! ' + (GRADE === 6 ? 'המבדק הוגש' : 'המבחן הוגש') + '. בואו נראה איך הלך.');
  summary();
}

function makeQuestion() {
  const s = state;
  if (s.list) return s.list[s.i];
  if (s.retry) { const r = s.retry[s.i]; return mk(r.topic, r.gen, r.lv); }
  const topic = s.topicId === 'mix' ? s.mixOrder[s.i % s.mixOrder.length] : s.topicId;
  const pool = TOPIC[topic].levels[s.level];
  let g = pick(pool);
  if (pool.length > 1) while (g === s.prevGen) g = pick(pool);
  s.prevGen = g;
  return mk(topic, g, s.level);
}

function inputHTML(q) {
  if (q.type === 'num') return `
    <span class="lbl">תשובה:</span>
    <input id="ans" class="ans" inputmode="decimal" autocomplete="off" aria-label="תשובה">
    ${q.unit ? `<span class="unit">${q.unit}</span>` : ''}`;
  if (q.type === 'frac') return `
    <span class="lbl">תשובה:</span>
    <span class="fracin">
      ${q.noWhole ? '' : '<input id="fw" class="w" inputmode="numeric" aria-label="שלם" placeholder="שלם">'}
      <span class="stack">
        <input id="fn" inputmode="numeric" aria-label="מונה" placeholder="מונה">
        <span class="bar"></span>
        <input id="fd" inputmode="numeric" aria-label="מכנה" placeholder="מכנה">
      </span>
    </span>
    <span class="fracin-note">${q.noWhole ? 'כתבו מונה ומכנה.' : 'אם התשובה גדולה מ-1, כתבו אותה כשבר מעורב (שלם + שבר). אם התשובה מספר שלם – כתבו רק בתיבה "שלם".'}</span>`;
  return `<div class="choices">${q.choices.map((c, i) => `<button data-c="${i}">${c}</button>`).join('')}</div>`;
}

function titleText() {
  if (state.exit) return 'כרטיס יציאה – ' + TOPIC[state.exit].name;
  if (state.sim) return 'סימולציה עם שעון';
  if (state.mode === 'test') return TEST_NAME;
  if (state.label) return state.label;
  if (state.retry) return 'תרגול הטעויות שלי';
  if (state.topicId === 'mix') return 'תרגול מעורב';
  const t = TOPIC[state.topicId];
  return t.name;
}

function renderQ() {
  if (!state.qs[state.i]) state.qs[state.i] = state.mode === 'test' ? state.qs[state.i] : makeQuestion();
  const q = state.qs[state.i];
  const t = TOPIC[q.topic];
  const total = state.count;
  const practice = state.mode === 'practice';
  Object.assign(state, { tries: 0, selected: null, done: false, guide: null });
  stopSpeak();
  const tips = practice && TOPIC[state.topicId]
    ? `<details class="tips"><summary>${ic('note')} תזכורת – מה חשוב לזכור בנושא</summary><ul>${t.tips.map(x => `<li>${x}</li>`).join('')}</ul></details>` : '';
  const showLevel = practice && !state.hideLevel && !state.list && !state.retry;
  app.innerHTML = `
    <div class="topbar">
      <span class="title">${titleText()}</span>
      <span>שאלה ${state.i + 1} מתוך ${total}</span>

      <span>
        <button class="ghost" id="fontBtn" title="שינוי גודל הכתב">א+</button>

    ${state.sim ? `<div class="simnav" aria-label="מעבר בין שאלות">${state.qs.map((x, i) => `<button data-go="${i}" class="${simAnswered(i) ? 'done' : ''}${i === state.i ? ' cur' : ''}" aria-label="שאלה ${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="simnote">כחול = יש תשובה · אפשר ללחוץ על מספר כדי לעבור לשאלה</div>` : ''}
    ${practice ? `<div class="statusrow">
      ${showLevel ? `<span class="lvlwrap"><button class="lvl" id="lvlBtn" title="שינוי רמה" aria-label="שינוי רמה">${levelBadgeText()}</button><span class="lvlpick hidden" id="lvlPick">${[1, 2, 3].map(n => `<button class="${n === state.level ? 'sel' : ''}" data-lv="${n}">${'⭐'.repeat(n)} ${LEVEL_NAME[n]}</button>`).join('')}</span><span class="lvlnote" id="lvlNote"></span></span>` : '<span></span>'}
      <span class="streak">${state.streak >= 2 ? `🔥 ${state.streak} ברצף!` : ''}</span>
    </div>` : ''}
    ${tips}
    <div class="card">
     <div class="qlayout">

        <div class="qtext">${q.text}</div>

      </div>
      ${q.fig || ''}

      <div class="actions">

        ${q.type === 'choice' && practice ? '' : `<button id="go">${state.sim ? (state.i + 1 === total ? 'סיום והגשה' : 'לשאלה הבאה ←') : !practice ? (state.i + 1 === total ? 'סיום והגשה' : 'שמירה והמשך ←') : 'בדיקה ✓'}</button>`}
        ${state.sim && state.i + 1 < total ? '<button class="secondary" id="simDone">🏁 הגשה</button>' : ''}
        ${practice ? `<button class="secondary" id="hintBtn">${ic('bulb')} רמז</button>` : ''}
        ${practice && q.gen ? `<button class="secondary" id="exBtn">${ic('example')} דוגמה פתורה</button>` : ''}
        <button class="hidden" id="next">${state.i + 1 === total ? 'לסיכום 🏁' : 'לשאלה הבאה ←'}</button>

  if (q.type === 'choice') {
    app.querySelectorAll('.choices button').forEach(b => b.onclick = () => {

      if (practice) submit();
    });
  } else {
    const inputs = app.querySelectorAll('#mainAns input');
    inputs.forEach(inp => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (!state.done) submit(); else nextQ(); }
    }));
    if (inputs[0] && window.innerWidth > 600) inputs[0].focus();
  }
  if (state.sim) { simRestore(); updateSimClock(); }
}

function showFb(kind, html) {

}

function lockMain() {
  app.querySelectorAll('#mainAns input').forEach(i => i.disabled = true);
  ['go', 'hintBtn'].forEach(id => { if ($(id)) $(id).classList.add('hidden'); });
}

function lockInputs() {
  lockMain();
  if ($('exBtn')) $('exBtn').classList.add('hidden');
  const nx = $('next');
  nx.classList.remove('hidden');
  nx.focus();
}

// רמז ודוגמה פתורה – "בשוליים" של הדף, כמו הערה של המורה
function showHint() {
  const q = state.qs[state.i];
  $('mhint').innerHTML = `<div class="mnote"><div class="mtitle">${ic('bulb')} רמז</div><div>${q.hint}</div>${learnLink(q)}</div>`;
  updMargin();
}
function updMargin() {
  const m = $('qmargin');
  if (!m) return;
  m.classList.toggle('hidden', !($('mhint').innerHTML.trim() || !$('example').classList.contains('hidden')));
}
function showExample() {
  const q = state.qs[state.i];
  const box = $('example');
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); updMargin(); return; }
  const ex = q.gen();
  box.innerHTML = `
    <div class="exhead">${ic('example')} דוגמה פתורה – שאלה דומה עם מספרים אחרים</div>
    <div class="qtext">${ex.text}</div>
    ${ex.fig || ''}
    ${ex.steps ? `<ol class="exsteps">${ex.steps.map(s => `<li>${s.p} <b class="m">${fmt(s.a)}</b></li>`).join('')}</ol>` : ''}
    <div><b>התשובה:</b> ${correctHTML(ex)}</div>
    <div class="muted">${ex.exp}</div>
    <div class="muted" style="margin-top:6px">עכשיו נסו לפתור את השאלה שלכם באותה דרך.</div>`;
  box.classList.remove('hidden');
  updMargin();
}

const CHEERS = ['כל הכבוד! 🎉', 'מצוין! 🌟', 'נכון מאוד! 👏', 'יפה מאוד! 💪', 'בדיוק! ✅'];

function submit() {
  if (state.done || state.guide) return;
  const q = state.qs[state.i];
  const a = readAnswer(q);
  const r = check(q, a);

  if (state.sim) {
    if (state.i + 1 === state.count) return simSubmitAsk();
    return simGo(state.i + 1);
  }
  if (state.mode === 'test') {
    if (r.empty && !confirm('לא כתבתם תשובה. להמשיך בכל זאת?')) return;
    state.results.push({ q, a, ok: !!r.ok, outcome: r.ok ? 'first' : 'shown' });
    if (r.ok) state.score++;
    nextQ();
    return;
  }

  if (r.empty) { showFb('hint', 'כתבו תשובה ואז לחצו "בדיקה" 🙂'); return; }
  if (r.retry) { showFb('hint', `🤏 ${r.msg}`); return; }
  state.tries++;
  if (r.ok) {
    state.done = true;
    const outcome = state.tries === 1 ? 'first' : 'second';
    state.results.push({ q, a, ok: true, outcome });
    const up = adapt(outcome);
    if (q.type === 'choice') markChoices(q, state.selected);
    showFb('ok', `<div class="head">${outcome === 'first' ? pick(CHEERS) : 'נכון! הצלחתם בניסיון השני 👍'}</div>${up ? `<div class="levelup">${up}</div>` : ''}${r.note && !r.tip ? r.note + '<br>' : ''}<span class="muted">הסבר:</span> ${q.exp}${r.tip || ''}`);
    lockInputs();
    return;
  }
  const trap = findTrap(q, a);
  if (state.tries === 1) {
    if (q.type === 'choice') {
      const btn = app.querySelector(`.choices button[data-c="${state.selected}"]`);
      btn.classList.add('wrong'); btn.disabled = true;
    }
    showFb('bad', trap
      ? `<div class="head">🤔 כמעט! ${trap.m}</div>נסו שוב 💪${r.tip || ''}`
      : `<div class="head">לא בדיוק... נסו שוב</div>${ic('bulb')} רמז: ${q.hint}${r.tip || ''}`);
    return;
  }
  // ניסיון שני לא הצליח
  if (q.type === 'choice') markChoices(q, state.selected, !!q.steps);
  if (q.steps && q.steps.length) startGuided(trap);
  else {
    state.done = true;
    state.results.push({ q, a, ok: false, outcome: 'shown' });
    adapt('shown');
    showFb('info', `<div class="head">לא נורא – ככה לומדים! 💙</div>${trap ? `🤔 ${trap.m}<br>` : ''}התשובה הנכונה: <b>${correctHTML(q)}</b><br><span class="muted">הסבר:</span> ${q.exp}${r.tip || ''}`);
    lockInputs();
  }
}

function markChoices(q, sel, hideRight) {
  app.querySelectorAll('.choices button').forEach(b => {
    const i = Number(b.dataset.c);
    b.disabled = true;
    if (i === q.ans && !hideRight) b.classList.add('right');
    else if (i === sel) b.classList.add('wrong');
  });
}

/* ---------- פתרון מודרך צעד אחר צעד ---------- */
function startGuided(trap) {
  const q = state.qs[state.i];
  state.guide = { k: 0, tries: 0, note: '', a: readAnswer(q) };
  lockMain();
  if ($('exBtn')) $('exBtn').classList.add('hidden');
  showFb('hint', `<div class="head">לא נורא! בואו נפתור את זה יחד, צעד אחר צעד 👣</div>${trap ? `🤔 ${trap.m}` : ''}`);
  renderStep();
}

function renderStep() {
  const q = state.qs[state.i], g = state.guide;
  const done = q.steps.slice(0, g.k).map((st, i) =>
    `<div class="step done">✔ <span class="sn">שלב ${i + 1}:</span> ${st.p} <b class="m">${fmt(st.a)}</b></div>`).join('');
  const cur = g.k < q.steps.length ? `
    <div class="step cur">
      ${g.note ? `<div class="snote">${g.note}</div>` : ''}
      <div><span class="sn">שלב ${g.k + 1} מתוך ${q.steps.length}:</span> ${q.steps[g.k].p}</div>
      <div class="answer-area">
        <input id="sans" class="ans" inputmode="decimal" autocomplete="off" aria-label="תשובה לשלב">
        <button id="sgo">בדיקה ✓</button>
        ${canSpeak ? `<button class="ghost speak" id="sspeak" aria-label="הקראת השלב">${ic('speaker')}</button>` : ''}
      </div>
      <div class="sfb" id="sfb" aria-live="polite"></div>
    </div>` : '';
  $('guide').innerHTML = `<div class="guide">${done}${cur}</div>`;
  if (!cur) return;
  const inp = $('sans');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkStep(); } });
  $('sgo').onclick = checkStep;
  if ($('sspeak')) $('sspeak').onclick = e => speak(q.steps[g.k].p, e.currentTarget);
  inp.focus();
}

function checkStep() {
  const q = state.qs[state.i], g = state.guide, st = q.steps[g.k];
  const v = parseNum($('sans').value);
  if (v == null || Number.isNaN(v)) { $('sfb').textContent = 'כתבו מספר 🙂'; return; }
  if (Math.abs(v - st.a) < 1e-9) {
    g.k++; g.tries = 0; g.note = '';
  } else {
    g.tries++;
    if (g.tries < 2) { $('sfb').innerHTML = 'לא בדיוק – נסו שוב את השלב הזה 💪'; $('sans').select(); return; }
    g.note = `💙 בשלב הקודם התשובה הייתה ${M(fmt(st.a))}. ממשיכים!`;
    g.k++; g.tries = 0;
  }
  if (g.k >= q.steps.length) finishGuided();
  else renderStep();
}

function finishGuided() {
  const q = state.qs[state.i];
  state.done = true;
  renderStep();
  state.results.push({ q, a: state.guide.a, ok: false, outcome: 'guided' });
  adapt('guided');
  if (q.type === 'choice') markChoices(q, state.selected);
  showFb('ok', `<div class="head">🎉 כל הכבוד! פתרתם את השאלה צעד אחר צעד.</div>התשובה: <b>${correctHTML(q)}</b><br><span class="muted">הסבר:</span> ${q.exp}`);
  lockInputs();
}

/* ---------- התאמת רמה ושליטה ---------- */
function adapt(outcome) {
  const s = state, q = s.qs[s.i], ts = tstat(q.topic);
  const gain = { first: 3 + 2 * (q.lv || 1), second: 2, guided: 1, shown: -1 }[outcome];
  ts.mastery = Math.max(0, Math.min(100, ts.mastery + gain));
  store.solved = (store.solved || 0) + 1;
  let msg = '';
  if (outcome === 'first') { s.run++; s.streak++; } else { s.run = 0; s.streak = 0; }
  if (!s.fixed) {
    if (outcome === 'first' && s.run >= 2 && s.level < 3) {
      s.level++; s.run = 0;
      msg = `🚀 מעולה! עולים ל${LEVEL_NAME[s.level]} – שאלות קצת יותר מאתגרות.`;
    }
    if ((outcome === 'guided' || outcome === 'shown') && s.level > 1) s.level--;
    if (s.topicId !== 'mix' && TOPIC[s.topicId]) ts.level = s.level;
  }
  saveStore(store);
  return msg;
}

function nextQ() {
  state.i++;
  if (state.i >= state.count) summary();
  else { renderQ(); window.scrollTo(0, 0); }
}

/* ---------- סיכום ---------- */
function summary() {
  const s = state, n = s.results.length;
  track(s.mode === 'test' ? (s.exit ? 'כרטיס יציאה – סיום' : 'מבחן – סיום') : 'תרגול – סיום', `${titleText()} · ${s.results.filter(r => r.outcome === 'first' || r.outcome === 'second').length}/${n}`);
  const name = store.name || '';
  const date = new Date().toLocaleDateString('he-IL');
  const label = titleText();
  const cnt = o => s.results.filter(r => r.outcome === o).length;
  const first = cnt('first'), second = cnt('second'), guided = cnt('guided'), shown = cnt('shown');
  const correct = first + second;
  const ratio = n ? correct / n : 0;
  const stars = 1 + (ratio >= 0.5 ? 1 : 0) + (ratio >= 0.8 ? 1 : 0);
  const single = s.mode === 'practice' && TOPIC[s.topicId] && !s.retry;
  let compare = '';
  if (single) {
    const ts = tstat(s.topicId), prev = ts.last;
    if (prev) {
      if (correct > prev.correct) compare = `📈 <b>השתפרת!</b> בפעם הקודמת: ${prev.correct} תשובות נכונות, והיום: ${correct}.`;
      else if (correct === prev.correct) compare = `👍 שמרת על אותה תוצאה כמו בפעם הקודמת (${correct} נכונות).`;
      else compare = `בפעם הקודמת היו ${prev.correct} תשובות נכונות. לא נורא – בכל תרגול לומדים משהו חדש 💪`;
    }
    ts.last = { correct, n };
  }
  if (s.mode === 'test' && !s.exit) store.tests = (store.tests || []).concat({ date, score: correct, total: n }).slice(-10);
  saveStore(store);

  const msg = ratio >= 0.8 ? 'מעולה! 🏆' : ratio >= 0.5 ? 'עבודה טובה! 💪' : 'כל הכבוד על ההתמדה! 🌱';
  const sub = ratio >= 0.5 ? '' : '<div class="muted">כל שאלה שפתרת – גם בעזרה – מקדמת אותך. התרגול הבא יהיה קל יותר!</div>';

  // שינוי בשליטה לפי נושא
  const touched = [...new Set(s.results.map(r => r.q.topic))];
  const growth = s.mode === 'practice' ? touched.map(id => {
    const before = s.m0[id] || 0, after = (store.topics[id] || {}).mastery || 0;
    return `<div class="grow"><span>${TOPIC[id].icon} ${TOPIC[id].name}</span>
      <span class="mbar"><span style="width:${after}%"></span></span>
      <span class="small">${after > before ? `+${after - before} ⬆` : masteryLabel(after)}</span></div>`;
  }).join('') : '';

  const byTopic = {};
  s.results.forEach(r => {
    const b = byTopic[r.q.topic] = byTopic[r.q.topic] || { ok: 0, n: 0 };
    b.n++; if (r.ok) b.ok++;
  });
  const weak = Object.entries(byTopic).filter(([, b]) => b.ok / b.n < 0.7).map(([id]) => TOPIC[id].name);
  const breakdown = s.mode === 'test' ? `
    <table class="breakdown"><tr><th>נושא</th><th>נכון</th></tr>
    ${Object.entries(byTopic).map(([id, b]) => `<tr><td>${TOPIC[id].icon} ${TOPIC[id].name}</td><td>${b.ok} / ${b.n}</td></tr>`).join('')}
    </table>
    ${weak.length ? `<p>כדאי לתרגל עוד: <b>${weak.join(', ')}</b></p>` : ''}` : '';

  const missed = s.results.filter(r => r.outcome !== 'first').map(r => ({ topic: r.q.topic, gen: r.q.gen, lv: r.q.lv })).filter(r => r.gen);

  const review = s.mode === 'test' ? `
    <div class="card">
      <h2>הפתרונות</h2>
      <ul class="review">
        ${s.results.map((r, i) => `<li>
          <span class="mark ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✔' : '✘'} שאלה ${i + 1}</span>
          <span class="small">(${TOPIC[r.q.topic].name})</span><br>
          ${r.q.text}
          ${r.q.fig || ''}
          <div>התשובה שלי: ${answerHTML(r.q, r.a)}${r.ok ? '' : ` · <b>התשובה הנכונה: ${correctHTML(r.q)}</b>`}</div>
          ${r.q.type === 'num' ? numWritingTip(r.a.raw, r.a.val) : ''}
          ${r.ok ? '' : `<div class="small">הסבר: ${r.q.exp}</div>`}
        </li>`).join('')}
      </ul>
    </div>` : '';

  const resultText = `${name ? name + ' | ' : ''}${label} | נכון: ${correct} מתוך ${n}${s.mode === 'practice' ? ` (${first} בניסיון ראשון, ${guided} בעזרת פתרון מודרך)` : ''} | ${date}`;

  app.innerHTML = `
    <div class="card center">
      <h2>${label} – סיכום</h2>
      ${name ? `<div class="muted">${esc(name)} · ${date}</div>` : ''}
      <div class="stars">${'⭐'.repeat(stars)}</div>
      <div class="score-big">${msg}</div>
      ${sub}
      <ul class="stats">
        <li>✅ נכון בניסיון ראשון: <b>${first}</b></li>
        ${s.mode === 'practice' ? `<li>👍 נכון בניסיון שני: <b>${second}</b></li>
        <li>👣 נפתרו צעד אחר צעד: <b>${guided}</b></li>
        <li>📖 למדנו מהתשובה: <b>${shown}</b></li>` : `<li>✘ לא נכון: <b>${n - correct}</b></li>`}
      </ul>
      ${s.sim ? `<p class="compare">${s.sim.timeUp ? '⏰ הזמן נגמר.' : `⏱️ סיימת ב-${s.sim.used >= 60 ? Math.floor(s.sim.used / 60) + ' דקות' + (s.sim.used % 60 ? ' ו-' : '') : ''}${s.sim.used % 60 || s.sim.used < 60 ? (s.sim.used % 60) + ' שניות' : ''} (מתוך ${s.sim.mins} דקות).`}</p>` : ''}
      ${compare ? `<p class="compare">${compare}</p>` : ''}
      ${growth ? `<div class="growth"><div class="muted">ההתקדמות שלי:</div>${growth}</div>` : ''}
      ${breakdown}
      <div class="actions" style="justify-content:center">
        ${missed.length ? `<button id="retryBtn">${ic('retry')} תרגול השאלות שהיו קשות (${missed.length})</button>` : ''}
        <button class="${missed.length ? 'secondary' : ''}" id="again">סבב נוסף ←</button>
        <button class="secondary" id="copy">${ic('copy')} העתקת התוצאה</button>
        <button class="secondary" id="homeBtn">${ic('home')} לדף הבית</button>
      </div>
      <p class="muted" id="copied" style="min-height:1.4em"></p>
    </div>
    ${review}`;

  if ($('retryBtn')) $('retryBtn').onclick = () => startPractice(s.topicId === 'test' ? 'mix' : s.topicId, { retry: shuffle(missed) });
  $('again').onclick = () => {
    if (s.exit) return exitHome();
    if (s.sim) return startSim(s.sim.mins);
    if (s.mode === 'test') return startTest(false);
    if (s.list) return startTest(true);
    if (s.lessonId) return startLessonPractice(s.lessonId);
    if (s.retry) return startPractice(s.topicId);
    startPractice(s.topicId, { fixed: s.fixed, hideLevel: s.hideLevel, level: s.fixed ? s.level : null, count: s.count });
  };
  $('homeBtn').onclick = home;
  $('copy').onclick = async () => {
    const out = $('copied');
    try {
      await navigator.clipboard.writeText(resultText);
      out.textContent = 'הועתק! אפשר להדביק בתגובה פרטית למורה בקלאסרום.';
    } catch (e) {
      out.textContent = resultText;
    }
  };
  if (s.exit) exitAfterSummary(s, correct, n);
  window.scrollTo(0, 0);
}

/* =========================================================
   משחקים – מרוץ נגד השעון (נפתח אחרי סבב תרגול)
   ========================================================= */
const RACE_SECS = 60;
const RACE_TRACKS = GRADE === 1 ? [
  { id: 'a10', name: 'חיבור וחיסור עד 10' },
  { id: 'a20', name: 'חיבור וחיסור עד 20' }
] : GRADE === 2 ? [
  { id: 'a20', name: 'חיבור וחיסור עד 20' },
  { id: 'a100', name: 'חיבור וחיסור עד 100' },
  { id: 'x2510', name: 'כפל ב-2, ב-5 וב-10' }
] : GRADE <= 4 ? [
  { id: 'a100', name: 'חיבור וחיסור עד 100' },
  { id: 'mul', name: 'לוח הכפל' },
  { id: 'div', name: 'חילוק' }
] : [
  { id: 'mul', name: 'לוח הכפל' },
  { id: 'div', name: 'חילוק' },
  { id: 'mental', name: 'חשבון בראש' }
];
function raceQ(track) {
  let a, b;
  switch (track) {
    case 'a10':
      if (Math.random() < 0.55) { a = R(0, 9); b = R(1, 10 - a); return { t: `${a} + ${b} =`, ans: a + b }; }
      a = R(2, 10); b = R(1, a); return { t: `${a} - ${b} =`, ans: a - b };
    case 'a20':
      if (Math.random() < 0.55) { a = R(2, 12); b = R(1, 20 - a > 9 ? 9 : 20 - a); return { t: `${a} + ${b} =`, ans: a + b }; }
      a = R(8, 20); b = R(1, Math.min(9, a)); return { t: `${a} - ${b} =`, ans: a - b };
    case 'a100': {
      const k = R(0, 3);
      if (k === 0) { a = R(1, 8) * 10; b = R(1, 9 - a / 10) * 10; return { t: `${a} + ${b} =`, ans: a + b }; }
      if (k === 1) { a = R(11, 89); b = R(1, Math.min(9, 99 - a)); return { t: `${a} + ${b} =`, ans: a + b }; }
      if (k === 2) { a = R(20, 99); b = R(1, 9); return { t: `${a} - ${b} =`, ans: a - b }; }
      a = R(3, 9) * 10; b = R(1, a / 10 - 1) * 10; return { t: `${a} - ${b} =`, ans: a - b };
    }
    case 'x2510': a = pick([2, 5, 10]); b = R(1, 10); return Math.random() < 0.5 ? { t: `${a} × ${b} =`, ans: a * b } : { t: `${b} × ${a} =`, ans: a * b };
    case 'mul': a = R(2, 10); b = R(2, 10); return { t: `${a} × ${b} =`, ans: a * b };
    case 'div': a = R(2, 10); b = R(2, 10); return { t: `${a * b} : ${a} =`, ans: b };
    case 'mental': {
      const k = R(0, 4);
      if (k === 0) { a = R(2, 99); b = pick([10, 100]); return { t: `${a} × ${b} =`, ans: a * b }; }
      if (k === 1) { a = R(2, 99) * 10; return { t: `${a} : 10 =`, ans: a / 10 }; }
      if (k === 2) { a = R(11, 49); return { t: `${a} × 2 =`, ans: a * 2 }; }
      if (k === 3) { a = R(6, 49) * 2; return { t: `${a} : 2 =`, ans: a / 2 }; }
      a = R(2, 9); b = R(2, 9) * 10; return { t: `${a} × ${b} =`, ans: a * b };
    }
  }
}
function raceData() { store.race = store.race || { best: {}, plays: 0 }; store.race.best = store.race.best || {}; return store.race; }
let race = null;
function stopRace() { if (race && race.timer) clearInterval(race.timer); if (race) race.timer = null; }


function raceHome(trackId) {
  stopRace(); state = null; lessonView = null; navPush('race');
  const r = raceData();
  const tr = RACE_TRACKS.find(t => t.id === trackId) || RACE_TRACKS.find(t => t.id === r.lastTrack) || RACE_TRACKS[0];
  app.innerHTML = `
    <div class="topbar"><span class="title">${ic('flag')} מרוץ נגד השעון</span><button class="secondary" id="rHome">${ic('home')} לדף הבית</button></div>

function raceTyped(v) {

}

/* ---------- משחק זוגות: הופכים קלפים ומחפשים תרגיל והתשובה שלו ---------- */
const MEM_DECKS = GRADE === 1 ? [
  { id: 'dots', name: 'מספר וציור' },
  { id: 'sum10', name: 'חיבור עד 10' }
] : GRADE === 2 ? [

  { id: 'mul', name: 'לוח הכפל' },
  { id: 'fdec', name: 'שבר ומספר עשרוני' },
  { id: 'feq', name: 'שברים שווים' }
] : [
  { id: 'mul', name: 'לוח הכפל' },
  { id: 'fdec', name: 'שבר ומספר עשרוני' },
  { id: 'pct', name: 'שבר ואחוזים' }
];
const MEM_FD = [[1, 2, '0.5'], [1, 4, '0.25'], [3, 4, '0.75'], [1, 5, '0.2'], [2, 5, '0.4'], [3, 5, '0.6'], [4, 5, '0.8'], [1, 10, '0.1'], [3, 10, '0.3'], [7, 10, '0.7'], [9, 10, '0.9'], [1, 20, '0.05'], [1, 8, '0.125'], [3, 20, '0.15']];
const MEM_PCT = [[1, 2, 50], [1, 4, 25], [3, 4, 75], [1, 5, 20], [2, 5, 40], [3, 5, 60], [1, 10, 10], [3, 10, 30], [7, 10, 70], [1, 20, 5], [1, 25, 4], [1, 100, 1], [9, 10, 90], [4, 5, 80]];
// זוגות שונים זה מזה (אין שתי תשובות זהות בלוח)
function memPairs(deck, n) {
  const out = [], used = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 500) {
    let a, b, key, eq = null;
    switch (deck) {
      case 'dots': { const k = R(1, 10); key = k; a = M(k); b = frameHTML(k); break; }
      case 'sum10': { const s = R(2, 10), x = R(1, s - 1); key = s; a = M(`${x} + ${s - x}`); b = M(s); eq = `${x} + ${s - x} = ${s}`; break; }
      case 'sum20': { const s = R(11, 20), x = R(s - 9, 9); key = s; a = M(`${x} + ${s - x}`); b = M(s); eq = `${x} + ${s - x} = ${s}`; break; }
      case 'x2510': { const x = pick([2, 5, 10]), y = R(2, 10); key = x * y; a = M(`${x} × ${y}`); b = M(x * y); eq = `${x} × ${y} = ${x * y}`; break; }
      case 'mul': { const x = R(3, 9), y = R(3, 9); key = x * y; a = M(`${x} × ${y}`); b = M(x * y); eq = `${x} × ${y} = ${x * y}`; break; }
      case 'div': { const x = R(2, 9), y = R(2, 10); key = y; a = M(`${x * y} : ${x}`); b = M(y); eq = `${x * y} : ${x} = ${y}`; break; }
      case 'fdec': { const f = pick(MEM_FD); key = f[2]; a = F(f[0], f[1]); b = M(f[2]); eq = `${F(f[0], f[1])} = ${f[2]}`; break; }
      case 'pct': { const f = pick(MEM_PCT); key = f[2]; a = F(f[0], f[1]); b = M(f[2] + '%'); eq = `${F(f[0], f[1])} = ${f[2]}%`; break; }
      case 'feq': { const f = pick([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [1, 6], [5, 6], [3, 8]]), k = R(2, 4); key = f[0] / f[1]; a = F(f[0], f[1]); b = F(f[0] * k, f[1] * k); eq = `${F(f[0], f[1])} = ${F(f[0] * k, f[1] * k)}`; break; }
    }

let mem = null;
function stopMemory() { if (mem && mem.timer) clearInterval(mem.timer); if (mem) mem.timer = null; }
function memData() { store.mem = store.mem || { best: {} }; store.mem.best = store.mem.best || {}; return store.mem; }

function memStart(deckId, n) {
  stopMemory();

}

function memFlip(k) {
  if (!mem || mem.busy) return;
  const c = mem.cards[k], el = app.querySelector(`.mcard[data-k="${k}"]`);
  if (mem.done.has(c.i) || mem.open.includes(k)) return;
  el.classList.add('up');
  el.setAttribute('aria-label', el.querySelector('.mc-face').textContent.trim());
  mem.open.push(k);
  if (mem.open.length < 2) return;
  mem.moves++;
  $('mMoves').textContent = mem.moves;
  const [k1, k2] = mem.open, c1 = mem.cards[k1], c2 = mem.cards[k2];
  const e1 = app.querySelector(`.mcard[data-k="${k1}"]`), e2 = app.querySelector(`.mcard[data-k="${k2}"]`);
  if (c1.i === c2.i) {
    mem.done.add(c1.i); mem.open = [];
    e1.classList.add('match'); e2.classList.add('match');
    $('mPairs').textContent = mem.done.size;
    if (mem.done.size === mem.n) setTimeout(memEnd, 700);
  } else {
    mem.busy = true;
    e1.classList.add('miss'); e2.classList.add('miss');
    setTimeout(() => {
      [e1, e2].forEach(e => { e.classList.remove('up', 'miss'); e.setAttribute('aria-label', 'קלף ' + (Number(e.dataset.k) + 1)); });

}

function jeoStart(teams, topics) {

      do { const lv = JEO_LV[v], gen = pick(t.levels[lv]); q = mk(tid, gen, lv); } while (seen.has(q.text) && g++ < 30);
      seen.add(q.text);
      cells[tid + '-' + v] = { q: { type: q.type, text: q.text, fig: q.fig || '', choices: q.choices || null, ans: q.ans, unit: q.unit || '', exp: q.exp || '', form: q.form || null, topic: tid }, used: false, by: null };
    });
  });
  // שאלה כפולה: משבצת נסתרת (או שתיים בלוח גדול) ששווה פי 2
  const pool = shuffle(Object.keys(cells).filter(k => Number(k.split('-').pop()) >= 300));
  pool.slice(0, topics.length >= 5 ? 2 : 1).forEach(k => { cells[k].dbl = true; });
  jeo = { teams, topics, cells, turn: 0 };
  jeoSave();
  jeoBoard();
}

/* =========================================================
   מי רוצה להיות מיליונר? – 15 שאלות בקושי עולה, 3 גלגלי הצלה
   ========================================================= */
const MIL_LADDER = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const MIL_SAFE = [4, 9];
let mil = null;
// שאלה אמריקאית עם 4 תשובות (שאלה פתוחה – מוסיפים מסיחים מהטעויות הנפוצות)
function toChoice4(q) {
  if (q.type === 'frac') return null;
  if (q.type === 'choice') {
    if (!q.choices || q.choices.length < 3) return null;
    return { text: q.text, fig: q.fig || '', choices: q.choices.slice(), ans: q.ans, hint: q.hint || '', exp: q.exp || '' };
  }
  const a = q.ans, intg = Number.isInteger(a);
  const ok = v => isFinite(v) && v >= 0 && Math.abs(v - a) > 1e-9 && (!intg || Number.isInteger(v));
  const traps = (q.traps || []).map(t => t.v).filter(v => v != null).map(rnd).filter(ok);
  const near = shuffle([a + 1, a - 1, a * 10, a / 10, a + 10, a - 10, a * 2, a + 2, a - 2, a + 100].map(rnd).filter(ok));
  const w = [...new Set([...traps, ...near])].slice(0, 3);
  if (w.length < 3) return null;
  const vals = shuffle([a, ...w]);
  const u = q.unit ? ' ' + q.unit : '';
  return { text: q.text, fig: q.fig || '', choices: vals.map(v => q.unit === '%' ? M(fmt(v) + '%') : M(fmt(v)) + u), ans: vals.indexOf(a), hint: q.hint || '', exp: q.exp || '' };
}

// שאלה אמריקאית לשלב i (1–5 קלות, 6–10 בינוניות, 11–15 מאתגרות)
function milMakeQ(topics, i, seen) {
  const lv = i < 5 ? 1 : i < 10 ? 2 : 3, order = shuffle(topics.slice());
  for (let tries = 0; tries < 60; tries++) {
    const t = TOPIC[order[tries % order.length]];
    const raw = mk(t.id, pick(t.levels[lv]), lv);
    if (seen.has(raw.text)) continue;
    const c = toChoice4(raw);
    if (c) { c.topic = t.id; seen.add(raw.text); return c; }
  }
  window.milFb = (window.milFb || 0) + 1;
  const q = toChoice4(mk(TOPICS[0].id, () => ({ type: 'num', text: `פתרו: ${M(`${i + 2} × ${i + 3} =`)}`, ans: (i + 2) * (i + 3) }), lv)); q.topic = TOPICS[0].id; return q;
}
function milStart(topics, name) {
  const seen = new Set(), qs = Array.from({ length: 15 }, (_, i) => milMakeQ(topics, i, seen));
  mil = { qs, i: 0, name, topics, seen, life: { half: true, swap: true, hint: true }, hidden: [], sel: null, locked: false };
  milDraw();
}

function tfArith(op, a, b) {
  const c = op === '+' ? a + b : op === '-' ? a - b : op === '×' ? a * b : a / b;
  const truth = Math.random() < 0.5;
  let shown = c;
  if (!truth) { const d = shuffle([1, -1, 2, -2, op === '×' ? a : 10, op === '×' ? b : -10]).find(x => c + x >= 0 && x !== 0); shown = c + d; }
  return { s: M(`${a} ${op} ${b} = ${shown}`), t: truth, e: truth ? `נכון: ${M(`${a} ${op} ${b} = ${c}`)}` : `לא נכון: ${M(`${a} ${op} ${b} = ${c}`)}, ולא ${M(shown)}.` };
}
function tfCompare(x, y, show = v => fmt(v)) {
  if (x === y) y = x + (x > 0 && Math.random() < 0.5 ? -1 : 1);
  const sign = Math.random() < 0.5 ? '>' : '<';
  const truth = sign === '>' ? x > y : x < y;
  return { s: M(`${show(x)} ${sign} ${show(y)}`), t: truth, e: `${M(show(Math.max(x, y)))} גדול מ-${M(show(Math.min(x, y)))}.` };
}

function wsQuestionHTML(q, n) {
  let ans;
  if (q.type === 'num') ans = `<div class="wsans">תשובה: <span class="wsline"></span>${q.unit ? ' ' + q.unit : ''}</div>`;
  else if (q.type === 'frac') ans = `<div class="wsans">תשובה: <span class="wsfrac">${q.noWhole ? '' : '<span class="wsbox big"></span>'}<span class="wsstack"><span class="wsbox"></span><span class="wsbar"></span><span class="wsbox"></span></span></span></div>`;
  else ans = `<div class="wschoices">${q.choices.map(c => `<div><span class="wscheck">☐</span> ${c}</div>`).join('')}</div>`;
  const wordy = q.steps && q.steps.length >= 3 && q.text.replace(/<[^>]+>/g, '').length > 70;
  const grid = `<div class="ex-grid${wordy ? ' big' : q.type === 'choice' ? ' sm' : ''}"></div>`;
  return `<div class="wsq"><div class="qmain"><div class="wsqhead"><span class="wsnum">${n}</span><div class="qtext">${q.text}</div></div>${q.fig || ''}${ans}</div>${grid}</div>`;
}

function examQuestionHTML(q, n) {
  let ans;
  if (q.type === 'choice') ans = `<div class="ex-choices">${q.choices.map((c, i) => `<div><span class="ex-idx">${i + 1}</span><span class="ex-check"></span> ${c}</div>`).join('')}</div>`;
  else if (q.type === 'frac') ans = `<div class="wsans">תשובה: <span class="wsfrac">${q.noWhole ? '' : '<span class="wsbox big"></span>'}<span class="wsstack"><span class="wsbox"></span><span class="wsbar"></span><span class="wsbox"></span></span></span></div>`;
  else ans = `<div class="wsans">תשובה: <span class="wsline"></span>${q.unit ? ' ' + q.unit : ''}</div>`;
  const plain = q.text.replace(/<[^>]+>/g, '');
  const wordy = q.steps && q.steps.length >= 3 && plain.length > 60;
  const work = wordy ? '<div class="ex-work">הציגו את דרך הפתרון.</div>' : '';
  const grid = `<div class="ex-grid${wordy ? ' big' : q.type === 'choice' ? ' sm' : ''}"></div>`;
  return `<div class="ex-q"><div class="qmain"><div class="wsqhead"><span class="ex-num">${n}</span><div class="qtext">${q.text}</div></div>${q.fig || ''}${work}${ans}</div>${grid}</div>`;
}

function buildWorksheet(topics, level, count) {
  const qs = [], prev = {};
  for (let i = 0; i < count; i++) {
    const t = topics[i % topics.length];
    const lv = level === 'mix' ? Math.min(3, 1 + Math.floor(3 * i / count)) : Number(level);
    const pool = TOPIC[t].levels[lv];
    let g = pick(pool), guard = 0;
    while (pool.length > 1 && g === prev[t] && guard++ < 10) g = pick(pool);
    prev[t] = g;
    qs.push(mk(t, g, lv));
  }
  return qs;
}

/* ---------- חוברת לפי נושאים, עם קוד ליצירה חוזרת ---------- */
const BOOK_COUNTS = [0, 4, 6, 8, 10, 12, 15, 20];
const BOOK_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function bookSeed() { let s = ''; for (let i = 0; i < 5; i++) s += BOOK_ABC[Math.floor(Math.random() * 32)]; return s; }
function bookEncode(counts, seed) { return `${GRADE}-${counts.map(n => BOOK_COUNTS.indexOf(n)).join('')}-${seed}`; }
function bookDecode(code) {
  const m = /^([1-6])-([0-7]+)-([2-9A-HJ-NP-Z]{5})$/.exec(code || '');
  if (!m) return null;
  const grade = Number(m[1]);
  if (grade === GRADE && m[2].length > TOPICS.length) return null;
  // קודים ישנים (לפני שנוסף נושא) – הנושא החדש פשוט לא נכלל
  const cs = m[2].padEnd(grade === GRADE ? TOPICS.length : m[2].length, '0');
  return { grade, counts: cs.split('').map(c => BOOK_COUNTS[Number(c)]), seed: m[3] };
}
// מחולל מספרים "אקראיים" קבוע לפי הקוד – אותו קוד, אותה חוברת
function withSeed(seed, fn) {
  let a = 0;
  for (const c of seed) a = (a * 32 + BOOK_ABC.indexOf(c)) >>> 0;
  a = (a ^ 0x9E3779B9) >>> 0;
  const orig = Math.random;
  Math.random = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  try { return fn(); } finally { Math.random = orig; }
}
function renderBooklet(code) {
  const d = bookDecode(code);
  if (!d) return;
  const title = $('bkt').value.trim() || `חוברת תרגול במתמטיקה – ${GRADE_NAME[GRADE]}`;
  const tipsOn = $('bktips').checked, keyOn = $('bkkey').checked;
  const chapters = withSeed(d.seed, () => TOPICS.map((t, i) => ({ t, qs: d.counts[i] ? buildWorksheet([t.id], 'mix', d.counts[i]) : [] })).filter(c => c.qs.length));
  let n = 0;
  chapters.forEach(c => { c.start = n + 1; n += c.qs.length; });
  const cover = `
    <section class="ws-page bk-cover">
      <h1>${esc(title)}</h1>

// כמה עמודי A4 ייקח דף (שאלה לא נחתכת בין עמודים)
function sheetPages(sec, H_MM) {
  const H = (H_MM || 273) * 96 / 25.4; // גובה העמוד בלי השוליים
  const blocks = [];
  for (const el of sec.children) {
    if (el.classList.contains('wsqs')) blocks.push(...el.children); else blocks.push(el);
  }
  let pages = 1, used = 0;
  for (const b of blocks) {
    const cs = getComputedStyle(b);
    const h = b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
    if (used + h > H && used > 0) { pages++; used = 0; }
    used += h;
  }
  return pages;
}
// חלוקה לעמודים מראש, כדי שהשם יופיע בראש כל עמוד מודפס (בכל דפדפן)
const CREDIT = '© איריס סגל';
function paginateSheets() {
  const out = $('wsout');
  groupDigits(out);
  nikudify(out);
  const H = 270 * 96 / 25.4;
  out.classList.add('measure');
  out.querySelectorAll('.ws-page').forEach(sec => {
    const items = [];
    [...sec.children].forEach(ch => {
      if (ch.matches('.wsqs, .ex-qs, ol')) [...ch.children].forEach((el, idx) => items.push({ el, wrap: ch, idx }));
      else items.push({ el: ch, wrap: null });
    });
    sec.innerHTML = '';
    let page;
    const newPage = () => {
      page = document.createElement('div');
      page.className = 'ws-pg';
      page.innerHTML = `<div class="wscredit">${CREDIT}</div>`;
      sec.appendChild(page);
    };
    const place = it => {
      let box = page;
      if (it.wrap) {
        box = page.lastElementChild;
        if (!box || box.__src !== it.wrap) {
          box = it.wrap.cloneNode(false); box.__src = it.wrap;
          if (box.tagName === 'OL') box.start = (it.wrap.start || 1) + it.idx;
          page.appendChild(box);
        }
      }
      box.appendChild(it.el);
      return box;
    };
    newPage();
    let n = 0;
    for (const it of items) {
      const box = place(it);
      n++;
      if (n > 1 && page.getBoundingClientRect().height > H) {
        it.el.remove();
        if (box !== page && !box.children.length) box.remove();
        // כותרת לא נשארת לבד בתחתית העמוד – עוברת יחד עם מה שאחריה
        const last = page.lastElementChild, orphan = last && /^H[1-3]$/.test(last.tagName) && page.children.length > 2 ? last : null;
        newPage(); n = 1;
        if (orphan) { page.appendChild(orphan); n++; }
        place(it);
      }
    }
  });
  out.classList.remove('measure');
}

// אם התזכורת גורמת לדף לגלוש לעמוד נוסף – מוותרים עליה
function dropTipsIfOverflow() {
  const out = $('wsout');
  groupDigits(out);
  nikudify(out);
  out.classList.add('measure');
  out.querySelectorAll('.ws-page:not(.wskey)').forEach(sec => {
    const tips = sec.querySelector('.wstips');
    if (!tips) return;
    // בודקים גם ב-A4 וגם בדף קצר יותר (Letter), כדי שלא תגלוש שאלה לעמוד נוסף
    const withTips = [273, 255].map(h => sheetPages(sec, h));
    tips.style.display = 'none';
    const without = [273, 255].map(h => sheetPages(sec, h));
    if (without.some((n, i) => n < withTips[i])) tips.remove(); else tips.style.display = '';
  });
  out.classList.remove('measure');
}

const KF_KEY = 'math-kefel-v1';

const KF_INTERVAL = { 1: 0, 2: 1, 3: 3, 4: 7, 5: 14 };

const KF_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSfId_jLGbxTvBDtYOClJFoV1XFqf0EPjx3BusDbQEcUBjMjKw/formResponse';
const KF_FIELDS = { name: 'entry.233330149', klass: 'entry.553468133', minutes: 'entry.1873864621', mastered: 'entry.1570983296', score: 'entry.1494651186', mistakes: 'entry.678117454' };
const KF_CLASS_HASH = '97949116';

const kfId = (a, b) => `${Math.min(a, b)}x${Math.max(a, b)}`;

function kfReport(data) {

function kfFlush() {
  if (navigator.onLine === false) return;

const kfMastered = () => KF_FACTS.filter(([a, b]) => (kf.facts[kfId(a, b)] || {}).box >= 3).length;
function kfRank([a, b]) {
  if (a === 2 || b === 2) return 1;
  if (a === 5 || b === 5) return 2;
  if (a === 9 || b === 9) return 3;
  if (a === 4 || b === 4) return 4;
  if (a === 3 || b === 3) return 5;
  if (a === b) return 6;
  return 7;
}
function kfStrategy(x, y) {
  const a = Math.min(x, y), b = Math.max(x, y), p = a * b;
  const has = n => a === n || b === n, o = n => (a === n ? b : a);
  if (has(2)) return `× 2 זה כפול: ${o(2)} + ${o(2)} = ${p}`;
  if (has(5)) return `× 5 זה חצי מ-× 10: ${o(5)} × 10 = ${o(5) * 10}, והחצי – ${p}`;
  if (has(9)) return `× 9 זה × 10 פחות פעם אחת: ${o(9)} × 10 = ${o(9) * 10}, פחות ${o(9)} = ${p}`;
  if (has(4)) return `× 4 זה כפול-כפול: ${o(4)} × 2 = ${o(4) * 2}, ועוד פעם כפול = ${p}`;
  if (has(3)) return `× 3 זה כפול ועוד פעם: ${o(3)} × 2 = ${o(3) * 2}, ועוד ${o(3)} = ${p}`;
  if (a === b) return `ריבוע – כדאי לזכור בעל פה: ${a} × ${a} = ${p}`;
  if (a === 7 && b === 8) return 'טריק: 5, 6, 7, 8 → 56 = 7 × 8';
  return `מתחילים מ-× 5: ${b} × 5 = ${b * 5}, ועוד ${a - 5} פעמים ${b} = ${p}`;
}

function kfMapHTML() {

let kz = null;
function kfStart(mode) {
  navPush('kfrun');
  const today = kfToday();
  let queue = [];
  if (mode === 'place') queue = shuffle(KF_FACTS.slice()).map(([a, b]) => ({ a, b, v: 'mul' }));
  else if (mode === 'daily') {
    const due = KF_FACTS.filter(([a, b]) => { const f = kf.facts[kfId(a, b)]; return f && f.box >= 1 && f.due <= today; })
      .sort((x, y) => kf.facts[kfId(...x)].box - kf.facts[kfId(...y)].box).slice(0, 12);
    const fresh = KF_FACTS.filter(([a, b]) => !kf.facts[kfId(a, b)] || kf.facts[kfId(a, b)].box === 0)
      .sort((x, y) => kfRank(x) - kfRank(y)).slice(0, due.length > 8 ? 2 : 3);
    const known = shuffle(KF_FACTS.filter(fc => (kf.facts[kfId(...fc)] || {}).box >= 3 && !due.includes(fc)));
    const list = [];
    fresh.forEach(([a, b]) => { list.push({ a, b, v: 'mul', intro: true }); });
    shuffle(due).forEach(([a, b]) => list.push({ a, b, v: kf.facts[kfId(a, b)].box >= 2 ? pick(['mul', 'mul', 'div', 'miss']) : 'mul' }));
    fresh.forEach(([a, b]) => list.push({ a, b, v: 'mul' }));
    known.slice(0, Math.max(0, 16 - list.length)).forEach(([a, b]) => list.push({ a, b, v: pick(['mul', 'div', 'miss', 'tens']) }));
    queue = list;
  } else queue = Array.from({ length: 200 }, () => { const [a, b] = pick(KF_FACTS); return { a, b, v: Math.random() < 0.8 ? 'mul' : 'div' }; });
  kz = { mode, queue, i: 0, right: 0, wrong: 0, missed: {}, reins: {}, start: Date.now(), newGreen: 0, mistakes: [] };
  if (mode === 'chal') kz.end = Date.now() + 60000;
  kfQ();
}

function kfText(q) {
  const [x, y] = Math.random() < 0.5 ? [q.a, q.b] : [q.b, q.a], p = q.a * q.b;
  if (q.v === 'div') return { t: `${p} : ${x} =`, ans: y };
  if (q.v === 'miss') return { t: `${BOX} × ${x} = ${p}`, ans: y };
  if (q.v === 'tens') return { t: `${x * 10} × ${y} =`, ans: p * 10 };
  return { t: `${x} × ${y} =`, ans: p };
}

function kfQ() {
  if (kz.i >= kz.queue.length || (kz.end && Date.now() >= kz.end)) return kfDone();
  const q = kz.queue[kz.i];

  app.innerHTML = `
    <div class="topbar"><span class="title">${kz.mode === 'place' ? '🧭 בדיקת פתיחה' : kz.mode === 'daily' ? '⚡ אימון יומי' : '🏆 אתגר דקה'}</span>
      <span>${kz.mode === 'chal' ? `<b id="kfClock">⏱️ ${Math.ceil((kz.end - Date.now()) / 1000)}</b> · נכון: <b>${kz.right}</b>` : total}</span>
      <span><button class="ghost navhome" id="kfQuit">→ חזרה לאימון</button></span></div>
    ${kz.mode === 'chal' ? '' : `<div class="progress"><div style="width:${kz.i / kz.queue.length * 100}%"></div></div>`}
    <div class="card center kf-q">
      ${q.intro ? `<div class="kf-new">✨ עובדה חדשה<br><span class="small">${kfStrategy(q.a, q.b)}</span></div>` : ''}
      <div class="kf-ex">${M(q.shown.t.replace(BOX, '<span class="box">?</span>'))}</div>
      <input id="kfAns" class="ans kf-in" inputmode="numeric" autocomplete="off" aria-label="תשובה">
      <div class="actions" style="justify-content:center"><button id="kfGo">✓</button></div>
      <div class="fb" id="kfFb" aria-live="polite"></div>
    </div>`;
  const inp = $('kfAns');
  inp.focus();
  q.t0 = Date.now();
  const go = () => kfAnswer(inp.value);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  $('kfGo').onclick = go;
  $('kfQuit').onclick = () => { if (kz.mode === 'chal' || confirm('לצאת מהאימון?')) { kfStopClock(); kfHome(); } };
  if (kz.mode === 'chal' && !kz.clock) kz.clock = setInterval(() => {
    if (!kz || kz.mode !== 'chal') return;
    const left = Math.ceil((kz.end - Date.now()) / 1000);

function kfStopClock() { if (kz && kz.clock) { clearInterval(kz.clock); kz.clock = null; } }

function kfAnswer(raw) {
  if (!raw.trim()) return;

  if (kz.mode === 'place') {
    if (ok && ms <= 4000) { f.box = 3; f.lastUp = today; f.due = today + KF_INTERVAL[3]; }
    else if (ok) { f.box = 1; f.due = today; }
    else f.box = 0;
  } else if (kz.mode === 'daily') {
    if (!ok) { f.box = 1; f.due = today; f.wrong++; kz.missed[kfId(q.a, q.b)] = 1; }
    else {
      f.right++;
      const was = f.box;
      if (fast && !kz.missed[kfId(q.a, q.b)]) {
        if (f.box <= 1) { f.box = 2; f.lastUp = today; }
        else if (f.lastUp !== today) { f.box = Math.min(5, f.box + 1); f.lastUp = today; }
      } else f.box = Math.max(1, Math.min(f.box, 2));
      if (was < 3 && f.box >= 3) kz.newGreen++;
      f.due = today + KF_INTERVAL[Math.max(1, f.box)];
    }
  } else if (!ok) { f.wrong++; }
  kfSave();
  // טעות באימון – העובדה חוזרת עוד כמה שאלות
  if (!ok && kz.mode === 'daily' && (kz.reins[kfId(q.a, q.b)] || 0) < 2) {
    kz.reins[kfId(q.a, q.b)] = (kz.reins[kfId(q.a, q.b)] || 0) + 1;
    kz.queue.splice(Math.min(kz.queue.length, kz.i + 3), 0, { a: q.a, b: q.b, v: 'mul' });
  }
  const fb = $('kfFb'), full = `${q.shown.t.includes(BOX) ? q.shown.t.replace(BOX, String(q.shown.ans)) : q.shown.t + ' ' + q.shown.ans}`;
  if (kz.mode === 'place') { kz.i++; return kfQ(); }
  if (ok) {
    fb.className = 'fb show ok'; fb.innerHTML = `✔ ${M(full)}`;
    kz.i++; setTimeout(kfQ, kz.mode === 'chal' ? 250 : 500);
    return;
  }
  fb.className = 'fb show bad';
  if (kz.mode === 'chal') { fb.innerHTML = `${M(full)}`; kz.i++; setTimeout(kfQ, 900); return; }
  fb.innerHTML = `<div class="head">התשובה: ${M(full)}</div>💡 ${kfStrategy(q.a, q.b)}<div class="actions" style="justify-content:center"><button id="kfNext">הבנתי, ממשיכים ←</button></div>`;
  $('kfAns').disabled = true; $('kfGo').classList.add('hidden');
  $('kfNext').focus();
  $('kfNext').onclick = () => { kz.i++; kfQ(); };
}

function kfDone() {
  kfStopClock();
  const today = kfToday();
  let rec = '';
  if (kz.mode !== 'chal') {
    if (kf.lastDay !== today) { kf.streak = kf.lastDay === today - 1 ? (kf.streak || 0) + 1 : 1; kf.lastDay = today; }
    if (kz.mode === 'place') kf.placed = true;
    kf.sessions = (kf.sessions || 0) + 1;
  } else {
    if (kz.right > (kf.best || 0)) { rec = kf.best ? `🏆 <b>שיא חדש!</b> השיא הקודם היה ${kf.best}.` : '🏆 זה השיא הראשון שלך!'; kf.best = kz.right; }
    else rec = `השיא שלך: ${kf.best}. ${kz.right >= kf.best - 2 ? 'כמעט! 💪' : 'נסו שוב – כל יום משתפרים.'}`;
  }
  kfSave();
  const m = kfMastered();
  const sent = kf.report;
  kfReport({
    minutes: Math.max(1, Math.round((Date.now() - kz.start) / 60000)),
    mastered: `${m}/36`,
    score: kz.mode === 'chal' ? `אתגר דקה: ${kz.right} נכון` : `${kz.mode === 'place' ? 'בדיקת פתיחה' : 'אימון יומי'}: ${kz.right}/${kz.right + kz.wrong}`,
    mistakes: kz.mistakes.join(', ')
  });
  app.innerHTML = `
    <div class="card center">
      <h2>${kz.mode === 'place' ? '🧭 סיימת את בדיקת הפתיחה!' : kz.mode === 'daily' ? '⚡ סיימת את האימון היומי!' : '🏆 נגמרה הדקה!'}</h2>
      ${kz.mode === 'chal' ? `<div class="score-big">${kz.right} תרגילים נכונים בדקה</div><p>${rec}</p>`
        : `<p>✅ נכון: <b>${kz.right}</b> · ✘ לא נכון: <b>${kz.wrong}</b></p>
           <p>🗺️ בשליטה: <b>${m}</b> מתוך 36${kz.newGreen ? ` · <b>+${kz.newGreen}</b> חדשות היום 🎉` : ''}</p>
           ${kz.mode === 'place' ? '<p>מעכשיו – כל יום אימון של כ-5 דקות. נתחיל מהעובדות שעוד לא בשליטה.</p>' : `<p>🔥 ימי אימון ברצף: <b>${kf.streak}</b>. נתראה מחר!</p>`}`}
      ${sent ? `<p class="small muted">📤 התוצאות נשלחו למורה (${esc(kf.name)}, ${esc(kf.klass)}).</p>` : ''}
      <div class="actions" style="justify-content:center">
        ${kz.mode === 'chal' ? '<button id="kfAgain">🔁 עוד דקה</button>' : ''}
        <button class="${kz.mode === 'chal' ? 'secondary' : ''}" id="kfHomeBtn">→ חזרה לאימון</button>
      </div>
    </div>`;
  if ($('kfAgain')) $('kfAgain').onclick = () => kfStart('chal');
  $('kfHomeBtn').onclick = kfHome;
}

/* ---------- להדפסה בכיתה: אתגר דקה ובינגו כפל ---------- */
function kfPrintChallenge(versions, key) {
  const out = [];
  for (let v = 0; v < versions; v++) {
    const qs = Array.from({ length: 48 }, () => { const [a, b] = pick(KF_FACTS); return Math.random() < 0.5 ? [a, b] : [b, a]; });
    out.push(`<section class="ws-page"><div class="wshead"><h1>⚡ אתגר דקה – לוח הכפל${versions > 1 ? ' – נוסח ' + 'אבג'[v] : ''}</h1>
      <div class="wsmeta"><span>שם: <span class="wsline long"></span></span><span>תאריך: <span class="wsline"></span></span><span>נכון: <span class="wsline"></span></span></div></div>
      <div class="kfp-grid">${qs.map(([a, b]) => `<div>${M(`${a} × ${b} =`)}<span class="wsline"></span></div>`).join('')}</div></section>`);
    if (key) out.push(`<section class="ws-page wskey"><h2>🔑 תשובות – אתגר דקה${versions > 1 ? ' – נוסח ' + 'אבג'[v] : ''}</h2><div class="kfp-grid">${qs.map(([a, b]) => `<div>${M(`${a} × ${b} = ${a * b}`)}</div>`).join('')}</div></section>`);
  }
  return out.join('');
}
function kfPrintBingo(n) {
  const prods = [...new Set(KF_FACTS.map(([a, b]) => a * b))];
  const cards = Array.from({ length: n }, (_, i) => {
    const cells = shuffle(prods.slice()).slice(0, 24);
    cells.splice(12, 0, '⭐');
    return `<div class="kfp-bingo"><div class="kfp-bt">🎲 בינגו כפל <span class="small">· כרטיס ${i + 1}</span><div class="small">שם: ______________</div></div><table>${[0, 1, 2, 3, 4].map(r => `<tr>${cells.slice(r * 5, r * 5 + 5).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  });
  const call = shuffle(prods.slice()).map(p => { const f = shuffle(KF_FACTS.filter(([a, b]) => a * b === p)); const [a, b] = f[0]; return M(`${a} × ${b}`); });
  return `<section class="ws-page"><div class="wshead"><h1>🎲 בינגו כפל – כרטיסים לתלמידים</h1></div>
      <p class="small">המורה מקריאה תרגיל, והתלמידים מסמנים את התוצאה בכרטיס. מי שמשלים שורה, טור או אלכסון – "בינגו!" ⭐ = משבצת חופשית.</p>
      ${cards.join('')}</section>
    <section class="ws-page wskey"><h2>📋 רשימת הקריאה למורה (לפי הסדר)</h2><ol class="kfp-call">${call.map(c => `<li>${c} <span class="kfp-chk">☐</span></li>`).join('')}</ol></section>`;
}

/* ---------- כניסת מורה (קוד) ---------- */
// הקוד לא נשמר כאן – רק "טביעת אצבע" שלו. זו לא אבטחה אמיתית, אלא מניעת כניסה מקרית.
const TEACHER_HASH = '3d9bf467';
function codeHash(s) {
  let x = 0x811c9dc5;
  for (const ch of s) { x ^= ch.charCodeAt(0); x = Math.imul(x, 0x01000193) >>> 0; }
  return x.toString(16);
}
function teacherGate() {
  let shared = null;
  try { shared = localStorage.getItem('math-teacher-key'); } catch (e) { /* לא חובה */ }
  if (store.teacherKey === TEACHER_HASH || shared === TEACHER_HASH) return teacher();
  app.innerHTML = `
    <h1>🔒 כניסת מורה</h1>
    <div class="card center">
      <p>האזור הזה מיועד למורה בלבד.</p>
      <div class="name-row">
        <input id="tcode" class="ans" type="password" inputmode="numeric" autocomplete="off" placeholder="קוד מורה" aria-label="קוד מורה">
        <button id="tgo">כניסה</button>
      </div>
      <p class="muted" id="tcmsg" style="min-height:1.4em"></p>
    </div>
    <p class="center"><a class="btnlink navhome" href="${location.pathname}${gq()}">${ic('home')} לדף הבית</a></p>`;
  const tryCode = () => {
    if (codeHash('math6:' + $('tcode').value.trim()) === TEACHER_HASH) {
      store.teacherKey = TEACHER_HASH; saveStore(store);
      try { localStorage.setItem('math-teacher-key', TEACHER_HASH); } catch (e) { /* לא חובה */ }
      teacher();
    } else { $('tcmsg').textContent = 'הקוד לא נכון. נסו שוב.'; $('tcode').select(); }
  };
  $('tgo').onclick = tryCode;
  $('tcode').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });
  $('tcode').focus();
}

// חשיפה לבדיקות אוטומטיות
window.__math6 = { TOPICS, LESSONS, check, correctHTML, findTrap, speechText };

try { if (!sessionStorage.getItem('math-vis')) { sessionStorage.setItem('math-vis', '1'); track('כניסה לאתר', GRADE_NAME[GRADE] || ''); } } catch (e) { /* לא חובה */ }
if (URLP.has('print')) printBuilder(); else if (URLP.has('teacher')) teacherGate(); else if (URLP.has('kefel') && GRADE >= 3) kfHome(); else home();
</script>
