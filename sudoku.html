<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>מרכז הסודוקו – mathinclass</title>
<meta name="description" content="סודוקו 4×4, 6×6, 9×9 וסודוקו סכומים – משחק, רמזים חכמים, אתגר יומי וחוברות להדפסה">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f6f4fb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;600;700&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f6f4fb; --card: #fff; --ink: #1d2433; --muted: #5d6578; --line: #e3e0ee;
    --brand: #6b3fa0; --brand-dark: #55307f; --brand-soft: #efe8f8;
    --ok: #2b7a3e; --ok-bg: #e5f4e9; --bad: #b3261e; --hint: #fff3c4; --hint-line: #d99a00;
    --cell-line: #cdd1e3; --box-line: #2f3352; --sel: #e2d6f5; --peer: #f3eff9; --same: #d4c3ef;
    --user: #4b3aa8; --hand: 'Playpen Sans Hebrew', 'Assistant', sans-serif;
    --shadow: 0 1px 2px rgba(29, 36, 51, .06), 0 4px 14px rgba(29, 36, 51, .06);
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Assistant', 'Segoe UI', 'Arial Hebrew', sans-serif; font-size: 18px; line-height: 1.5; direction: rtl; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #1f6feb; outline-offset: 2px; }
  h1, h2, h3 { margin: 0 0 8px; line-height: 1.25; font-family: var(--hand); font-weight: 700; }
  h1 { font-size: 1.7rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); } .small { font-size: .88rem; }
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .top .brand { font-family: var(--hand); font-weight: 700; color: var(--brand); text-decoration: none; }
  .top .ttl { font-weight: 800; flex: 1; font-size: 1rem; }
  .top a.site { color: var(--muted); text-decoration: none; font-size: .9rem; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 90px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 18px; border-radius: 14px; border: 2px solid var(--brand); background: var(--brand); color: #fff; font-weight: 700; }
  .btn:hover { background: var(--brand-dark); }
  .btn.sec { background: #fff; color: var(--brand); }
  .btn.sec:hover { background: var(--brand-soft); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--brand); }
  .btn.big { min-height: 60px; font-size: 1.2rem; padding: 10px 28px; border-radius: 18px; }
  .back { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 6px 4px; min-height: 40px; }
  /* בית */
  .hero { text-align: center; padding: 10px 0 18px; }
  .hero .ic { font-size: 2.6rem; line-height: 1; }
  .hero h1 { margin-top: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; margin-top: 18px; }
  .tile { text-align: right; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-height: 120px; border-top: 5px solid var(--c, var(--brand)); }
  .tile:hover { transform: translateY(-1px); border-color: var(--c, var(--brand)); }
  .tile .ti { font-size: 1.7rem; line-height: 1.1; }
  .tile .tn { font-weight: 800; font-size: 1.08rem; }
  .tile .td { color: var(--muted); font-size: .9rem; }
  .tile .tb { margin-top: auto; font-size: .82rem; color: var(--brand); font-weight: 700; }
  .tile.teach { min-height: 0; flex-direction: row; align-items: center; gap: 12px; border-top-width: 1px; border-style: dashed; box-shadow: none; }
  .resume { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  /* בחירת לוח */
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .pcard h2 { display: flex; align-items: center; gap: 10px; }
  .mini { display: inline-grid; width: 46px; height: 46px; border: 2px solid var(--box-line); border-radius: 4px; flex: 0 0 46px; }
  .lvls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .lv { text-align: right; border: 2px solid var(--line); background: #fbfaff; border-radius: 14px; padding: 8px 12px; min-height: 58px; display: flex; flex-direction: column; justify-content: center; }
  .lv:hover { border-color: var(--brand); background: var(--brand-soft); }
  .lv .ln { font-weight: 800; } .lv .ls { font-size: .78rem; color: var(--muted); letter-spacing: 1px; }
  .lv .lc { font-size: .78rem; color: var(--ok); font-weight: 700; }
  .codebox { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .codebox input { font: inherit; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; direction: ltr; min-width: 0; width: 170px; }
  /* משחק */
  .game { display: grid; grid-template-columns: 1fr; gap: 12px; justify-items: center; }
  @media (min-width: 900px) { .game { grid-template-columns: auto 330px; align-items: start; justify-content: center; } .side { position: sticky; top: 70px; } }
  .gbar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: var(--bw); flex-wrap: wrap; }
  .gbar .gt { font-weight: 800; flex: 1; } .gbar .gid { font-size: .75rem; color: var(--muted); direction: ltr; }
  .icob { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font-size: 1.05rem; }
  .icob[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .bdw { position: relative; width: var(--bw); }
  .bd { --n: 9; display: grid; grid-template-columns: repeat(var(--n), 1fr); width: var(--bw); aspect-ratio: 1; border: 3px solid var(--box-line); border-radius: 6px; background: #fff; direction: rtl; user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
  .cl { position: relative; border: 0; border-inline-end: 1px solid var(--cell-line); border-block-end: 1px solid var(--cell-line); background: #fff; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--bw) / var(--n) * .56); font-weight: 400; color: var(--user); line-height: 1; min-width: 0; }
  .bd.kl .cl { font-size: calc(var(--bw) / var(--n) * .5); }
  .cl.ce { border-inline-end-width: 0; } .cl.re { border-block-end-width: 0; }
  .cl.tbx { border-inline-end: 3px solid var(--box-line); } .cl.tby { border-block-end: 3px solid var(--box-line); }
  .cl.giv { color: var(--ink); font-weight: 800; }
  .cl.peer { background: var(--peer); }
  .cl.same { background: var(--same); }
  .cl.sel { background: var(--sel); box-shadow: inset 0 0 0 3px var(--brand); z-index: 1; }
  .cl.bad { color: var(--bad); }
  .cl.bad::after { content: '!'; position: absolute; top: 1px; left: 3px; font-size: calc(var(--bw) / var(--n) * .26); font-weight: 900; color: var(--bad); }
  .cl.hu { background: var(--hint); }
  .cl.hk { background: #e6f1ff; }
  .cl.hc { box-shadow: inset 0 0 0 3px var(--hint-line); z-index: 1; }
  .cl.hs { font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .cl .hx { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a33; font-size: calc(var(--bw) / var(--n) * .5); font-weight: 400; opacity: .75; pointer-events: none; }
  .cl .tg { position: absolute; bottom: 1px; left: 2px; font-size: calc(var(--bw) / var(--n) * .3); color: #8a5a00; font-weight: 800; pointer-events: none; }
  .cl .gp { opacity: .45; font-weight: 700; color: #8a5a00; }
  .nt { display: grid; width: 92%; height: 92%; pointer-events: none; }
  .bd.n4 .nt, .bd.n6 .nt { grid-template-columns: repeat(3, 1fr); } .bd.n9 .nt { grid-template-columns: repeat(3, 1fr); }
  .bd.kl .nt { width: 84%; height: 80%; margin-top: 14%; }
  .nt span { display: flex; align-items: center; justify-content: center; font-size: calc(var(--bw) / var(--n) * .24); color: #6a6f88; font-weight: 600; line-height: 1; }
  .nt span.au { color: #a3a7bd; font-weight: 400; }
  .nt span.on { color: #fff; background: #d18a00; border-radius: 3px; font-weight: 800; }
  .nt span.off { color: #b3261e; text-decoration: line-through; text-decoration-thickness: 2px; font-weight: 800; }
  .nt span.dm { color: #c4c7d6; }
  .cages { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); pointer-events: none; z-index: 2; }
  .pad { display: grid; grid-template-columns: repeat(var(--pn, 9), 1fr); gap: 6px; width: var(--bw); }
  .pad button { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 1.45rem; font-weight: 800; color: var(--user); position: relative; padding: 0; }
  .pad button:active { background: var(--brand-soft); }
  .pad button .left { position: absolute; top: 2px; left: 5px; font-size: .62rem; color: var(--muted); font-weight: 700; }
  .pad button.done { opacity: .35; }
  .pad.notes button { border-style: dashed; color: #6a6f88; font-size: 1.15rem; }
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: var(--bw); }
  .tools button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: .78rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px; color: var(--ink); }
  .tools button .i { font-size: 1.2rem; line-height: 1.1; }
  .tools button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tools button:disabled { opacity: .4; cursor: default; }
  .hintp { width: var(--bw); background: #fffbea; border: 2px solid #f0d27a; border-radius: 14px; padding: 10px 12px; }
  .hintp .hh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; color: #7a5300; font-size: .9rem; }
  .hintp .ht { margin: 6px 0 8px; font-size: 1.02rem; }
  .hintp .ha { display: flex; gap: 8px; flex-wrap: wrap; }
  .hintp .ha .btn { min-height: 40px; padding: 4px 14px; font-size: .95rem; }
  .hintp .dots { letter-spacing: 3px; font-size: .8rem; }
  .msg { width: var(--bw); border-radius: 12px; padding: 8px 12px; font-weight: 700; text-align: center; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.info { background: var(--brand-soft); color: var(--brand-dark); }
  .win { position: absolute; inset: 0; z-index: 4; background: rgba(255, 255, 255, .93); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 16px; border-radius: 6px; }
  .win .wi { font-size: 2.6rem; }
  .win .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .medal-new { background: #fff5d6; border: 1px solid #ecc94b; border-radius: 12px; padding: 6px 12px; font-weight: 700; }
  .loading { width: var(--bw); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fff; border: 3px dashed var(--line); border-radius: 6px; color: var(--muted); font-weight: 700; }
  .menu { position: absolute; z-index: 6; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .14); padding: 8px; min-width: 240px; }
  .menu label, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; text-align: right; border-radius: 10px; font-size: .98rem; }
  .menu label:hover, .menu button:hover { background: var(--brand-soft); }
  .menu input { width: 20px; height: 20px; accent-color: var(--brand); }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .side .card { margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  /* הדרכה */
  .gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .gcard { text-align: right; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .gcard:hover { border-color: var(--brand); }
  .gcard .gi { font-size: 1.5rem; } .gcard .gn { font-weight: 800; } .gcard .gd { color: var(--muted); font-size: .86rem; }
  .gcard.seen .gn::after { content: ' ✓'; color: var(--ok); }
  .ghead { margin: 18px 0 8px; }
  .demo { display: grid; gap: 10px; justify-items: center; }
  .stepper { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .exp { max-width: 640px; margin: 0 auto 10px; }
  /* התקדמות */
  .path { list-style: none; padding: 0; margin: 0; }
  .path li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #fff; }
  .path li .ck { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; border: 2px solid #c9c4da; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .path li.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
  .path li.done .pt { text-decoration: line-through; color: var(--muted); }
  .path li.next { border: 2px solid var(--brand); background: var(--brand-soft); }
  .path li .pt { flex: 1; }
  .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .medal { border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; background: #fff; }
  .medal .mi { font-size: 2rem; } .medal .mn { font-weight: 800; font-size: .95rem; } .medal .md { font-size: .78rem; color: var(--muted); }
  .medal.off { opacity: .55; } .medal.off .mi { filter: grayscale(1); }
  table.st { border-collapse: collapse; width: 100%; direction: rtl; font-size: .92rem; }
  table.st th, table.st td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
  table.st th:first-child, table.st td:first-child { text-align: right; }
  table.st th { background: #f4f1fa; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .85rem; background: #fff; }
  .chip.ok { background: var(--ok-bg); border-color: #b7dfc2; } .chip.todo { background: #fff6e0; border-color: #f0d58a; }
  .daily { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
  .daily .lv { flex-direction: row; align-items: center; gap: 12px; min-height: 64px; background: #fff; }
  .daily .lv .dn { flex: 1; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2d2350; color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 50; font-weight: 700; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 520px) { .wrap { padding: 12px 10px 80px; } .tiles { grid-template-columns: 1fr 1fr; gap: 10px; } .tile { min-height: 108px; padding: 12px; } .tile .td { font-size: .82rem; } .pad { gap: 4px; } .pad button { min-height: 48px; font-size: 1.3rem; } .tools { gap: 4px; } h1 { font-size: 1.45rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  /* מחולל החוברות – ממשק */
  .bk-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .bk-grid > .card { min-width: 0; }
  .pv-wrap { overflow-x: auto; }
  .bk-sec h3 { margin-bottom: 6px; }
  .bk-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .bk-opts label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: #fff; }
  .bk-opts input { accent-color: var(--brand); width: 18px; height: 18px; }
  table.bk-t { border-collapse: collapse; direction: rtl; }
  table.bk-t th, table.bk-t td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.bk-t th:first-child, table.bk-t td:first-child { text-align: right; white-space: nowrap; }
  table.bk-t input { width: 52px; font: inherit; text-align: center; padding: 4px; border: 1px solid #cfcadf; border-radius: 8px; }
  table.bk-t td.na { color: #b8b5c8; background: #faf9fc; }
  .bk-prev { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .bk-item { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: #fff; text-align: center; font-size: .82rem; }
  .bk-item svg { width: 100%; height: auto; }
  .bk-item .bi-acts { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
  .bk-item .bi-acts button { min-width: 34px; min-height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 8px; }
  .warn { background: #fff4e0; border: 1px solid #f0c27a; color: #7a4a00; border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
  .bk-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #print { display: none; }
</style>
