<title>סליחה על הפרישה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap">
<style>
  /* Layout: a table of face-down cards (school-board green backs); tap one to flip it and reveal the question on a paper face. */
  :root {
    --bg: #eef0ea;
    --ink: #1f2a24;
    --muted: #5d6a62;
    --board: #24493a;
    --board-line: #3b6a56;
    --chalk: #f4f1e4;
    --paper: #fffdf6;
    --paper-edge: #d9d4c2;
    --accent: #e0a526;
    --display: "Suez One", "Assistant", "Arial Hebrew", serif;
    --body: "Assistant", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17; --ink: #ecefe9; --muted: #a4b0a8;
      --board: #1e3d31; --board-line: #3a6654; --chalk: #efeadb;
      --paper: #232a26; --paper-edge: #3a443e; --accent: #f0b93d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17; --ink: #ecefe9; --muted: #a4b0a8;
    --board: #1e3d31; --board-line: #3a6654; --chalk: #efeadb;
    --paper: #232a26; --paper-edge: #3a443e; --accent: #f0b93d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 1.05rem; line-height: 1.5;
    padding: 2rem 16px 3rem;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 2rem; }
  header { display: grid; gap: .5rem; text-align: center; justify-items: center; }
  .eyebrow { font-weight: 700; letter-spacing: .08em; color: var(--muted); font-size: .9rem; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0;
    font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 1.05; text-wrap: balance;
  }
  h1 .strike { position: relative; color: var(--muted); }
  h1 .strike::after {
    content: ""; position: absolute; inset-inline: -4%; top: 52%; height: .09em;
    background: var(--accent); transform: rotate(-4deg); border-radius: 2px;
  }
  .sub { margin: 0; color: var(--muted); max-width: 52ch; }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  button.ctl {
    font: 700 1rem var(--body); padding: .6rem 1.2rem; border-radius: 999px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
  }
  button.ctl.primary { background: var(--ink); color: var(--bg); }
  button.ctl:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .deck {
    display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
  }
  .card {
    perspective: 1200px; aspect-ratio: 5 / 7; max-width: 100%;
    background: none; border: 0; padding: 0; cursor: pointer; border-radius: 18px;
    font: inherit; color: inherit;
  }
  .inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .6s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden;
    display: grid; padding: 1.5rem; text-align: center;
  }
  .back {
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, var(--board-line) 27px 28px),
      var(--board);
    color: var(--chalk); place-items: center; align-content: center; gap: .6rem;
    box-shadow: 0 10px 24px -14px rgba(0,0,0,.55);
    border: 6px solid var(--board);
    outline: 2px dashed color-mix(in srgb, var(--chalk) 35%, transparent); outline-offset: -14px;
  }
  .back .logo { font-family: var(--display); font-size: 2.1rem; line-height: 1.1; }
  .back .logo span { display: block; color: var(--accent); }
  .back .num { font-weight: 700; font-size: .95rem; opacity: .8; letter-spacing: .06em; }
  .front {
    transform: rotateY(180deg); background: var(--paper); border: 1px solid var(--paper-edge);
    grid-template-rows: auto 1fr auto; gap: 1rem; color: var(--ink);
    box-shadow: 0 10px 24px -16px rgba(0,0,0,.45);
  }
  .front .top { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); font-size: .9rem; }
  .front .q {
    align-self: center; margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(1.25rem, 2.4vw, 1.55rem); line-height: 1.35; text-wrap: balance;
  }
  .front .foot { font-size: .85rem; color: var(--muted); }
  .front .foot b { color: var(--accent); }
  .card.picked .back { box-shadow: 0 0 0 4px var(--accent), 0 10px 24px -14px rgba(0,0,0,.55); }

  footer { text-align: center; color: var(--muted); font-size: .9rem; }

  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }

  @media print {
    body { background: #fff; padding: 0; }
    header .controls, .sub, footer { display: none; }
    .deck { grid-template-columns: repeat(2, 1fr); }
    .card { break-inside: avoid; }
    .card .inner { transform: none !important; }
    .card .back { display: none; }
    .card .front { transform: none; position: relative; height: 100%; }
  }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <div class="eyebrow">תל"י אלונה · מסיבת פרידה</div>
    <h1>סליחה על ה<span class="strike">שאלה</span> פרישה</h1>
    <p class="sub">שולפים כרטיס, הופכים, ועונים בכנות. לחיצה על כרטיס הופכת אותו. אפשר גם לתת לגורל לבחור.</p>
    <div class="controls">
      <button class="ctl primary" id="draw" type="button">שליפת כרטיס אקראי</button>
      <button class="ctl" id="reset" type="button">הפיכת כל הכרטיסים חזרה</button>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <footer>באהבה, מכל הצוות 💛</footer>
</div>

<script>
  const questions = [
    "אין ספק שהשארתן את חותמכן בין קירות בית הספר. מהו הדבר המשמעותי שהשתנה אצלכן בעקבות העבודה בתל\"י אלונה?",
    "ספרו על מקרה משמעותי שבו ממש הרגשתן שעשיתן עבודה חינוכית עם תלמיד או תלמידה.",
    "סיפור מצחיק שקרה לכן באחד השיעורים ואתן לא שוכחות.",
    "מה היה האירוע הכי כיף שהרמתן בבית הספר?",
    "זוכרות את היום הראשון שבו לימדתן בתל\"י אלונה? ספרו איך היה. מה הרגשתן?"
  ];
  const deck = document.getElementById("deck");
  const total = questions.length;
  questions.forEach((q, i) => {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "card"; btn.type = "button"; btn.id = "card-" + n;
    btn.setAttribute("aria-label", "כרטיס " + n + " מתוך " + total);
    btn.innerHTML = `
      <div class="inner">
        <div class="face back" aria-hidden="false">
          <div class="logo">סליחה על<span>הפרישה</span></div>
          <div class="num">כרטיס ${n} / ${total}</div>
        </div>
        <div class="face front">
          <div class="top"><span>סליחה על הפרישה</span><span>${n} / ${total}</span></div>
          <p class="q">${q}</p>
          <div class="foot">תל"י <b>אלונה</b></div>
        </div>
      </div>`;
    btn.addEventListener("click", () => {
      btn.classList.toggle("flipped");
      btn.classList.remove("picked");
    });
    deck.appendChild(btn);
  });

  const cards = () => [...deck.querySelectorAll(".card")];
  document.getElementById("draw").addEventListener("click", () => {
    const hidden = cards().filter(c => !c.classList.contains("flipped"));
    cards().forEach(c => c.classList.remove("picked"));
    if (!hidden.length) return;
    const pick = hidden[Math.floor(Math.random() * hidden.length)];
    pick.classList.add("picked");
    pick.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => { pick.classList.add("flipped"); pick.classList.remove("picked"); }, 650);
  });
  document.getElementById("reset").addEventListener("click", () => {
    cards().forEach(c => c.classList.remove("flipped", "picked"));
  });
</script>
